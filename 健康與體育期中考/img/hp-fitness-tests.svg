<rect x="420" y="116" width="176" height="112" rx="6" fill="#f6f8fc"/>
<rect x="420" y="116" width="176" height="112" rx="6" class="n"/>
<circle cx="460" cy="124" r="9" class="ln"/>
<path d="M 460 134 L 484 146 L 504 132" class="la" fill="none"/>
<line x1="438" y1="168" x2="518" y2="168" class="lm"/>
<text x="508" y="208" class="ts" text-anchor="middle">800 公尺跑</text>
<rect x="40" y="244" width="176" height="112" rx="6" fill="#f6f8fc"/>
<rect x="40" y="244" width="176" height="112" rx="6" class="n"/>
<circle cx="72" cy="278" r="9" class="ln"/>
<path d="M 82 278 L 114 276" class="ln"/>
<path d="M 114 276 L 128 288" class="ln"/>
<text x="128" y="336" class="ts" text-anchor="middle">30 秒仰臥起坐</text>
<rect x="230" y="244" width="176" height="112" rx="6" fill="#f6f8fc"/>
<rect x="230" y="244" width="176" height="112" rx="6" class="n"/>
<line x1="254" y1="250" x2="322" y2="250" class="ln"/>
<circle cx="278" cy="272" r="8" class="ln"/>
<line x1="278" y1="260" x2="278" y2="250" class="ln"/>
<line x1="298" y1="260" x2="298" y2="250" class="ln"/>
<text x="318" y="336" class="ts" text-anchor="middle">引向上</text>
<rect x="420" y="244" width="176" height="112" rx="6" fill="#f6f8fc"/>
<rect x="420" y="244" width="176" height="112" rx="6" class="n"/>
<path d="M 468 270 A 30 30 0 1 1 488 270" class="la" fill="none"/>
<circle cx="478" cy="284" r="6" class="ln"/>
<text x="508" y="336" class="ts" text-anchor="middle">一分鐘跳繩</text>
<text x="40" y="100" class="sb" text-anchor="start">體適能檢測常用的項目：每一項都有它要測的能力。</text>
</svg>
