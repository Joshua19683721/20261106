<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hp-plate-title hp-plate-desc" id="hp-plate-root">
  <title id="hp-plate-title">健康餐盤：每餐吃多少？</title>
  <desc id="hp-plate-desc">健康餐盤分成六類食物，標出每一餐建議吃的份量。</desc>
  <defs>
      <style>#hp-plate-root { --paper:#f6f8fc;--paper2:#eef2f8;--ink:#1f2933;--muted:#52606d;--soft:#7b8794;
    --rule:#c3ccd8;--accent:#1f51c9;--accent-tint:rgba(31,81,201,0.08);
    --sans:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
    --serif:'Noto Serif TC','Songti TC',serif; }
      #hp-plate-root { font-family: var(--sans); color: var(--ink); }
      #hp-plate-root .diagram-container { width:100%;overflow-x:auto }
      #hp-plate-root text { font-family:var(--sans) }
      #hp-plate-root .h { font:400 22px var(--serif);fill:var(--ink) }
      #hp-plate-root .e { font:500 12px var(--sans);fill:var(--muted) }
      #hp-plate-root .t { font:600 16px var(--sans);fill:var(--ink) }
      #hp-plate-root .ts { font:600 15px var(--sans);fill:var(--ink) }
      #hp-plate-root .s { font:500 13px var(--sans);fill:var(--soft) }
      #hp-plate-root .sb { font:500 13px var(--sans);fill:var(--ink) }
      #hp-plate-root .a { font:600 15px var(--sans);fill:var(--accent) }
      #hp-plate-root .big { font:400 44px var(--serif);fill:var(--ink) }
      #hp-plate-root .mid { font:400 34px var(--serif);fill:var(--ink) }
      #hp-plate-root .n { fill:#ffffff;stroke:var(--ink);stroke-width:1 }
      #hp-plate-root .na { fill:var(--accent-tint);stroke:var(--accent);stroke-width:1.2 }
      #hp-plate-root .ns { fill:rgba(31,41,51,0.05);stroke:var(--muted);stroke-width:1 }
      #hp-plate-root .ln { stroke:var(--ink);stroke-width:1.2;fill:none }
      #hp-plate-root .lm { stroke:var(--muted);stroke-width:1;fill:none }
      #hp-plate-root .la { stroke:var(--accent);stroke-width:1.4;fill:none }
      #hp-plate-root .dash { stroke-dasharray:5 4 }</style><marker id="hp-plate-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52606d"/></marker><marker id="hp-plate-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1f51c9"/></marker></defs>
  <rect width="100%" height="100%" fill="#f6f8fc"/>
  <text x="32" y="30" class="e">健康與體育・食在有營養</text>
<text x="32" y="58" class="h">健康餐盤：每餐吃多少？</text>
  <rect x="72" y="92" width="496" height="252" rx="12" fill="#eef2f8"/>
<rect x="72" y="92" width="496" height="252" rx="12" class="n"/>
<rect x="88" y="108" width="224" height="72" rx="6" fill="#f6f8fc"/>
<rect x="88" y="108" width="224" height="72" rx="6" class="na"/>
<text x="104" y="138" class="ts" text-anchor="start">蔬菜類</text>
<text x="104" y="162" class="a" text-anchor="start">1.5 個拳頭大</text>
<rect x="328" y="108" width="224" height="72" rx="6" fill="#f6f8fc"/>
<rect x="328" y="108" width="224" height="72" rx="6" class="n"/>
<text x="344" y="138" class="ts" text-anchor="start">穀類（飯麵）</text>
<text x="344" y="162" class="s" text-anchor="start">1 個拳頭大</text>
<rect x="88" y="196" width="224" height="72" rx="6" fill="#f6f8fc"/>
<rect x="88" y="196" width="224" height="72" rx="6" class="n"/>
<text x="104" y="226" class="ts" text-anchor="start">水果類</text>
<text x="104" y="250" class="s" text-anchor="start">1 個拳頭大</text>
<rect x="328" y="196" width="224" height="72" rx="6" fill="#f6f8fc"/>
<rect x="328" y="196" width="224" height="72" rx="6" class="n"/>
<text x="344" y="226" class="ts" text-anchor="start">豆魚蛋肉類</text>
<text x="344" y="250" class="s" text-anchor="start">1 個掌心大</text>
<rect x="88" y="284" width="224" height="72" rx="6" fill="#f6f8fc"/>
<rect x="88" y="284" width="224" height="72" rx="6" class="n"/>
<text x="104" y="314" class="ts" text-anchor="start">奶類</text>
<text x="104" y="338" class="s" text-anchor="start">1 杯</text>
<rect x="328" y="284" width="224" height="72" rx="6" fill="#f6f8fc"/>
<rect x="328" y="284" width="224" height="72" rx="6" class="n"/>
<text x="344" y="314" class="ts" text-anchor="start">堅果種子類</text>
<text x="344" y="338" class="s" text-anchor="start">1 茶匙</text>
<text x="72" y="368" class="s" text-anchor="start">每一餐照著餐盤吃，營養才會均衡；蔬菜最多，穀類、水果、豆魚蛋肉、奶、堅果依序。</text>
</svg>
