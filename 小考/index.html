<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f6fed">
<title>小考練習｜選一科，馬上開始</title>
<style>
  :root{
    --ink:#1f2933; --ink2:#52606d; --ink3:#7b8794;
    --line:#e3e9f2; --bg:#f5f7fb; --card:#fff;
    --brand:#2f6fed; --brand2:#1e56c8;
    --ok:#1f8a54; --warn:#c77700; --bad:#c0392b;
    --radius:16px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font:400 16px/1.7 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
    -webkit-text-size-adjust:100%;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .wrap{max-width:820px;margin:0 auto;padding:22px 18px 44px}

  header.top{margin-bottom:20px}
  .eyebrow{
    display:inline-block;font:700 12px/1 "Noto Sans TC",sans-serif;letter-spacing:.14em;
    color:var(--brand);background:#e9f0ff;border-radius:999px;padding:6px 11px;margin-bottom:12px;
  }
  h1{font-size:27px;line-height:1.3;margin:0 0 8px;font-weight:800;letter-spacing:-.01em}
  .lead{margin:0;color:var(--ink2);font-size:14.5px}
  .lead b{color:var(--ink);font-weight:700}

  .notice{
    display:flex;gap:10px;align-items:flex-start;
    background:#fffaf0;border:1px solid #f3e2bd;border-radius:12px;
    padding:11px 13px;margin:18px 0 22px;font-size:13.5px;color:#7a5a12;line-height:1.6;
  }
  .notice b{font-weight:800}
  .notice .ic{flex:0 0 auto;font-size:16px;line-height:1.4}

  .grid{display:grid;gap:12px}
  @media(min-width:620px){ .grid{grid-template-columns:1fr 1fr} }

  .subj{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px 16px 14px;box-shadow:0 1px 2px rgba(16,24,40,.04);
  }
  .subj-head{display:flex;align-items:center;gap:11px;margin-bottom:4px}
  .badge{
    flex:0 0 auto;width:42px;height:42px;border-radius:12px;
    display:flex;align-items:center;justify-content:center;
    color:#fff;font:800 19px/1 "Noto Sans TC",sans-serif;
  }
  .subj-name{font-size:18px;font-weight:800;line-height:1.25;margin:0}
  .subj-meta{font-size:12.5px;color:var(--ink3);margin:0 0 12px 53px;font-weight:500}

  .picks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .pick{
    appearance:none;border:0;cursor:pointer;text-decoration:none;text-align:center;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
    padding:11px 4px;border-radius:12px;
    background:#f1f5fd;color:var(--brand2);
    font:700 15px/1.1 "Noto Sans TC",sans-serif;
    transition:transform .12s ease, background .12s ease, box-shadow .12s ease;
  }
  .pick small{font-size:11px;font-weight:600;color:#6b7c99;letter-spacing:.02em}
  .pick:hover{background:#e4ecff;box-shadow:0 2px 8px rgba(47,111,237,.14)}
  .pick:active{transform:scale(.97)}

  footer{margin-top:26px;text-align:center;font-size:12.5px;color:var(--ink3)}
  footer a{color:var(--ink2);text-decoration:none;border-bottom:1px solid #cfd8e6;padding-bottom:1px}
  footer a:hover{color:var(--brand)}

  .banner{
    background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;
    margin-top:22px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;
  }
  .banner .t{font-size:13.5px;color:var(--ink2);margin:0}
  .banner .t b{color:var(--ink)}
  .btn-line{
    display:inline-block;text-decoration:none;font:700 13.5px/1 "Noto Sans TC",sans-serif;
    color:var(--brand);background:#eef3ff;border:1.5px solid #c9d9ff;border-radius:10px;padding:10px 14px;
  }
  .btn-line:hover{background:#e2ebff}

  .err{
    background:#fdecec;border:1px solid #f5c6c6;color:#8f2626;border-radius:12px;
    padding:12px 14px;font-size:13.5px;margin:16px 0;display:none;
  }
  .err.on{display:block}
</style>
</head>
<body>
<main class="wrap">

  <header class="top">
    <div class="eyebrow">四年級 ・ 短時間練習</div>
    <h1>選一科，馬上開始</h1>
    <p class="lead">每次只考 <b>20／30／40 題</b>，<b>每題 45 秒</b>，時間到自動交卷。<br>
       交卷後爸爸會收到通知，分數與詳解留給你們一起看。</p>
  </header>

  <div class="notice">
    <span class="ic">⏱</span>
    <div><b>不用註冊、不用登入。</b>點下去就開始計時；交卷前都可以回頭改答案。錯了沒關係，重點是把你卡住的地方找出來。</div>
  </div>

  <div class="err" id="err"></div>

  <div class="grid" id="grid"></div>

  <div class="banner">
    <p class="t"><b>家長專用：</b>交卷紀錄、錯題詳解、標記已檢討</p>
    <a class="btn-line" href="admin.html">進入管理頁 →</a>
  </div>

  <footer>
    共 7 科 ・ 20／30／40 題自由選<br>
    <a href="../index.html">回科目總覽</a>
  </footer>
</main>

<script src="config.js"></script>
<script src="core.js?v=d0fd3d0"></script>
<script>
(function () {
  "use strict";

  var grid = document.getElementById("grid");
  var errBox = document.getElementById("err");

  function showErr(msg) {
    errBox.textContent = msg;
    errBox.className = "err on";
  }

  if (!QCORE.configured()) {
    showErr("系統還沒設定完成：缺少 Supabase 設定。請把「小考/setup.html」的五個步驟做完，或把設定值交給爸爸。");
  }

  var doneCount = {};

  QCORE.SUBJECTS.forEach(function (s) {
    var card = document.createElement("section");
    card.className = "subj";
    card.innerHTML =
      '<div class="subj-head">' +
        '<div class="badge" style="background:' + s.color + '">' + QCORE.esc(s.badge) + '</div>' +
        '<h2 class="subj-name">' + QCORE.esc(s.short) + '</h2>' +
      '</div>' +
      '<p class="subj-meta" id="meta-' + s.id + '">' + QCORE.esc(s.name) + '</p>' +
      '<div class="picks">' +
        [20, 30, 40].map(function (n) {
          return '<a class="pick" href="quiz.html?subject=' + s.id + '&n=' + n + '">' +
                   n + ' 題<small>' + Math.round(n * (QCORE.cfg().SECONDS_PER_QUESTION || 45) / 60) + ' 分鐘</small>' +
                 '</a>';
        }).join("") +
      '</div>';
    grid.appendChild(card);
  });

  /* 有設定後端時，順便顯示各科已檢討題數，讓爸爸知道清單有在累積 */
  if (QCORE.configured()) {
    QCORE.listDone().then(function (rows) {
      (rows || []).forEach(function (r) {
        doneCount[r.subject] = (doneCount[r.subject] || 0) + 1;
      });
      QCORE.SUBJECTS.forEach(function (s) {
        var el = document.getElementById("meta-" + s.id);
        if (!el) return;
        var n = doneCount[s.id] || 0;
        el.innerHTML = QCORE.esc(s.name) + ' ・ 已檢討 <b style="color:#1f8a54">' + n + '</b> 題';
      });
    }).catch(function (e) {
      /* 後端連不上時入口頁仍然可用，但要讓爸爸知道交卷不會通知 */
      if (!document.getElementById("err").classList.contains("on")) {
        showErr("後端還沒準備好：" + (e && e.message ? e.message : "連線失敗") +
          "（小考可以開始，但交卷不會通知爸爸）");
      }
    });
  }
})();
</script>
</body>
</html>
