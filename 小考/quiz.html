<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f6fed">
<title>小考中｜小考練習</title>
<style>
  :root{
    --ink:#1f2933; --ink2:#52606d; --ink3:#7b8794;
    --line:#e3e9f2; --bg:#f5f7fb; --card:#fff;
    --brand:#2f6fed; --brand2:#1e56c8;
    --ok:#1f8a54; --warn:#c77700; --bad:#c0392b;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);color:var(--ink);
    font:400 16px/1.7 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
    -webkit-text-size-adjust:100%;
    display:flex;flex-direction:column;min-height:100dvh;
  }
  /* 讓「載入中／作答／交卷」三種畫面都能把底部按鈕推到視窗最下方 */
  #view{display:flex;flex-direction:column;flex:1 1 auto;min-height:0}

  /* ---------- 頂列 ---------- */
  .bar{
    position:sticky;top:0;z-index:20;background:rgba(245,247,251,.92);
    backdrop-filter:saturate(1.2) blur(10px);border-bottom:1px solid var(--line);
    padding-top:env(safe-area-inset-top);
  }
  .bar-in{
    max-width:760px;margin:0 auto;padding:10px 16px 0;
    display:flex;align-items:center;gap:12px;
  }
  .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
  .bar-title{font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
  .timer{
    font:800 17px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.04em;
    color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 11px;
    min-width:78px;text-align:center;
  }
  .timer.low{color:#fff;background:var(--bad);border-color:var(--bad);animation:pulse 1s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.72}}

  .progress{max-width:760px;margin:9px auto 0;padding:0 16px 9px}
  .track{height:6px;background:#e2e8f2;border-radius:999px;overflow:hidden}
  .fill{height:100%;width:0;background:var(--brand);border-radius:999px;transition:width .25s ease}
  .pmeta{display:flex;justify-content:space-between;font-size:12px;color:var(--ink3);margin-top:6px;font-weight:600}

  /* ---------- 題目 ---------- */
  main{flex:1 1 auto;width:100%;max-width:760px;margin:0 auto;padding:14px 16px 24px}
  .qcard{
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:18px 18px 8px;box-shadow:0 1px 2px rgba(16,24,40,.04);
  }
  .qhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .qno{font:800 12.5px/1 "Noto Sans TC",sans-serif;color:#fff;background:var(--brand);border-radius:999px;padding:6px 10px}
  .tag{font:700 11.5px/1 "Noto Sans TC",sans-serif;color:var(--ink2);background:#eef2f8;border-radius:999px;padding:6px 9px}
  .tag.d-易{background:#e8f6ee;color:#1f7a4d}
  .tag.d-中{background:#fff4e2;color:#9a6200}
  .tag.d-難{background:#fdeaea;color:#a82a22}

  .passage{
    background:#f7f9fc;border:1px solid #e6ecf5;border-left:4px solid #b9cdf0;border-radius:10px;
    padding:12px 14px;margin:0 0 14px;font-size:15px;line-height:1.85;color:#33414f;
    max-height:34vh;overflow:auto;
  }
  .stem{font-size:17.5px;line-height:1.75;font-weight:700;margin:0 0 16px}
  .qfig{margin:4px 0 12px;text-align:center}
  .qfig img{max-width:100%;height:auto;max-height:240px;border-radius:8px}
  .qfig figcaption{font-size:12px;color:#7b8794;margin-top:4px}
  .ph{font-family:"Times New Roman",Times,serif;font-weight:700;letter-spacing:.02em}
  .en{font-weight:800}

  /* ---------- 英文發音喇叭 ---------- */
  .spk{
    appearance:none;border:1.5px solid #c9d9ff;background:#eef3ff;color:#1e56c8;
    width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
    font-size:15px;line-height:1;cursor:pointer;flex:0 0 auto;padding:0;
    transition:background .12s,transform .1s;
  }
  .spk:hover{background:#dfe9ff}
  .spk:active{transform:scale(.94)}
  .stem.has-spk{position:relative;padding-right:44px}
  .stem .spk{position:absolute;right:0;top:0}
  .passage.has-spk{position:relative;padding-right:46px}
  .passage .spk{position:absolute;right:10px;top:10px}
  .opt .spk{margin-left:auto;align-self:center;width:30px;height:30px;font-size:14px}

  .opts{display:grid;gap:9px;margin-bottom:14px}
  .opt{
    display:flex;gap:11px;align-items:flex-start;text-align:left;width:100%;
    appearance:none;cursor:pointer;background:#fff;border:1.5px solid #dbe3ef;border-radius:12px;
    padding:13px 14px;font:600 15.5px/1.55 "Noto Sans TC","PingFang TC",sans-serif;color:var(--ink);
    transition:border-color .12s,background .12s,box-shadow .12s;
  }
  .opt:hover{border-color:#b9cdf0;background:#fbfcff}
  .opt .k{
    flex:0 0 auto;width:26px;height:26px;border-radius:8px;background:#eef2f8;color:var(--ink2);
    display:flex;align-items:center;justify-content:center;font:800 13px/1 "Noto Sans TC",sans-serif;
    margin-top:1px;transition:background .12s,color .12s;
  }
  .opt.sel{border-color:var(--brand);background:#eff4ff;box-shadow:0 0 0 3px rgba(47,111,237,.10)}
  .opt.sel .k{background:var(--brand);color:#fff}

  /* ---------- 底部 ---------- */
  .nav{
    position:sticky;bottom:0;z-index:20;background:rgba(245,247,251,.95);
    backdrop-filter:blur(10px);border-top:1px solid var(--line);
    padding:10px 16px calc(10px + env(safe-area-inset-bottom));
  }
  .nav-in{max-width:760px;margin:0 auto;display:flex;gap:9px;align-items:center}
  .btn{
    appearance:none;border:0;cursor:pointer;border-radius:11px;
    font:700 14.5px/1 "Noto Sans TC",sans-serif;padding:13px 16px;
    transition:transform .1s,background .12s,opacity .12s;
  }
  .btn:active{transform:scale(.98)}
  .btn:disabled{opacity:.4;cursor:default}
  .btn.ghost{background:#fff;border:1.5px solid #dbe3ef;color:var(--ink2)}
  .btn.ghost:hover:not(:disabled){background:#f4f7fd}
  .btn.primary{background:var(--brand);color:#fff;flex:1}
  .btn.primary:hover{background:var(--brand2)}
  .btn.sheet{background:#eef2f8;color:var(--ink2);padding:13px 14px}
  .btn.submit{background:#fff;border:1.5px solid #f0c9c4;color:#b03a2e}
  .btn.submit:hover{background:#fdf2f1}

  /* ---------- 題號表 ---------- */
  .sheet-wrap{position:fixed;inset:0;z-index:40;display:none}
  .sheet-wrap.on{display:block}
  .sheet-bg{position:absolute;inset:0;background:rgba(15,23,42,.38)}
  .sheet-wrap .sheet{
    position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:18px 18px 0 0;
    padding:18px 18px calc(18px + env(safe-area-inset-bottom));max-height:70vh;overflow:auto;
    box-shadow:0 -12px 40px rgba(15,23,42,.2);
  }
  .sheet-wrap .sheet h3{margin:0 0 4px;font-size:16px;font-weight:800}
  .sheet-wrap .sheet p{margin:0 0 14px;font-size:12.5px;color:var(--ink3)}
  .nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:7px}
  .num{
    appearance:none;border:1.5px solid #dbe3ef;background:#fff;border-radius:9px;cursor:pointer;
    padding:10px 0;font:700 13.5px/1 "Noto Sans TC",sans-serif;color:var(--ink2);
  }
  .num.done{background:#e8f6ee;border-color:#b9e3cb;color:#1f7a4d}
  .num.cur{outline:2px solid var(--brand);outline-offset:1px}

  /* ---------- 狀態畫面 ---------- */
  .stage{max-width:560px;margin:0 auto;padding:40px 20px 60px;text-align:center}
  .stage .big{font-size:44px;line-height:1;margin-bottom:16px}
  .stage h1{font-size:22px;margin:0 0 8px;font-weight:800}
  .stage p{color:var(--ink2);font-size:14.5px;margin:0 0 8px}
  .stage .card{
    background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin:20px 0;text-align:left;
  }
  .spinner{
    width:34px;height:34px;border-radius:50%;border:3px solid #dbe3ef;border-top-color:var(--brand);
    animation:spin .8s linear infinite;margin:0 auto 16px;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .err-box{background:#fdecec;border:1px solid #f5c6c6;color:#8f2626;border-radius:12px;padding:14px;font-size:14px;text-align:left;margin:16px 0}
  .ok-box{background:#eef8f2;border:1px solid #bfe5cf;color:#1c6b43;border-radius:12px;padding:14px;font-size:14px;text-align:left;margin:16px 0}
  .warn-box{background:#fff8e8;border:1px solid #f0dcb0;color:#7a5a12;border-radius:12px;padding:14px;font-size:14px;text-align:left;margin:16px 0}
  .kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed #e6ecf5;font-size:14px}
  .kv:last-child{border-bottom:0}
  .kv b{font-weight:800}
  .stage .btn{width:100%;margin-top:8px}

  @media(max-width:520px){
    .stem{font-size:16.5px}
    .bar-title{font-size:14px}
    .nav .btn{padding:12px 11px;font-size:13.5px}
  }
</style>
</head>
<body>

<div id="view"></div>

<script src="config.js"></script>
<script src="core.js"></script>
<script>
(function () {
  "use strict";

  var view = document.getElementById("view");

  var ST = {
    sub: null,
    n: 20,
    items: [],
    ans: [],
    idx: 0,
    totalSec: 0,
    left: 0,
    t0: 0,
    timer: null,
    submitting: false,
    finished: false,
    demo: false,
    lastTickWarn: -1
  };

  /* ---------------- 參數 ---------------- */
  function params() {
    var q = {};
    (location.search || "").replace(/^\?/, "").split("&").forEach(function (kv) {
      if (!kv) return;
      var i = kv.indexOf("=");
      var k = decodeURIComponent(i < 0 ? kv : kv.slice(0, i));
      var v = decodeURIComponent(i < 0 ? "" : kv.slice(i + 1));
      q[k] = v;
    });
    return q;
  }

  /* ---------------- 音效（Web Audio，無音檔） ---------------- */
  var AC = null;
  function audio() {
    if (!AC) {
      var C = window.AudioContext || window.webkitAudioContext;
      if (!C) return null;
      try { AC = new C(); } catch (e) { return null; }
    }
    if (AC.state === "suspended") { try { AC.resume(); } catch (e) { } }
    return AC;
  }
  function tone(freq, start, dur, type, peak) {
    var ac = audio(); if (!ac) return;
    var o = ac.createOscillator(), g = ac.createGain();
    o.type = type || "sine";
    o.frequency.value = freq;
    var t = ac.currentTime + start;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(peak || 0.22, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(ac.destination);
    o.start(t); o.stop(t + dur + 0.02);
  }
  function sfxTick() { tone(880, 0, 0.07, "sine", 0.12); }
  function sfxDone() {
    tone(523.25, 0, 0.14);
    tone(659.25, 0.10, 0.14);
    tone(783.99, 0.20, 0.22);
  }
  function sfxLow() {
    tone(330, 0, 0.12, "triangle", 0.16);
    tone(262, 0.13, 0.20, "triangle", 0.16);
  }

  /* ---------------- 畫面：載入中 ---------------- */
  function showLoading(msg) {
    view.innerHTML =
      '<div class="stage">' +
        '<div class="spinner"></div>' +
        '<h1>' + QCORE.esc(msg || "準備題目中…") + '</h1>' +
        '<p>第一次載入題庫需要幾秒鐘。</p>' +
      '</div>';
  }

  function showFatal(title, html) {
    view.innerHTML =
      '<div class="stage">' +
        '<div class="big">😕</div>' +
        '<h1>' + QCORE.esc(title) + '</h1>' +
        '<div class="err-box">' + html + '</div>' +
        '<a class="btn ghost" href="index.html" style="display:block;text-decoration:none;text-align:center">回科目選單</a>' +
      '</div>';
  }

  /* ---------------- 啟動 ---------------- */
  function boot() {
    var p = params();
    var sub = QCORE.getSubject(p.subject);
    var n = parseInt(p.n, 10);

    if ([20, 30, 40].indexOf(n) < 0) n = 20;

    ST.demo = p.demo === "1";
    ST.n = n;
    ST.sub = sub;

    if (!sub) { showFatal("找不到這個科目", "網址可能不完整，請回上一頁重新選科。"); return; }

    if (!QCORE.configured() && !ST.demo) {
      showFatal("系統還沒設定完成",
        "缺少 Supabase 設定，交卷後爸爸不會收到通知。<br>請把「小考/setup.html」的五個步驟做完，或把設定值交給爸爸。");
      return;
    }

    document.title = sub.short + " " + n + " 題｜小考中";
    showLoading("正在整理 " + sub.short + " 題庫…");

    var pool;
    QCORE.buildPool(sub.id).then(function (list) {
      pool = list;
      if (!pool.length) throw new Error("這個科目的題庫是空的。");

      if (ST.demo || !QCORE.configured()) {
        return { done: {}, seen: {}, retry: {} };
      }
      return Promise.all([
        QCORE.listDone(sub.id).then(function (rows) {
          var s = {}; (rows || []).forEach(function (r) { s[r.id] = 1; }); return s;
        }),
        QCORE.listSeenIds(40),
        /* 再考清單還沒建立時（舊資料庫）不影響考試 */
        QCORE.listRetry(sub.id).catch(function () { return []; })
      ]).then(function (r) {
        var retry = {};
        (r[2] || []).forEach(function (x) { retry[x.id] = 1; });
        return { done: r[0], seen: r[1], retry: retry };
      });
    }).then(function (sets) {
      var items = QCORE.pickQuiz(pool, n, sets.done, sets.seen, sets.retry);
      if (!items.length) throw new Error("目前沒有可抽的題目（可能全部都被標記已檢討了）。");
      if (items.length < n) {
        /* 題目不够就照實出，不硬湊 */
        n = items.length;
        ST.n = n;
      }
      ST.items = items;
      ST.ans = items.map(function () { return -1; });
      ST.totalSec = n * (QCORE.cfg().SECONDS_PER_QUESTION || 45);
      ST.left = ST.totalSec;
      ST.t0 = Date.now();
      startQuiz();
    }).catch(function (err) {
      showFatal("題庫載入失敗", QCORE.esc(err && err.message ? err.message : String(err)) +
        '<br><br>請確認網路連線後重新整理。');
    });
  }

  /* ---------------- 開始作答 ---------------- */
  function startQuiz() {
    view.innerHTML =
      '<header class="bar">' +
        '<div class="bar-in">' +
          '<span class="dot" style="background:' + ST.sub.color + '"></span>' +
          '<div class="bar-title">' + QCORE.esc(ST.sub.short) + ' ・ ' + ST.n + ' 題</div>' +
          '<div class="timer" id="timer">' + QCORE.fmtClock(ST.left) + '</div>' +
        '</div>' +
        '<div class="progress">' +
          '<div class="track"><div class="fill" id="fill"></div></div>' +
          '<div class="pmeta"><span id="pnum">第 1 / ' + ST.n + ' 題</span><span id="pans">已答 0 題</span></div>' +
        '</div>' +
      '</header>' +
      '<main><div class="qcard" id="qcard"></div></main>' +
      '<nav class="nav"><div class="nav-in">' +
        '<button class="btn ghost" id="prev" type="button">上一題</button>' +
        '<button class="btn sheet" id="sheetBtn" type="button">題號</button>' +
        '<button class="btn primary" id="next" type="button">下一題</button>' +
      '</div></nav>' +
      '<div class="sheet-wrap" id="sheetWrap">' +
        '<div class="sheet-bg" id="sheetBg"></div>' +
        '<div class="sheet">' +
          '<h3>作答情形</h3>' +
          '<p>綠色是已作答。點號碼可以直接跳題。</p>' +
          '<div class="nums" id="nums"></div>' +
          '<button class="btn submit" id="submitFromSheet" type="button" style="width:100%;margin-top:16px">交卷</button>' +
        '</div>' +
      '</div>';

    document.getElementById("prev").onclick = function () { go(-1); };
    document.getElementById("next").onclick = function () { go(1); };
    document.getElementById("sheetBtn").onclick = openSheet;
    document.getElementById("sheetBg").onclick = closeSheet;
    document.getElementById("submitFromSheet").onclick = function () { closeSheet(); confirmSubmit(); };

    window.addEventListener("keydown", onKey);
    window.addEventListener("beforeunload", guardLeave);

    renderQuestion();
    tick();
    ST.timer = setInterval(tick, 500);
  }

  function guardLeave(e) {
    if (ST.finished) return;
    e.preventDefault();
    e.returnValue = "";
    return "";
  }

  function onKey(e) {
    if (ST.finished) return;
    var k = e.key.toUpperCase();
    if (k === "ARROWLEFT") { go(-1); return; }
    if (k === "ARROWRIGHT") { go(1); return; }
    if (/^[A-D]$/.test(k)) {
      var i = "ABCD".indexOf(k);
      if (i < ST.items[ST.idx].o.length) { choose(i); e.preventDefault(); }
    }
  }

  function go(d) {
    var next = ST.idx + d;
    if (next < 0 || next >= ST.items.length) return;
    ST.idx = next;
    renderQuestion();
  }

  function choose(i) {
    ST.ans[ST.idx] = i;
    var btns = document.querySelectorAll(".opt");
    for (var k = 0; k < btns.length; k++) btns[k].classList.toggle("sel", k === i);
    updateMeta();
    sfxTick();
  }

  function spkBtn(text) {
    return '<span class="spk" role="button" tabindex="0" data-say="' + QCORE.esc(text) +
      '" aria-label="聽發音" title="聽發音">🔊</span>';
  }

  function renderQuestion() {
    var it = ST.items[ST.idx];
    var picked = ST.ans[ST.idx];
    var letters = "ABCDEFG";
    var isEng = ST.sub.id === "eng" || ST.sub.id === "eng4";

    QCORE.stopSpeak();

    var html = '<div class="qhead">' +
      '<span class="qno">第 ' + (ST.idx + 1) + ' 題</span>' +
      (it.u ? '<span class="tag">' + QCORE.esc(it.u) + '</span>' : '') +
      (it.d ? '<span class="tag ' + (it.d === "易" ? "d-易" : it.d === "難" ? "d-難" : "d-中") + '">' + QCORE.esc(it.d) + '</span>' : '') +
    '</div>';

    if (it.p) {
      var pSay = isEng ? QCORE.englishText(it.p) : "";
      html += '<div class="passage' + (pSay ? " has-spk" : "") + '">' + QCORE.rich(ST.sub.dir, it.p) +
        (pSay ? spkBtn(pSay) : "") +
        '</div>';
    }

    var qSay = isEng && !/_{2,}/.test(it.q) ? QCORE.englishText(it.q) : "";
    if (/^Unit\s*\d*$/i.test(qSay)) qSay = "";
    html += '<div class="stem' + (qSay ? " has-spk" : "") + '">' + QCORE.rich(ST.sub.dir, it.q) +
      (qSay ? spkBtn(qSay) : "") +
      '</div>';

    html += '<div class="opts">';
    it.o.forEach(function (t, i) {
      var say = isEng ? QCORE.englishText(t) : "";
      html += '<button class="opt' + (i === picked ? " sel" : "") + '" type="button" data-i="' + i + '">' +
        '<span class="k">' + letters.charAt(i) + '</span>' +
        '<span class="t">' + QCORE.rich(ST.sub.dir, t) + '</span>' +
        (say ? spkBtn(say) : "") +
      '</button>';
    });
    html += '</div>';

    document.getElementById("qcard").innerHTML = html;

    var btns = document.querySelectorAll(".opt");
    for (var i = 0; i < btns.length; i++) {
      btns[i].onclick = function () { choose(parseInt(this.getAttribute("data-i"), 10)); };
    }

    /* 喇叭：不能觸發選項，也不能被鍵盤 A～D 選項吃掉 */
    var spks = document.querySelectorAll("#qcard [data-say]");
    for (var j = 0; j < spks.length; j++) {
      spks[j].onclick = function (e) {
        e.preventDefault();
        e.stopPropagation();
        QCORE.speak(this.getAttribute("data-say"));
      };
      spks[j].onkeydown = function (e) {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          e.stopPropagation();
          QCORE.speak(this.getAttribute("data-say"));
        }
      };
    }

    document.getElementById("prev").disabled = ST.idx === 0;
    var nextBtn = document.getElementById("next");
    if (ST.idx === ST.items.length - 1) {
      nextBtn.textContent = "交卷";
      nextBtn.className = "btn submit";
      nextBtn.onclick = confirmSubmit;
    } else {
      nextBtn.textContent = "下一題";
      nextBtn.className = "btn primary";
      nextBtn.onclick = function () { go(1); };
    }

    updateMeta();
    window.scrollTo(0, 0);
  }

  function answeredCount() {
    return ST.ans.filter(function (x) { return x >= 0; }).length;
  }

  function updateMeta() {
    var total = ST.items.length;
    var done = answeredCount();
    var fill = document.getElementById("fill");
    var pnum = document.getElementById("pnum");
    var pans = document.getElementById("pans");
    if (fill) fill.style.width = (total ? (done / total * 100) : 0) + "%";
    if (pnum) pnum.textContent = "第 " + (ST.idx + 1) + " / " + total + " 題";
    if (pans) pans.textContent = "已答 " + done + " 題";
    var nums = document.getElementById("nums");
    if (nums && nums.childNodes.length) {
      for (var i = 0; i < nums.childNodes.length; i++) {
        var b = nums.childNodes[i];
        b.className = "num" + (ST.ans[i] >= 0 ? " done" : "") + (i === ST.idx ? " cur" : "");
      }
    }
  }

  function openSheet() {
    var nums = document.getElementById("nums");
    nums.innerHTML = "";
    for (var i = 0; i < ST.items.length; i++) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "num" + (ST.ans[i] >= 0 ? " done" : "") + (i === ST.idx ? " cur" : "");
      b.textContent = i + 1;
      b.onclick = (function (idx) {
        return function () { ST.idx = idx; renderQuestion(); closeSheet(); };
      })(i);
      nums.appendChild(b);
    }
    document.getElementById("sheetWrap").className = "sheet-wrap on";
  }
  function closeSheet() {
    document.getElementById("sheetWrap").className = "sheet-wrap";
  }

  /* ---------------- 計時 ---------------- */
  function tick() {
    if (ST.finished) return;
    var elapsed = Math.floor((Date.now() - ST.t0) / 1000);
    ST.left = ST.totalSec - elapsed;

    var el = document.getElementById("timer");
    if (el) {
      el.textContent = QCORE.fmtClock(ST.left);
      el.className = "timer" + (ST.left <= 60 ? " low" : "");
    }

    if (ST.left <= 10 && ST.left > 0 && ST.left !== ST.lastTickWarn) {
      ST.lastTickWarn = ST.left;
      sfxTick();
    }

    if (ST.left <= 0) {
      sfxLow();
      doSubmit(true);
    }
  }

  /* ---------------- 交卷 ---------------- */
  function confirmSubmit() {
    if (ST.submitting) return;
    var blank = ST.items.length - answeredCount();
    if (blank > 0) {
      var ok = window.confirm("還有 " + blank + " 題沒有作答，確定要交卷嗎？");
      if (!ok) return;
    }
    doSubmit(false);
  }

  /* 時間到但一題都沒答：不寫資料庫、也不推播，避免留下一份空的考卷 */
  function showEmptyTimeout() {
    document.title = "時間到｜小考練習";
    view.innerHTML =
      '<div class="stage">' +
        '<div class="big">⌛</div>' +
        '<h1>時間到</h1>' +
        '<p>這份考卷一題都沒有作答，所以沒有送出，也沒有通知爸爸。</p>' +
        '<div class="card">' +
          '<div class="kv"><span>科目</span><b>' + QCORE.esc(ST.sub.short) + '</b></div>' +
          '<div class="kv"><span>題數</span><b>' + ST.n + ' 題</b></div>' +
        '</div>' +
        '<a class="btn primary" href="index.html" style="display:block;text-align:center;text-decoration:none;margin-top:14px">再考一份</a>' +
      '</div>';
  }

  function doSubmit(auto) {
    if (ST.submitting || ST.finished) return;

    if (auto && answeredCount() === 0) {
      ST.finished = true;
      clearInterval(ST.timer);
      showEmptyTimeout();
      return;
    }

    ST.submitting = true;
    ST.finished = true;
    clearInterval(ST.timer);

    var elapsed = Math.min(ST.totalSec, Math.max(0, Math.floor((Date.now() - ST.t0) / 1000)));
    if (auto) elapsed = ST.totalSec;

    var correct = 0;
    var items = ST.items.map(function (it, i) {
      var picked = ST.ans[i];
      if (picked === it.a) correct++;
      return {
        id: it.id,
        u: it.u,
        d: it.d,
        q: it.q,
        o: it.o,
        a: it.a,
        e: it.e,
        w: it.w,
        p: it.p,
        paper: it.paperName,
        picked: picked
      };
    });

    var row = {
      student: QCORE.cfg().STUDENT_NAME || "兒子",
      subject: ST.sub.id,
      subject_dir: ST.sub.dir,
      subject_name: ST.sub.name,
      requested: ST.n,
      total: items.length,
      correct: correct,
      elapsed_sec: elapsed,
      ids: ST.items.map(function (x) { return x.id; }),
      items: items,
      reviewed: false
    };

    showSubmitting(auto, row);
  }

  function showSubmitting(auto, row) {
    view.innerHTML =
      '<div class="stage">' +
        '<div class="spinner"></div>' +
        '<h1>正在送出…</h1>' +
        '<p>不要關掉這個畫面。</p>' +
      '</div>';

    var adminUrl = location.href.replace(/quiz\.html.*$/, "admin.html");

    var saving = ST.demo ? Promise.resolve("demo") : QCORE.createSubmission(row);

    saving.then(function () {
      var line = QCORE.cfg().STUDENT_NAME || "兒子";
      var msg = ST.sub.short + " " + row.total + " 題，答對 " + row.correct + " 題，用時 " +
        QCORE.fmtClock(row.elapsed_sec);

      /* 有作答的「再考」題目，既然已經重新考過，就從再考清單移除 */
      if (!ST.demo) {
        var answered = ST.items.filter(function (it, i) { return ST.ans[i] >= 0; })
          .map(function (it) { return it.id; });
        QCORE.removeRetryMany(answered).catch(function () { });
      }

      if (ST.demo) return Promise.resolve(false);
      return QCORE.notify(line + "交卷了", msg, adminUrl);
    }).then(function (pushed) {
      showDone(row, auto, pushed);
    }).catch(function (err) {
      /* 送出失敗：保留資料，讓兒子可以重試 */
      showSubmitFailed(row, auto, err);
    });
  }

  function showSubmitFailed(row, auto, err) {
    ST.submitting = false;
    view.innerHTML =
      '<div class="stage">' +
        '<div class="big">📡</div>' +
        '<h1>送出失敗</h1>' +
        '<div class="err-box">' + QCORE.esc(err && err.message ? err.message : String(err)) + '</div>' +
        '<p>答案是完整的，只要再按一次就好。</p>' +
        '<button class="btn primary" id="retry" type="button" style="width:100%">再送一次</button>' +
      '</div>';
    document.getElementById("retry").onclick = function () {
      view.innerHTML = '';
      showSubmitting(auto, row);
    };
  }

  function showDone(row, auto, pushed) {
    sfxDone();
    document.title = "已送出｜小考練習";
    var showScore = !!QCORE.cfg().SHOW_SCORE_TO_STUDENT && !ST.demo;

    var html =
      '<div class="stage">' +
        '<div class="big">✅</div>' +
        '<h1>' + (auto ? "時間到，已自動交卷" : "已送出") + '</h1>';

    if (pushed) {
      html += '<div class="ok-box"><b>已通知爸爸。</b><br>這份考卷的分數和詳解，等爸爸跟你一起看。</div>';
    } else if (ST.demo) {
      html += '<div class="warn-box"><b>示範模式</b>：這次沒有寫進資料庫，也沒有推播。</div>';
    } else {
      html += '<div class="warn-box"><b>已寫進資料庫，但推播沒有送出。</b><br>爸爸打開管理頁仍然看得到這份考卷。</div>';
    }

    if (showScore) {
      html += '<div class="card">' +
        '<div class="kv"><span>答對</span><b>' + row.correct + ' / ' + row.total + '</b></div>' +
        '<div class="kv"><span>用時</span><b>' + QCORE.fmtClock(row.elapsed_sec) + '</b></div>' +
      '</div>';
    } else {
      html += '<div class="card"><div class="kv"><span>科目</span><b>' + QCORE.esc(ST.sub.short) + '</b></div>' +
        '<div class="kv"><span>題數</span><b>' + row.total + ' 題</b></div>' +
        '<div class="kv"><span>用時</span><b>' + QCORE.fmtClock(row.elapsed_sec) + '</b></div></div>';
    }

    html += '<a class="btn primary" href="index.html" style="display:block;text-align:center;text-decoration:none">再考一份</a>' +
      '</div>';

    view.innerHTML = html;
    window.removeEventListener("beforeunload", guardLeave);
  }

  boot();
})();
</script>
</body>
</html>
