<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f2933">
<title>小考管理頁｜交卷紀錄與錯題檢討</title>
<style>
  :root{
    --ink:#1f2933; --ink2:#52606d; --ink3:#7b8794;
    --line:#e3e9f2; --bg:#f4f6fa; --card:#fff;
    --brand:#2f6fed; --brand2:#1e56c8;
    --ok:#1f8a54; --warn:#c77700; --bad:#c0392b;
    --done:#5b6b7f;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);color:var(--ink);
    font:400 15.5px/1.7 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
    -webkit-text-size-adjust:100%;
  }
  a{color:var(--brand)}

  /* ---------- 頂列 ---------- */
  header.top{
    position:sticky;top:0;z-index:30;background:rgba(244,246,250,.94);
    backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
    padding-top:env(safe-area-inset-top);
  }
  .top-in{max-width:1040px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:12px}
  .logo{width:34px;height:34px;border-radius:10px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;flex:0 0 auto}
  .top h1{font-size:16.5px;margin:0;font-weight:800;line-height:1.25}
  .top .sub{font-size:12px;color:var(--ink3);font-weight:600}
  .top .sp{flex:1}
  .status{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink3);font-weight:700}
  .sdot{width:8px;height:8px;border-radius:50%;background:#c9d3e0}
  .sdot.on{background:#22a06b;box-shadow:0 0 0 3px rgba(34,160,107,.15)}
  .sdot.off{background:#d64545;box-shadow:0 0 0 3px rgba(214,69,69,.14)}

  .tabs{max-width:1040px;margin:0 auto;padding:0 18px;display:flex;gap:4px;flex-wrap:wrap}
  .tab{
    appearance:none;border:0;background:transparent;cursor:pointer;flex:0 0 auto;
    font:700 13.5px/1 "Noto Sans TC",sans-serif;color:var(--ink3);
    padding:11px 13px;border-bottom:2.5px solid transparent;margin-bottom:-1px;
  }
  .tab:hover{color:var(--ink2)}
  .tab.on{color:var(--brand);border-bottom-color:var(--brand)}
  .tab .n{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:999px;background:#e5ebf5;color:var(--ink2);font-size:11px;line-height:18px}
  .tab.on .n{background:#e0eaff;color:var(--brand2)}

  main{max-width:1040px;margin:0 auto;padding:18px}

  /* ---------- 清單 ---------- */
  .sec-title{font-size:12.5px;font-weight:800;color:var(--ink3);letter-spacing:.1em;margin:22px 0 10px}
  .list{display:grid;gap:10px}
  .row{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:14px 16px;display:flex;align-items:center;gap:14px;
    box-shadow:0 1px 2px rgba(16,24,40,.04);
  }
  .row.new{border-color:#b9cdf0;box-shadow:0 0 0 3px rgba(47,111,237,.08)}
  .row .dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
  .row .main{flex:1;min-width:0}
  .row .l1{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:2px}
  .row .subj{font-weight:800;font-size:15.5px}
  .row .when{font-size:12px;color:var(--ink3);font-weight:600}
  .row .l2{font-size:12.5px;color:var(--ink2);font-weight:600}
  .score{
    font:800 15px/1 ui-monospace,Menlo,monospace;padding:7px 10px;border-radius:9px;
    background:#eef8f2;color:#1c6b43;white-space:nowrap;
  }
  .score.mid{background:#fff6e6;color:#8a5c00}
  .score.low{background:#fdeceb;color:#a5342a}
  .pill{font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px;background:#eef2f8;color:var(--ink2)}
  .pill.todo{background:#fff2e0;color:#8a5c00}
  .pill.done{background:#e8f6ee;color:#1c6b43}
  .go{
    appearance:none;border:0;background:#eef3ff;color:var(--brand2);cursor:pointer;
    font:700 13px/1 "Noto Sans TC",sans-serif;padding:10px 13px;border-radius:10px;
  }
  .go:hover{background:#e0eaff}

  .empty{
    background:var(--card);border:1px dashed #cfd8e6;border-radius:14px;
    padding:34px 18px;text-align:center;color:var(--ink3);font-size:14px;
  }
  .empty .big{font-size:30px;margin-bottom:8px}

  /* ---------- 詳情 ---------- */
  .back{
    appearance:none;border:0;background:transparent;cursor:pointer;color:var(--ink2);
    font:700 13.5px/1 "Noto Sans TC",sans-serif;padding:8px 0;margin-bottom:8px;
  }
  .back:hover{color:var(--brand)}
  .dhead{
    background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px;
  }
  .dhead .l1{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
  .dhead h2{margin:0;font-size:20px;font-weight:800}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:6px}
  @media(max-width:560px){ .stats{grid-template-columns:repeat(2,1fr)} }
  .stat{background:#f7f9fc;border-radius:11px;padding:10px 12px}
  .stat .k{font-size:11.5px;color:var(--ink3);font-weight:700;margin-bottom:2px}
  .stat .v{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}
  .stat .v.ok{color:var(--ok)} .stat .v.bad{color:var(--bad)} .stat .v.warn{color:var(--warn)}

  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 16px}
  .btn{
    appearance:none;border:0;cursor:pointer;border-radius:10px;
    font:700 13.5px/1 "Noto Sans TC",sans-serif;padding:11px 14px;
    transition:background .12s,opacity .12s;
  }
  .btn.primary{background:var(--brand);color:#fff}
  .btn.primary:hover{background:var(--brand2)}
  .btn.ghost{background:#fff;border:1.5px solid #dbe3ef;color:var(--ink2)}
  .btn.ghost:hover{background:#f4f7fd}
  .btn.green{background:#e8f6ee;color:#1c6b43;border:1.5px solid #bfe5cf}
  .btn.green:hover{background:#dcf2e5}
  .btn.small{padding:8px 11px;font-size:12.5px}
  .btn:disabled{opacity:.45;cursor:default}

  .q{
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:18px;margin-bottom:12px;
  }
  .q.isdone{border-color:#bfe5cf;background:#fbfefc}
  .qhead{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:10px}
  .qn{font:800 12.5px/1 "Noto Sans TC",sans-serif;color:#fff;background:var(--ink);border-radius:999px;padding:6px 10px}
  .qn.ok{background:var(--ok)} .qn.bad{background:var(--bad)}
  .tag{font:700 11.5px/1 "Noto Sans TC",sans-serif;color:var(--ink2);background:#eef2f8;border-radius:999px;padding:6px 9px}
  .tag.unit{background:#eef3ff;color:#2a5bb8}
  .tag.paper{background:#f3eefb;color:#6b4a9e}
  .tag.done{background:#e8f6ee;color:#1c6b43}
  .tag.retry{background:#fff4e2;color:#9a6200}

  /* ---------- 題庫總表 ---------- */
  .st-summary{display:grid;grid-template-columns:repeat(6,1fr);gap:9px;margin-bottom:18px}
  @media(max-width:760px){.st-summary{grid-template-columns:repeat(3,1fr)}}
  .st-sum{background:#fff;border:1px solid var(--line);border-radius:13px;padding:11px 13px}
  .st-sum .k{font-size:11px;color:var(--ink3);font-weight:800;letter-spacing:.02em}
  .st-sum .v{font-size:21px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.35}
  .st-sum .v.ok{color:var(--ok)} .st-sum .v.warn{color:var(--warn)} .st-sum .v.bad{color:var(--bad)}

  .st-wrap{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:16px}
  .st-head,.st-subj>summary,.st-unit .st-row{display:grid;grid-template-columns:1.7fr repeat(5,1fr);gap:6px;align-items:center}
  .st-head{padding:10px 14px;background:#f7f9fc;font:800 11px/1.35 "Noto Sans TC",sans-serif;color:var(--ink3)}
  .st-head span:not(:first-child),.st-num{text-align:right;font-variant-numeric:tabular-nums}
  .st-subj{border-top:1px solid #eef2f8}
  .st-subj>summary{list-style:none;cursor:pointer;padding:11px 14px;font-size:13.5px}
  .st-subj>summary::-webkit-details-marker{display:none}
  .st-subj>summary:hover{background:#f9fbfe}
  .st-subj .nm{font-weight:800;display:flex;align-items:center;gap:7px;min-width:0}
  .st-subj .nm .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
  .st-num{font-weight:700;font-size:13px}
  .st-num.ok{color:var(--ok)} .st-num.warn{color:var(--warn)} .st-num.bad{color:var(--bad)}
  .st-unit{background:#fbfcfe;border-top:1px solid #f1f4f9}
  .st-unit .st-row{padding:7px 14px 7px 32px;font-size:12px;border-top:1px solid #f4f6fa}
  .st-unit .st-row:first-child{border-top:0}
  .st-unit .nm{color:var(--ink2);font-weight:700;min-width:0}
  .st-note{font-size:12px;color:var(--ink3);font-weight:600;margin-top:8px;line-height:1.6}
  .st-anom{padding:10px 14px;border-top:1px solid #eef2f8;font-size:12.5px;line-height:1.6;font-weight:700}
  .st-anom b{display:block;margin-bottom:2px}
  .st-anom .id{font:700 11px/1.4 ui-monospace,Menlo,monospace;color:var(--ink3)}

  .st-tools{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 12px}
  .st-tools select,.st-tools input{
    border:1.5px solid #dbe3ef;border-radius:10px;padding:9px 10px;background:#fff;
    font:700 13px/1 "Noto Sans TC",sans-serif;color:var(--ink2);min-width:0;
  }
  .st-tools input{flex:1;min-width:160px}
  .st-qlist{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .st-q{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-top:1px solid #eef2f8;font-size:13px}
  .st-q:first-child{border-top:0}
  .st-q .qm{flex:1;min-width:0}
  .st-q .qt{font-weight:700;line-height:1.5;word-break:break-word}
  .st-q .qu{font-size:11.5px;color:var(--ink3);font-weight:700;margin-top:2px}
  .st-q .st{flex:0 0 auto;font-size:11px;font-weight:800;border-radius:999px;padding:4px 8px;background:#eef2f8;color:var(--ink2);white-space:nowrap}
  .st-q .st.new{background:#eef2f8;color:#52606d}
  .st-q .st.seen{background:#eef3ff;color:#2a5bb8}
  .st-q .st.done{background:#e8f6ee;color:#1c6b43}
  .st-q .st.retry{background:#fff4e2;color:#9a6200}
  .st-q.is-sel{background:#f4f8ff}
  .st-q .pick{flex:0 0 auto;display:flex;align-items:center;padding-top:1px}
  .st-q .pick input{width:18px;height:18px;accent-color:var(--brand);margin:0;cursor:pointer}
  .st-selbar{
    display:flex;gap:10px;flex-wrap:wrap;align-items:center;
    background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px;
  }
  .st-check{display:flex;align-items:center;gap:7px;font:700 12.5px/1.4 "Noto Sans TC",sans-serif;color:var(--ink2);cursor:pointer}
  .st-check input{width:18px;height:18px;accent-color:var(--brand);margin:0}
  .st-selcount{font:800 13px/1.4 "Noto Sans TC",sans-serif;color:var(--brand2);white-space:nowrap}
  .st-selbar .st-note{flex:1 1 220px;margin:0;min-width:160px}
  .st-db{font:800 12px/1.5 "Noto Sans TC",sans-serif;border-radius:999px;padding:5px 10px;white-space:nowrap}
  .st-db.ok{background:#e8f6ee;color:#1c6b43}
  .st-db.warn{background:#fff4e2;color:#9a6200}
  .st-db.bad{background:#fdecec;color:#a5342a}
  @media(max-width:640px){
    .st-selbar .st-note{flex-basis:100%}
  }

  .passage{
    background:#f7f9fc;border:1px solid #e6ecf5;border-left:4px solid #b9cdf0;border-radius:10px;
    padding:12px 14px;margin:0 0 13px;font-size:14.5px;line-height:1.85;color:#33414f;
  }
  .stem{font-size:16.5px;line-height:1.75;font-weight:700;margin:0 0 13px}
  .qfig{margin:4px 0 12px;text-align:center}
  .qfig img{max-width:100%;height:auto;max-height:260px;border-radius:8px}
  .qfig figcaption{font-size:12px;color:#7b8794;margin-top:4px}
  .ph{font-family:"Times New Roman",Times,serif;font-weight:700;letter-spacing:.02em}
  .en{font-weight:800}

  .opts{display:grid;gap:7px;margin-bottom:14px}
  .opt{
    display:flex;gap:10px;align-items:flex-start;
    border:1.5px solid #e2e8f0;border-radius:11px;padding:11px 13px;
    font-size:15px;line-height:1.6;background:#fff;
  }
  .opt .k{
    flex:0 0 auto;width:25px;height:25px;border-radius:7px;background:#eef2f8;color:var(--ink2);
    display:flex;align-items:center;justify-content:center;font:800 12.5px/1 "Noto Sans TC",sans-serif;margin-top:1px;
  }
  .opt.correct{border-color:#79c79a;background:#f0fbf5}
  .opt.correct .k{background:var(--ok);color:#fff}
  .opt.wrong{border-color:#e8a19a;background:#fdf3f2}
  .opt.wrong .k{background:var(--bad);color:#fff}
  .opt .mk{display:block;font-size:11.5px;font-weight:800;margin-top:2px}
  .opt.correct .mk{color:var(--ok)}
  .opt.wrong .mk{color:var(--bad)}

  .exp{background:#f7f9fc;border-radius:11px;padding:12px 14px;margin-bottom:9px;font-size:14.5px;line-height:1.8}
  .exp .t{font-weight:800;font-size:12.5px;color:var(--ink2);margin-bottom:4px;letter-spacing:.02em}
  .exp.good{background:#f2fbf6;border-left:3px solid var(--ok)}
  .exp.bad{background:#fdf4f3;border-left:3px solid var(--bad)}
  .qfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}

  /* ---------- 工具列 / 提示 ---------- */
  .notice{
    background:#fff8e8;border:1px solid #f0dcb0;border-radius:12px;padding:12px 14px;
    font-size:13.5px;color:#7a5a12;line-height:1.65;margin-bottom:16px;
  }
  .err-box{background:#fdecec;border:1px solid #f5c6c6;color:#8f2626;border-radius:12px;padding:14px;font-size:14px;margin-bottom:16px}
  .ok-box{background:#eef8f2;border:1px solid #bfe5cf;color:#1c6b43;border-radius:12px;padding:14px;font-size:14px;margin-bottom:16px}

  #toast{
    position:fixed;left:50%;transform:translateX(-50%) translateY(20px);
    bottom:calc(20px + env(safe-area-inset-bottom));z-index:80;
    background:var(--ink);color:#fff;border-radius:12px;padding:12px 16px;
    font-size:13.5px;font-weight:700;box-shadow:0 10px 30px rgba(15,23,42,.3);
    opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:90vw;
  }
  #toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

  /* ---------- 登入 ---------- */
  .gate{max-width:420px;margin:12vh auto;padding:0 20px}
  .gate .card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:26px 24px;box-shadow:0 10px 40px rgba(16,24,40,.08)}
  .gate h1{font-size:21px;margin:0 0 6px;font-weight:800}
  .gate p{color:var(--ink2);font-size:13.5px;margin:0 0 18px}
  .gate input{
    width:100%;padding:13px 14px;border:1.5px solid #d6dfec;border-radius:11px;
    font:700 17px/1 ui-monospace,Menlo,monospace;letter-spacing:.2em;text-align:center;
  }
  .gate input:focus{outline:0;border-color:var(--brand);box-shadow:0 0 0 3px rgba(47,111,237,.14)}
  .gate .btn{width:100%;margin-top:12px}
  .gate .hint{font-size:12px;color:var(--ink3);margin-top:14px;text-align:center}

  @media(max-width:640px){
    .top-in{padding:10px 14px}
    .top h1{font-size:15px}
    main{padding:14px}
    .row{flex-wrap:wrap}
    .row .go{margin-left:auto}
    .q{padding:15px}
    .stem{font-size:15.5px}
  }
</style>
</head>
<body>

<div id="app"></div>
<div id="toast"></div>

<script src="config.js"></script>
<script src="core.js"></script>
<script>
(function () {
  "use strict";

  var app = document.getElementById("app");
  var toastEl = document.getElementById("toast");

  var A = {
    unlocked: false,
    rows: [],
    known: {},
    firstLoad: true,
    poll: null,
    detail: null,
    doneSet: {},
    retrySet: {},
    retryErr: null,
    showAll: false,
    tab: "todo",
    manifest: null,
    statMeta: null,
    statSeen: {},
    statDone: {},
    statRetry: {},
    statRetryErr: null,
    statFilter: { s: "", t: "", q: "" },
    statSel: {},
    statDbCount: null,
    statImporting: false
  };

  /* ---------------- 共用小工具 ---------------- */
  function toast(msg, ms) {
    toastEl.textContent = msg;
    toastEl.className = "on";
    clearTimeout(toastEl._t);
    toastEl._t = setTimeout(function () { toastEl.className = ""; }, ms || 3200);
  }

  var AC = null;
  function beep() {
    try {
      var C = window.AudioContext || window.webkitAudioContext;
      if (!C) return;
      if (!AC) AC = new C();
      if (AC.state === "suspended") AC.resume();
      [880, 1174.66, 1567.98].forEach(function (f, i) {
        var o = AC.createOscillator(), g = AC.createGain();
        o.type = "sine"; o.frequency.value = f;
        var t = AC.currentTime + i * 0.11;
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(0.18, t + 0.012);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.26);
        o.connect(g); g.connect(AC.destination);
        o.start(t); o.stop(t + 0.3);
      });
    } catch (e) { }
  }

  function subjOf(id) { return QCORE.getSubject(id) || { short: id, color: "#888", badge: "?" }; }

  function scoreClass(c, t) {
    var r = t ? c / t : 0;
    return r >= 0.9 ? "" : r >= 0.7 ? " mid" : " low";
  }

  /* ---------------- 入口：登入或清單 ---------------- */
  function render() {
    if (!QCORE.configured()) {
      app.innerHTML =
        '<div class="gate"><div class="card">' +
          '<h1>還沒設定後端</h1>' +
          '<p>這個管理頁需要 Supabase 才能讀取交卷紀錄。</p>' +
          '<a class="btn primary" href="setup.html" style="display:block;text-align:center;text-decoration:none;padding:12px">前往設定</a>' +
        '</div></div>';
      return;
    }

    if (!A.unlocked) { renderGate(); return; }

    var hash = (location.hash || "").replace(/^#/, "");
    if (hash.indexOf("s=") === 0) { renderDetail(hash.slice(2)); return; }
    renderList();
  }

  function renderGate() {
    app.innerHTML =
      '<div class="gate"><div class="card">' +
        '<h1>小考管理頁</h1>' +
        '<p>輸入密碼。這裡有兒子的交卷紀錄與錯題詳解。</p>' +
        '<input id="pw" type="password" inputmode="numeric" autocomplete="off" placeholder="••••">' +
        '<button class="btn primary" id="go" type="button">進入</button>' +
        '<div class="hint">密碼可以在 <code>小考/config.js</code> 的 <code>ADMIN_PASSCODE</code> 修改。</div>' +
      '</div></div>';

    var pw = document.getElementById("pw");
    var go = function () {
      if (pw.value === String(QCORE.cfg().ADMIN_PASSCODE || "2026")) {
        A.unlocked = true;
        try { sessionStorage.setItem("qc_admin_ok", "1"); } catch (e) { }
        askNotifyPermission();
        startPolling();
        render();
      } else {
        pw.value = "";
        toast("密碼不對");
        pw.focus();
      }
    };
    document.getElementById("go").onclick = go;
    pw.addEventListener("keydown", function (e) { if (e.key === "Enter") go(); });
    pw.focus();
  }

  function askNotifyPermission() {
    try {
      if ("Notification" in window && Notification.permission === "default") {
        Notification.requestPermission();
      }
    } catch (e) { }
  }

  /* ---------------- 清單 ---------------- */
  function renderList() {
    var todo = A.rows.filter(function (r) { return !r.reviewed; });
    var doneAll = A.rows.filter(function (r) { return r.reviewed; });
    var list = A.tab === "todo" ? todo : A.tab === "done" ? doneAll : A.rows;

    var html =
      '<header class="top"><div class="top-in">' +
        '<div class="logo">考</div>' +
        '<div><h1>小考管理頁</h1><div class="sub">' + QCORE.esc(QCORE.cfg().STUDENT_NAME || "兒子") + '的交卷紀錄</div></div>' +
        '<div class="sp"></div>' +
        '<div class="status"><span class="sdot on" id="sdot"></span><span id="stxt">已連線</span></div>' +
      '</div>' +
      '<div class="tabs">' +
        tabBtn("todo", "待檢討", todo.length) +
        tabBtn("all", "全部", A.rows.length) +
        tabBtn("done", "已檢討", doneAll.length) +
        tabBtn("bank", "已標記題目", "") +
        tabBtn("retry", "再考清單", "") +
        tabBtn("stats", "題庫總表", "") +
      '</div></header>';

    html += '<main>';

    if (A.tab === "bank") {
      html += '<div id="bankBox"><div class="empty">載入中…</div></div>';
    } else if (A.tab === "retry") {
      html += '<div id="retryBox"><div class="empty">載入中…</div></div>';
    } else if (A.tab === "stats") {
      html += '<div id="statsBox"><div class="empty">正在核對題庫與資料庫…</div></div>';
    } else if (!list.length) {
      html += '<div class="empty"><div class="big">🎉</div>' +
        (A.tab === "todo" ? "目前沒有待檢討的考卷。" : "這裡還沒有紀錄。") + '</div>';
    } else {
      html += '<div class="sec-title">' + (A.tab === "todo" ? "等待你一起看" : "全部紀錄") + '</div><div class="list">';
      list.forEach(function (r) {
        var s = subjOf(r.subject);
        var isNew = !r.reviewed;
        html += '<div class="row' + (isNew ? " new" : "") + '" data-id="' + QCORE.esc(r.id) + '">' +
          '<span class="dot" style="background:' + s.color + '"></span>' +
          '<div class="main">' +
            '<div class="l1"><span class="subj">' + QCORE.esc(s.short) + '</span>' +
              '<span class="when">' + QCORE.esc(QCORE.fmtDateTime(r.created_at)) + '</span>' +
              (r.reviewed ? '<span class="pill done">已檢討</span>' : '<span class="pill todo">待檢討</span>') +
            '</div>' +
            '<div class="l2">' + r.total + ' 題 ・ 用時 ' + QCORE.fmtClock(r.elapsed_sec) +
              ' ・ 錯 ' + (r.total - r.correct) + ' 題</div>' +
          '</div>' +
          '<div class="score' + scoreClass(r.correct, r.total) + '">' + r.correct + '/' + r.total + '</div>' +
          '<button class="go" type="button" data-open="' + QCORE.esc(r.id) + '">檢討</button>' +
        '</div>';
      });
      html += '</div>';
    }
    html += '</main>';

    app.innerHTML = html;

    app.querySelectorAll("[data-open]").forEach(function (b) {
      b.onclick = function () { location.hash = "s=" + b.getAttribute("data-open"); };
    });
    app.querySelectorAll(".tab").forEach(function (b) {
      b.onclick = function () { A.tab = b.getAttribute("data-tab"); render(); };
    });

    if (A.tab === "bank") renderBank();
    if (A.tab === "retry") renderRetry();
    if (A.tab === "stats") renderStats();
  }

  function tabBtn(id, label, n) {
    return '<button class="tab' + (A.tab === id ? " on" : "") + '" type="button" data-tab="' + id + '">' +
      label + (n === "" ? "" : '<span class="n">' + n + '</span>') + '</button>';
  }

  /* ---------------- 已標記題目 ---------------- */
  function renderBank() {
    QCORE.listDone().then(function (rows) {
      var box = document.getElementById("bankBox");
      if (!box) return;
      if (!rows || !rows.length) {
        box.innerHTML = '<div class="empty"><div class="big">📚</div>還沒有標記任何題目。<br>檢討完一份考卷後，把題目標記起來，下次就不會再抽到。</div>';
        return;
      }
      var html = '<div class="sec-title">已標記 ' + rows.length + ' 題（下次出卷會跳過）</div><div class="list">';
      rows.forEach(function (r) {
        var s = subjOf(r.subject);
        html += '<div class="row">' +
          '<span class="dot" style="background:' + s.color + '"></span>' +
          '<div class="main">' +
            '<div class="l1"><span class="subj">' + QCORE.esc(s.short) + '</span>' +
              (r.unit ? '<span class="tag unit">' + QCORE.esc(r.unit) + '</span>' : '') +
              '<span class="when">' + QCORE.esc(QCORE.fmtDateTime(r.created_at)) + '</span>' +
            '</div>' +
            '<div class="l2">' + QCORE.esc(QCORE.plain(r.label || r.id)) + '</div>' +
          '</div>' +
          '<button class="go" type="button" data-unmark="' + QCORE.esc(r.id) + '">取消</button>' +
        '</div>';
      });
      html += '</div>';
      box.innerHTML = html;
      box.querySelectorAll("[data-unmark]").forEach(function (b) {
        b.onclick = function () {
          var id = b.getAttribute("data-unmark");
          if (!confirm("取消標記後，這題會再出現在下次小考。確定嗎？")) return;
          QCORE.removeDone(id).then(function () {
            toast("已取消標記");
            renderBank();
            loadRows();
          }).catch(function (e) { toast("取消失敗：" + e.message); });
        };
      });
    }).catch(function (e) {
      var box = document.getElementById("bankBox");
      if (box) box.innerHTML = '<div class="err-box">讀取失敗：' + QCORE.esc(e.message) + '</div>';
    });
  }

  /* ---------------- 再考清單 ---------------- */
  function renderRetry() {
    var box = document.getElementById("retryBox");
    if (!box) return;

    QCORE.listRetry().then(function (rows) {
      if (!rows || !rows.length) {
        box.innerHTML = '<div class="empty"><div class="big">🔁</div>再考清單是空的。<br>在考卷裡把討論過的錯題按「討論過了，放回題庫」，下次小考就會優先出這些題目。</div>';
        return;
      }

      var html = '<div class="sec-title">再考清單 ' + rows.length + ' 題（下次小考優先出）</div><div class="list">';
      rows.forEach(function (r) {
        var s = subjOf(r.subject);
        html += '<div class="row">' +
          '<span class="dot" style="background:' + s.color + '"></span>' +
          '<div class="main">' +
            '<div class="l1"><span class="subj">' + QCORE.esc(s.short) + '</span>' +
              (r.unit ? '<span class="tag unit">' + QCORE.esc(r.unit) + '</span>' : '') +
              '<span class="when">' + QCORE.esc(QCORE.fmtDateTime(r.created_at)) + '</span>' +
            '</div>' +
            '<div class="l2">' + QCORE.esc(QCORE.plain(r.label || r.id)) + '</div>' +
          '</div>' +
          '<button class="go" type="button" data-unretry3="' + QCORE.esc(r.id) + '">取消</button>' +
        '</div>';
      });
      html += '</div>';
      box.innerHTML = html;

      box.querySelectorAll("[data-unretry3]").forEach(function (b) {
        b.onclick = function () {
          QCORE.removeRetry(b.getAttribute("data-unretry3")).then(function () {
            toast("已從再考清單移除");
            renderRetry();
          }).catch(function (e) { toast("取消失敗：" + e.message); });
        };
      });
    }).catch(function (e) {
      box.innerHTML = '<div class="err-box">' + QCORE.esc(e.message) + '</div>' +
        '<div class="notice">請到 Supabase → SQL Editor 執行最新版的「小考/supabase.sql」，建立 <code>retry_questions</code> 資料表。</div>';
    });
  }

  /* ---------------- 題庫總表／資料檢查 ---------------- */
  function sumCard(k, v, cls) {
    return '<div class="st-sum"><div class="k">' + k + '</div><div class="v' + (cls ? " " + cls : "") + '">' + v + '</div></div>';
  }

  function numCell(n, cls) {
    return '<span class="st-num' + (cls ? " " + cls : "") + '">' + n + '</span>';
  }

  function statOf(x) {
    return x.done ? "done" : x.retry ? "retry" : x.seen ? "seen" : "new";
  }

  function statLabel(k) {
    return k === "done" ? "已檢討" : k === "retry" ? "再考" : k === "seen" ? "測驗過" : "未測驗";
  }

  function anomBlock(title, list) {
    var h = '<div class="st-anom"><b>' + QCORE.esc(title) + '（' + list.length + '）</b>';
    list.slice(0, 40).forEach(function (x) {
      var line = x.label ? QCORE.plain(x.label) : "";
      if (x.unit) line += (line ? " ・ " : "") + x.unit;
      if (!line) line = x.id || "";
      h += '<div>' + QCORE.esc(line) + ' <span class="id">' + QCORE.esc(x.id || "") + '</span></div>';
    });
    if (list.length > 40) h += '<div class="st-note">只列出前 40 筆。</div>';
    return h + '</div>';
  }

  function paintStatQ() {
    var box = document.getElementById("stQList");
    if (!box || !A.statMeta) return;

    var selS = document.getElementById("stSubj");
    var selT = document.getElementById("stStat");
    var inp = document.getElementById("stQ");
    var fs = selS ? selS.value : "";
    var ft = selT ? selT.value : "";
    var rawQ = inp ? (inp.value || "") : "";
    var q = rawQ.trim().toLowerCase();
    A.statFilter = { s: fs, t: ft, q: rawQ };

    var rows = A.statMeta.filter(function (x) {
      if (fs && x.s !== fs) return false;
      if (ft && statOf(x) !== ft) return false;
      if (q && (x.t || "").toLowerCase().indexOf(q) < 0) return false;
      return true;
    });

    var LIMIT = 200;
    var html = '<div class="st-qlist">';

    if (!rows.length) {
      html += '<div class="empty" style="border:0;border-radius:0">沒有符合條件的題目。</div>';
    } else {
      rows.slice(0, LIMIT).forEach(function (x) {
        var s = subjOf(x.s);
        var k = statOf(x);
        var picked = !!A.statSel[x.id];
        html += '<label class="st-q' + (picked ? " is-sel" : "") + '">' +
          '<span class="pick"><input type="checkbox" class="st-chk" data-id="' + QCORE.esc(x.id) + '"' + (picked ? " checked" : "") + '></span>' +
          '<span class="qm">' +
            '<span class="qt" style="display:block">' + QCORE.esc(x.t || x.id) + '</span>' +
            '<span class="qu" style="display:block">' + QCORE.esc(s.short) + (x.u ? ' ・ ' + QCORE.esc(x.u) : '') + '</span>' +
          '</span><span class="st ' + k + '">' + statLabel(k) + '</span></label>';
      });
    }
    html += '</div>';
    if (rows.length > LIMIT) {
      html += '<div class="st-note">共 ' + rows.length + ' 題，清單只顯示前 ' + LIMIT +
        ' 題；「全選目前篩選」仍會選到全部 ' + rows.length + ' 題。</div>';
    }
    box.innerHTML = html;

    box.querySelectorAll(".st-chk").forEach(function (c) {
      c.onchange = function () {
        var id = c.getAttribute("data-id");
        if (c.checked) A.statSel[id] = 1;
        else delete A.statSel[id];
        var lab = c.closest(".st-q");
        if (lab) lab.classList.toggle("is-sel", c.checked);
        updateSelBar(rows);
      };
    });

    var all = document.getElementById("stAll");
    if (all) {
      all.onchange = function () {
        rows.forEach(function (x) {
          if (all.checked) A.statSel[x.id] = 1;
          else delete A.statSel[x.id];
        });
        paintStatQ();
      };
    }

    var pickSeen = document.getElementById("stPickSeen");
    if (pickSeen) {
      pickSeen.onclick = function () {
        A.statSel = {};
        A.statMeta.forEach(function (x) { if (x.seen) A.statSel[x.id] = 1; });
        var t = document.getElementById("stStat");
        if (t) t.value = "seen";
        paintStatQ();
        toast("已勾選 " + Object.keys(A.statSel).length + " 題測驗過的題目");
      };
    }

    var addBtn = document.getElementById("stAddRetry");
    if (addBtn) addBtn.onclick = addSelectedToRetry;

    var clearBtn = document.getElementById("stClearSel");
    if (clearBtn) {
      clearBtn.onclick = function () {
        A.statSel = {};
        paintStatQ();
      };
    }

    updateSelBar(rows);
  }

  function selectedIds() {
    var map = {};
    (A.statMeta || []).forEach(function (x) { map[x.id] = 1; });
    Object.keys(A.statSel).forEach(function (id) {
      if (!map[id]) delete A.statSel[id];
    });
    return Object.keys(A.statSel);
  }

  function updateSelBar(rows) {
    rows = rows || [];
    var ids = selectedIds();
    var n = ids.length;
    var inFilter = rows.filter(function (x) { return A.statSel[x.id]; }).length;

    var count = document.getElementById("stSelCount");
    if (count) {
      count.textContent = n
        ? "已選 " + n + " 題" + (inFilter !== n ? "（目前篩選 " + inFilter + " 題）" : "")
        : "已選 0 題";
    }

    var all = document.getElementById("stAll");
    if (all) {
      all.disabled = !rows.length;
      all.checked = rows.length > 0 && inFilter === rows.length;
      all.indeterminate = inFilter > 0 && inFilter < rows.length;
    }
    var allN = document.getElementById("stAllN");
    if (allN) allN.textContent = "(" + rows.length + ")";

    var add = document.getElementById("stAddRetry");
    if (add) {
      add.disabled = !n || !!A.statRetryErr;
      add.textContent = n ? "加入再考清單（" + n + " 題）" : "加入再考清單";
      add.title = A.statRetryErr ? "需要先建立 retry_questions 資料表" : "";
    }
    var clear = document.getElementById("stClearSel");
    if (clear) clear.disabled = !n;
  }

  function addSelectedToRetry() {
    var ids = selectedIds();
    if (!ids.length) { toast("請先勾選題目"); return; }
    if (A.statRetryErr) { toast("請先建立再考清單資料表"); return; }

    var map = {};
    (A.statMeta || []).forEach(function (x) { map[x.id] = x; });
    var rows = ids.map(function (id) { return map[id]; }).filter(Boolean).map(function (x) {
      return { id: x.id, subject: x.s, label: x.t || "", unit: x.u || "" };
    });
    if (!rows.length) return;

    if (!confirm("把這 " + rows.length + " 題加入再考清單？\n下次小考會優先出這些題目。")) return;

    var btn = document.getElementById("stAddRetry");
    if (btn) { btn.disabled = true; btn.textContent = "加入中…"; }

    QCORE.addRetry(rows)
      .then(function () {
        /* 已檢討的題目要放回題庫，先從已檢討清單移除，兩張表不要同時有 */
        return QCORE.removeDoneMany(rows.map(function (x) { return x.id; }));
      })
      .then(function () {
        A.statSel = {};
        toast("已加入 " + rows.length + " 題，下次小考會優先出題");
        renderStats();
      })
      .catch(function (e) {
        toast("加入失敗：" + e.message);
        if (btn) { btn.disabled = false; btn.textContent = "加入再考清單（" + rows.length + " 題）"; }
      });
  }

  function dbBadge(n, total) {
    if (n === null || typeof n === "undefined") {
      return '<span class="st-db bad" id="stDbBadge">資料庫題庫：尚未建立</span>';
    }
    if (n === total) {
      return '<span class="st-db ok" id="stDbBadge">資料庫題庫：' + n + ' 題 ✓</span>';
    }
    return '<span class="st-db warn" id="stDbBadge">資料庫題庫：' + n + ' / ' + total + ' 題</span>';
  }

  function importQuestionsToDb() {
    if (A.statImporting || !A.statMeta) return;
    var total = A.statMeta.length;
    if (A.statDbCount === null) {
      toast("請先在 Supabase 執行最新版 supabase.sql");
      return;
    }
    if (!confirm("把題庫檔的 " + total + " 題匯入資料庫？\n已存在的題目會更新，不會影響交卷紀錄。")) return;

    A.statImporting = true;
    var badge = document.getElementById("stDbBadge");
    var btn = document.getElementById("stImport");
    if (btn) { btn.disabled = true; btn.textContent = "匯入中…"; }
    if (badge) badge.textContent = "資料庫題庫：讀取題庫檔…";

    fetch("questions.json", { cache: "no-store" })
      .then(function (r) {
        if (!r.ok) throw new Error("讀不到 questions.json（" + r.status + "）");
        return r.json();
      })
      .then(function (j) {
        var rows = (j && j.rows) || [];
        if (!rows.length) throw new Error("questions.json 沒有題目");
        return QCORE.importQuestions(rows, function (done, all) {
          if (badge) badge.textContent = "資料庫題庫：匯入中 " + done + " / " + all;
        });
      })
      .then(function (n) {
        A.statImporting = false;
        A.statDbCount = n;
        toast("已匯入 " + n + " 題到資料庫");
        renderStats();
      })
      .catch(function (e) {
        A.statImporting = false;
        if (btn) { btn.disabled = false; btn.textContent = "匯入／更新資料庫題庫"; }
        if (badge) badge.textContent = "資料庫題庫：匯入失敗";
        toast("匯入失敗：" + e.message);
      });
  }

  function renderStats() {
    var box = document.getElementById("statsBox");
    if (!box) return;
    box.innerHTML = '<div class="empty">正在核對題庫與資料庫…</div>';

    Promise.all([
      fetch("manifest.json", { cache: "no-store" }).then(function (r) {
        if (!r.ok) throw new Error("讀不到題庫總表 manifest.json（" + r.status + "）");
        return r.json();
      }),
      QCORE.listDone(),
      QCORE.listRetry().then(function (rows) {
        return { rows: rows || [], err: null };
      }).catch(function (e) {
        return { rows: [], err: e };
      }),
      QCORE.listSeenIds(1000),
      QCORE.countQuestions()
    ]).then(function (r) {
      var m = r[0] || {};
      var doneRows = r[1] || [];
      var retryRes = r[2] || { rows: [], err: null };
      var seen = r[3] || {};
      var dbCount = typeof r[4] === "number" ? r[4] : null;

      var doneSet = {}, retrySet = {};
      doneRows.forEach(function (x) { doneSet[x.id] = 1; });
      (retryRes.rows || []).forEach(function (x) { retrySet[x.id] = 1; });

      A.manifest = m;
      A.statSeen = seen;
      A.statDone = doneSet;
      A.statRetry = retrySet;
      A.statRetryErr = retryRes.err;
      A.statDbCount = dbCount;

      var qmap = m.questions || {};
      var subs = m.subjects || [];
      var bySub = {};
      var meta = [];

      subs.forEach(function (s) {
        var uMap = {};
        (s.units || []).forEach(function (u) {
          uMap[u.u] = { u: u.u, n: 0, t: 0, done: 0, retry: 0 };
        });
        bySub[s.id] = { sub: s, uMap: uMap, n: 0, t: 0, done: 0, retry: 0 };
      });

      Object.keys(qmap).forEach(function (id) {
        var e = qmap[id];
        var s = bySub[e.s];
        if (!s) return;
        if (!s.uMap[e.u]) s.uMap[e.u] = { u: e.u || "其他", n: 0, t: 0, done: 0, retry: 0 };

        var u = s.uMap[e.u];
        var isSeen = !!seen[id];
        var isDone = !!doneSet[id];
        var isRetry = !!retrySet[id];

        s.n++; u.n++;
        if (isSeen) { s.t++; u.t++; }
        if (isDone) { s.done++; u.done++; }
        if (isRetry) { s.retry++; u.retry++; }

        meta.push({ id: id, s: e.s, u: e.u || "", t: e.t || "", seen: isSeen, done: isDone, retry: isRetry });
      });

      A.statMeta = meta;

      var totalSeen = meta.filter(function (x) { return x.seen; }).length;
      var totalDone = meta.filter(function (x) { return x.done; }).length;
      var totalRetry = meta.filter(function (x) { return x.retry; }).length;

      var orphanDone = [], orphanRetry = [], both = [], doneNotSeen = [];
      doneRows.forEach(function (x) {
        if (!qmap[x.id]) orphanDone.push(x);
        else if (!seen[x.id]) doneNotSeen.push(x);
        if (retrySet[x.id]) both.push({ id: x.id, label: x.label, unit: x.unit });
      });
      (retryRes.rows || []).forEach(function (x) {
        if (!qmap[x.id]) orphanRetry.push(x);
      });

      var anomalies = orphanDone.length + orphanRetry.length + both.length;

      var html = '<div class="toolbar" style="margin:0 0 12px">' +
        '<button class="btn ghost small" id="stRefresh" type="button">重新檢查資料庫</button>' +
        '<button class="btn primary small" id="stImport" type="button"' +
          (A.statDbCount === null || A.statImporting ? " disabled" : "") + '>匯入／更新資料庫題庫</button>' +
        dbBadge(A.statDbCount, meta.length) +
        '<span class="st-note" style="margin:0;align-self:center">題庫版本 ' +
          QCORE.esc(m.generated_at ? QCORE.fmtDateTime(m.generated_at) : "未知") +
          ' ・ 已測驗累計自最近 1000 份考卷</span>' +
      '</div>' +
      '<div class="st-summary">' +
        sumCard("題庫總題數", meta.length) +
        sumCard("已測驗", totalSeen, "ok") +
        sumCard("未測驗", meta.length - totalSeen) +
        sumCard("已檢討", totalDone, "ok") +
        sumCard("再考", totalRetry, "warn") +
        sumCard("資料異常", anomalies, anomalies ? "bad" : "ok") +
      '</div>';

      html += '<div class="sec-title">各科／單元統計（點科目展開單元）</div>' +
        '<div class="st-wrap">' +
          '<div class="st-head"><span>科目／單元</span><span>總題數</span><span>已測驗</span><span>未測驗</span><span>已檢討</span><span>再考</span></div>';

      subs.forEach(function (s) {
        var st = bySub[s.id];
        if (!st) return;

        var units = Object.keys(st.uMap).map(function (k) { return st.uMap[k]; })
          .sort(function (a, b) { return b.n - a.n || String(a.u).localeCompare(String(b.u), "zh-Hant"); });

        html += '<details class="st-subj"><summary>' +
          '<span class="nm"><span class="dot" style="background:' + s.color + '"></span>' + QCORE.esc(s.short) + '</span>' +
          numCell(st.n) + numCell(st.t, "ok") + numCell(st.n - st.t) + numCell(st.done, "ok") + numCell(st.retry, "warn") +
        '</summary><div class="st-unit">';

        units.forEach(function (u) {
          html += '<div class="st-row"><span class="nm">' + QCORE.esc(u.u) + '</span>' +
            numCell(u.n) + numCell(u.t, "ok") + numCell(u.n - u.t) + numCell(u.done, "ok") + numCell(u.retry, "warn") +
          '</div>';
        });

        html += '</div></details>';
      });
      html += '</div>';

      html += '<div class="sec-title">資料檢查</div>';

      if (retryRes.err) {
        html += '<div class="notice"><b>「再考清單」資料表還沒建立。</b><br>' +
          '請到 Supabase → SQL Editor 執行最新版的「小考/supabase.sql」，再考功能才會生效。<br>' +
          '<span class="id">' + QCORE.esc(retryRes.err.message) + '</span></div>';
      }

      if (A.statDbCount === null) {
        html += '<div class="notice"><b>「資料庫題庫」還沒建立或讀不到。</b><br>' +
          '請到 Supabase → SQL Editor 執行最新版的「小考/supabase.sql」（會新增 <code>questions</code> 資料表，不會刪除舊資料），' +
          '再按上面的「重新檢查資料庫」。</div>';
      } else if (A.statDbCount !== meta.length) {
        html += '<div class="notice"><b>資料庫題庫目前 ' + A.statDbCount + ' 題，題庫檔有 ' + meta.length + ' 題。</b><br>' +
          '按上面的「匯入／更新資料庫題庫」，就會把缺少的題目補進去、舊題目更新。</div>';
      }

      if (!anomalies) {
        html += '<div class="ok-box">✅ 題庫與資料庫一致：' + meta.length +
          ' 題都在題庫裡，沒有找不到題目的紀錄。</div>';
      } else {
        html += '<div class="st-wrap">';
        if (orphanDone.length) html += anomBlock("已檢討，但題庫找不到這題", orphanDone);
        if (orphanRetry.length) html += anomBlock("再考清單，但題庫找不到這題", orphanRetry);
        if (both.length) html += anomBlock("同時已檢討又在再考清單", both);
        html += '</div>';
      }

      if (doneNotSeen.length) {
        html += '<div class="notice"><b>提醒：</b>' + doneNotSeen.length +
          ' 題標記已檢討，但在最近 1000 份考卷裡找不到（可能刪過紀錄）。這不影響出卷。</div>';
      }

      html += '<div class="sec-title">每一題的狀態</div>' +
        '<div class="st-tools">' +
          '<select id="stSubj"><option value="">全部科目</option>' +
            subs.map(function (s) { return '<option value="' + QCORE.esc(s.id) + '">' + QCORE.esc(s.short) + '</option>'; }).join("") +
          '</select>' +
          '<select id="stStat">' +
            '<option value="">全部狀態</option>' +
            '<option value="new">未測驗</option>' +
            '<option value="seen">測驗過</option>' +
            '<option value="done">已檢討</option>' +
            '<option value="retry">再考</option>' +
          '</select>' +
          '<input id="stQ" type="search" placeholder="搜尋題目文字…">' +
        '</div>' +
        '<div class="st-selbar">' +
          '<label class="st-check"><input type="checkbox" id="stAll"> 全選目前篩選 <span id="stAllN">(0)</span></label>' +
          '<button class="btn ghost small" id="stPickSeen" type="button">勾選全部測驗過的</button>' +
          '<span class="st-selcount" id="stSelCount">已選 0 題</span>' +
          '<button class="btn primary small" id="stAddRetry" type="button" disabled>加入再考清單</button>' +
          '<button class="btn ghost small" id="stClearSel" type="button" disabled>取消選取</button>' +
          '<span class="st-note">勾選想要重新測驗的題目（可先把狀態切成「測驗過」），按「加入再考清單」，下次小考就會優先出這些題目。</span>' +
        '</div>' +
        '<div id="stQList"></div>';

      box.innerHTML = html;

      var s1 = document.getElementById("stSubj");
      var s2 = document.getElementById("stStat");
      var s3 = document.getElementById("stQ");
      var s4 = document.getElementById("stRefresh");
      var s5 = document.getElementById("stImport");

      /* 重新檢查或加入再考清單後，保留爸爸原本的篩選條件 */
      var f = A.statFilter || { s: "", t: "", q: "" };
      if (s1) s1.value = f.s || "";
      if (s2) s2.value = f.t || "";
      if (s3) s3.value = f.q || "";

      if (s1) s1.onchange = paintStatQ;
      if (s2) s2.onchange = paintStatQ;
      if (s3) s3.oninput = paintStatQ;
      if (s4) s4.onclick = renderStats;
      if (s5) s5.onclick = importQuestionsToDb;
      paintStatQ();
    }).catch(function (e) {
      var b = document.getElementById("statsBox");
      if (b) b.innerHTML = '<div class="err-box">讀取失敗：' + QCORE.esc(e.message) + '</div>' +
        '<div class="notice">請確認 <code>小考/manifest.json</code> 存在，而且 Supabase 連線正常。</div>';
    });
  }

  /* ---------------- 詳情 ---------------- */
  function renderDetail(id) {
    app.innerHTML =
      '<header class="top"><div class="top-in">' +
        '<div class="logo">考</div>' +
        '<div><h1>檢討</h1><div class="sub">載入中…</div></div>' +
      '</div></header>' +
      '<main><div class="empty">載入中…</div></main>';

    Promise.all([
      QCORE.getSubmission(id),
      QCORE.listDone(),
      QCORE.listRetry().then(function (rows) {
        return { rows: rows || [], err: null };
      }).catch(function (e) {
        return { rows: [], err: e };
      })
    ]).then(function (r) {
      var sub = r[0];
      var doneRows = r[1] || [];
      if (!sub) throw new Error("找不到這份考卷。");

      A.detail = sub;
      A.doneSet = {};
      doneRows.forEach(function (d) { A.doneSet[d.id] = 1; });

      A.retrySet = {};
      A.retryErr = r[2] ? r[2].err : null;
      ((r[2] && r[2].rows) || []).forEach(function (x) { A.retrySet[x.id] = 1; });

      A.showAll = false;
      paintDetail();
    }).catch(function (e) {
      app.innerHTML =
        '<header class="top"><div class="top-in"><div class="logo">考</div><div><h1>檢討</h1></div></div></header>' +
        '<main><div class="err-box">' + QCORE.esc(e.message) + '</div>' +
        '<button class="btn ghost" onclick="location.hash=\'\'">回列表</button></main>';
    });
  }

  function paintDetail() {
    var sub = A.detail;
    var s = subjOf(sub.subject);
    var items = sub.items || [];
    var wrong = items.filter(function (it) { return it.picked !== it.a; });
    var pending = wrong.filter(function (it) { return !A.doneSet[it.id]; });
    var shown = A.showAll ? items : wrong;

    var html =
      '<header class="top"><div class="top-in">' +
        '<div class="logo">考</div>' +
        '<div><h1>' + QCORE.esc(s.short) + ' ・ ' + items.length + ' 題</h1>' +
          '<div class="sub">' + QCORE.esc(QCORE.fmtDateTime(sub.created_at)) + '</div></div>' +
        '<div class="sp"></div>' +
        '<div class="status"><span class="sdot on"></span><span>已連線</span></div>' +
      '</div></header>' +
      '<main>' +
        '<button class="back" id="back" type="button">← 回列表</button>' +
        '<div class="dhead">' +
          '<div class="l1">' +
            '<span class="dot" style="width:11px;height:11px;border-radius:50%;background:' + s.color + '"></span>' +
            '<h2>' + QCORE.esc(s.short) + '</h2>' +
            (sub.reviewed ? '<span class="pill done">已檢討</span>' : '<span class="pill todo">待檢討</span>') +
          '</div>' +
          '<div class="stats">' +
            '<div class="stat"><div class="k">答對</div><div class="v ' + (sub.correct === items.length ? "ok" : "") + '">' + sub.correct + ' / ' + items.length + '</div></div>' +
            '<div class="stat"><div class="k">正確率</div><div class="v">' + (items.length ? Math.round(sub.correct / items.length * 100) : 0) + '%</div></div>' +
            '<div class="stat"><div class="k">用時</div><div class="v">' + QCORE.fmtClock(sub.elapsed_sec) + '</div></div>' +
            '<div class="stat"><div class="k">待標記</div><div class="v ' + (pending.length ? "warn" : "ok") + '">' + pending.length + ' 題</div></div>' +
          '</div>' +
        '</div>' +
        (A.retryErr ? '<div class="notice"><b>「再考清單」資料表還沒建立。</b><br>請到 Supabase → SQL Editor 執行最新版的「小考/supabase.sql」，就可以把討論過的錯題放回下次小考。</div>' : '') +
        '<div class="toolbar">' +
          '<button class="btn ghost" id="toggleAll" type="button">' + (A.showAll ? "只看錯題" : "看全部題目") + '</button>' +
          '<button class="btn green" id="markAll" type="button"' + (pending.length ? "" : " disabled") + '>把這 ' + pending.length + ' 題標記已檢討</button>' +
          '<button class="btn primary" id="finish" type="button">這份檢討完成</button>' +
        '</div>';

    if (!wrong.length) {
      html += '<div class="ok-box">這份全部答對，沒有錯題。可以直接按「這份檢討完成」。</div>';
    }

    shown.forEach(function (it) {
      html += qCard(it, items.indexOf(it));
    });

    html += '</main>';
    app.innerHTML = html;

    document.getElementById("back").onclick = function () { location.hash = ""; };
    document.getElementById("toggleAll").onclick = function () { A.showAll = !A.showAll; paintDetail(); };
    document.getElementById("markAll").onclick = markAllWrong;
    document.getElementById("finish").onclick = finishReview;

    app.querySelectorAll("[data-mark]").forEach(function (b) {
      b.onclick = function () { markOne(b.getAttribute("data-mark")); };
    });
    app.querySelectorAll("[data-unmark2]").forEach(function (b) {
      b.onclick = function () { unmarkOne(b.getAttribute("data-unmark2")); };
    });
    app.querySelectorAll("[data-retry]").forEach(function (b) {
      b.onclick = function () { markRetry(b.getAttribute("data-retry")); };
    });
    app.querySelectorAll("[data-unretry]").forEach(function (b) {
      b.onclick = function () { unmarkRetry(b.getAttribute("data-unretry")); };
    });
    window.scrollTo(0, 0);
  }

  function qCard(it, n) {
    var letters = "ABCDEFG";
    var ok = it.picked === it.a;
    var isDone = !!A.doneSet[it.id];
    var isRetry = !!A.retrySet[it.id];
    var subj = QCORE.getSubject(A.detail.subject);
    var dir = (subj && subj.dir) || "";

    var h = '<section class="q' + (isDone ? " isdone" : "") + '">';

    h += '<div class="qhead">' +
      '<span class="qn ' + (ok ? "ok" : "bad") + '">第 ' + (n + 1) + ' 題・' + (ok ? "答對" : "答錯") + '</span>' +
      (it.u ? '<span class="tag unit">' + QCORE.esc(it.u) + '</span>' : '') +
      (it.d ? '<span class="tag">難度 ' + QCORE.esc(it.d) + '</span>' : '') +
      (it.paper ? '<span class="tag paper">題庫卷 ' + QCORE.esc(it.paper) + '</span>' : '') +
      (isDone ? '<span class="tag done">已標記檢討</span>' : '') +
      (isRetry ? '<span class="tag retry">已排入再考</span>' : '') +
    '</div>';

    if (it.p) h += '<div class="passage">' + QCORE.rich(dir, it.p) + '</div>';
    h += '<div class="stem">' + QCORE.rich(dir, it.q) + '</div>';

    h += '<div class="opts">';
    it.o.forEach(function (t, i) {
      var cls = "";
      var mk = "";
      if (i === it.a) { cls = " correct"; mk = "正確答案"; }
      else if (i === it.picked) { cls = " wrong"; mk = "你選的"; }
      h += '<div class="opt' + cls + '">' +
        '<span class="k">' + letters.charAt(i) + '</span>' +
        '<span>' + QCORE.rich(dir, t) + (mk ? '<span class="mk">' + mk + '</span>' : '') + '</span>' +
      '</div>';
    });
    h += '</div>';

    if (it.picked === -1) {
      h += '<div class="exp bad"><div class="t">這一題沒有作答</div></div>';
    }

    if (!ok && it.w && it.w[it.picked]) {
      h += '<div class="exp bad"><div class="t">你選的 ' + letters.charAt(it.picked) + ' 為什麼不對</div>' +
        QCORE.rich(dir, it.w[it.picked]) + '</div>';
    }

    h += '<div class="exp good"><div class="t">正確答案 ' + letters.charAt(it.a) + ' 為什麼對</div>' +
      QCORE.rich(dir, it.e || "（這題沒有附詳解）") + '</div>';

    h += '<div class="qfoot">';
    if (isRetry) {
      h += '<button class="btn ghost small" type="button" data-unretry="' + QCORE.esc(it.id) + '">取消再考</button>';
    } else if (!ok) {
      h += '<button class="btn primary small" type="button" data-retry="' + QCORE.esc(it.id) + '"' +
        (A.retryErr ? ' disabled title="需要先建立 retry_questions 資料表"' : '') +
        '>討論過了，放回題庫</button>';
    }
    if (isDone) {
      h += '<button class="btn ghost small" type="button" data-unmark2="' + QCORE.esc(it.id) + '">取消標記</button>';
    } else {
      h += '<button class="btn green small" type="button" data-mark="' + QCORE.esc(it.id) + '">標記已檢討</button>';
    }
    h += '</div>';

    h += '</section>';
    return h;
  }

  /* ---------------- 標記動作 ---------------- */
  function markOne(id) {
    var it = (A.detail.items || []).filter(function (x) { return x.id === id; })[0];
    if (!it) return;
    QCORE.addDone([{ id: it.id, label: QCORE.plain(it.q), unit: it.u }], A.detail.subject)
      .then(function () { return QCORE.removeRetry(id).catch(function () { }); })
      .then(function () {
        A.doneSet[id] = 1;
        delete A.retrySet[id];
        toast("已標記，下次不會再抽到這題");
        paintDetail();
        loadRows();
      })
      .catch(function (e) { toast("標記失敗：" + e.message); });
  }

  function unmarkOne(id) {
    QCORE.removeDone(id).then(function () {
      delete A.doneSet[id];
      toast("已取消標記");
      paintDetail();
      loadRows();
    }).catch(function (e) { toast("取消失敗：" + e.message); });
  }

  /* 討論過、學生會了 → 放回下次小考，並優先出題 */
  function markRetry(id) {
    var it = (A.detail.items || []).filter(function (x) { return x.id === id; })[0];
    if (!it) return;
    QCORE.addRetry([{ id: it.id, label: QCORE.plain(it.q), unit: it.u }], A.detail.subject)
      .then(function () {
        /* 如果原本已標記檢討，改放到再考清單；兩張表不要同時有 */
        return QCORE.removeDone(id);
      })
      .then(function () {
        delete A.doneSet[id];
        A.retrySet[id] = 1;
        toast("已放回題庫，下次小考會優先出這題");
        paintDetail();
        loadRows();
      })
      .catch(function (e) { toast("操作失敗：" + e.message); });
  }

  function unmarkRetry(id) {
    QCORE.removeRetry(id).then(function () {
      delete A.retrySet[id];
      toast("已從再考清單移除");
      paintDetail();
    }).catch(function (e) { toast("取消失敗：" + e.message); });
  }

  function markAllWrong() {
    var items = A.detail.items || [];
    var wrong = items.filter(function (it) { return it.picked !== it.a && !A.doneSet[it.id]; });
    if (!wrong.length) { toast("沒有待標記的題目"); return; }

    QCORE.addDone(wrong.map(function (it) {
      return { id: it.id, label: QCORE.plain(it.q), unit: it.u };
    }), A.detail.subject).then(function () {
      wrong.forEach(function (it) { A.doneSet[it.id] = 1; });
      return QCORE.removeRetryMany(wrong.map(function (it) { return it.id; })).catch(function () { });
    }).then(function () {
      wrong.forEach(function (it) { delete A.retrySet[it.id]; });
      return QCORE.markSubmissionReviewed(A.detail.id, true);
    }).then(function () {
      A.detail.reviewed = true;
      toast("已標記 " + wrong.length + " 題，這份完成");
      paintDetail();
      loadRows();
    }).catch(function (e) { toast("標記失敗：" + e.message); });
  }

  function finishReview() {
    QCORE.markSubmissionReviewed(A.detail.id, true).then(function () {
      A.detail.reviewed = true;
      toast("這份已標記為檢討完成");
      paintDetail();
      loadRows();
    }).catch(function (e) { toast("更新失敗：" + e.message); });
  }

  /* ---------------- 資料載入與輪詢 ---------------- */
  function loadRows() {
    return QCORE.listSubmissions({ limit: 60 }).then(function (rows) {
      /* 設定精靈寫入的測試列不要出現在兒子的成績清單裡 */
      rows = (rows || []).filter(function (r) { return r.subject !== "__setup_test__"; });
      var fresh = rows.filter(function (r) { return !A.known[r.id]; });
      A.rows = rows;
      A.rows.forEach(function (r) { A.known[r.id] = 1; });

      if (!A.firstLoad && fresh.length) {
        notifyNew(fresh[0], subjOf(fresh[0].subject));
      }
      A.firstLoad = false;

      /* 只有內容真的變了才重畫，避免每 20 秒把畫面與捲動位置洗掉 */
      var sig = A.rows.map(function (r) { return r.id + (r.reviewed ? "1" : "0"); }).join(",");
      if (sig !== A.sig) {
        A.sig = sig;
        var h = (location.hash || "").replace(/^#/, "");
        if (h.indexOf("s=") !== 0 && (A.tab === "todo" || A.tab === "all" || A.tab === "done")) render();
        if (fresh.length && A.tab === "retry") renderRetry();
        if (fresh.length && A.tab === "stats") renderStats();
      }
      return rows;
    }).catch(function (e) {
      var d = document.getElementById("sdot");
      var t = document.getElementById("stxt");
      if (d) { d.className = "sdot off"; }
      if (t) { t.textContent = "連線失敗"; }
      return [];
    });
  }

  function findRow(id) {
    for (var i = 0; i < A.rows.length; i++) if (A.rows[i].id === id) return A.rows[i];
    return null;
  }

  function notifyNew(row, s) {
    var msg = s.short + " " + row.total + " 題，答對 " + row.correct + " 題";
    toast("📩 新考卷：" + msg, 6000);
    beep();
    try {
      if ("Notification" in window && Notification.permission === "granted") {
        var n = new Notification((QCORE.cfg().STUDENT_NAME || "兒子") + "交卷了", {
          body: msg + "，用時 " + QCORE.fmtClock(row.elapsed_sec),
          tag: row.id
        });
        n.onclick = function () { window.focus(); location.hash = "s=" + row.id; };
      }
    } catch (e) { }
  }

  function startPolling() {
    if (A.poll) clearInterval(A.poll);
    loadRows();
    A.poll = setInterval(function () {
      if (document.hidden) return;
      loadRows();
    }, 20000);
  }

  /* ---------------- 啟動 ---------------- */
  try { A.unlocked = sessionStorage.getItem("qc_admin_ok") === "1"; } catch (e) { }

  window.addEventListener("hashchange", render);
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden && A.unlocked) loadRows();
  });

  if (A.unlocked) startPolling();
  render();
})();
</script>
</body>
</html>
