<text x="200" y="344" class="s" text-anchor="middle">階梯茶園：沿著等高線一階一階種茶</text>
<text x="88" y="196" class="ts" text-anchor="start">丘陵</text>
<text x="88" y="220" class="s" text-anchor="start">坡度較緩</text>
<text x="556" y="132" class="s" text-anchor="start">山頂</text>
<text x="64" y="372" class="s" text-anchor="start">一階一階的茶樹排成階梯，方便耕作也減少土壤流失。</text>
