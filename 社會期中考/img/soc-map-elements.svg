<text x="425" y="178" class="s" text-anchor="middle">聚落</text>
<circle cx="220" cy="250" r="8" class="na" fill="#1f51c9"/>
<text x="240" y="256" class="s" text-anchor="start">學校</text>
<rect x="90" y="372" width="120" height="12" fill="#ffffff" class="n"/>
<rect x="90" y="372" width="60" height="12" class="ns"/>
<text x="90" y="362" class="s" text-anchor="middle">0</text>
<text x="150" y="362" class="s" text-anchor="middle">1</text>
<text x="210" y="362" class="s" text-anchor="middle">2 公里</text>
