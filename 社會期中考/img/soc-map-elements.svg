<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="soc-map-elements-title soc-map-elements-desc" id="soc-map-elements-root">
  <title id="soc-map-elements-title">地圖上的要素</title>
  <desc id="soc-map-elements-desc">示意地圖上有比例尺、指北針、圖例與聚落。</desc>
  <defs>
      <style>#soc-map-elements-root { --paper:#f6f8fc;--paper2:#eef2f8;--ink:#1f2933;--muted:#52606d;--soft:#7b8794;
    --rule:#c3ccd8;--accent:#1f51c9;--accent-tint:rgba(31,81,201,0.08);
    --sans:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
    --serif:'Noto Serif TC','Songti TC',serif; }
      #soc-map-elements-root { font-family: var(--sans); color: var(--ink); }
      #soc-map-elements-root .diagram-container { width:100%;overflow-x:auto }
      #soc-map-elements-root text { font-family:var(--sans) }
      #soc-map-elements-root .h { font:400 22px var(--serif);fill:var(--ink) }
      #soc-map-elements-root .e { font:500 12px var(--sans);fill:var(--muted) }
      #soc-map-elements-root .t { font:600 16px var(--sans);fill:var(--ink) }
      #soc-map-elements-root .ts { font:600 15px var(--sans);fill:var(--ink) }
      #soc-map-elements-root .s { font:500 13px var(--sans);fill:var(--soft) }
      #soc-map-elements-root .sb { font:500 13px var(--sans);fill:var(--ink) }
      #soc-map-elements-root .a { font:600 15px var(--sans);fill:var(--accent) }
      #soc-map-elements-root .big { font:400 44px var(--serif);fill:var(--ink) }
      #soc-map-elements-root .mid { font:400 34px var(--serif);fill:var(--ink) }
      #soc-map-elements-root .n { fill:#ffffff;stroke:var(--ink);stroke-width:1 }
      #soc-map-elements-root .na { fill:var(--accent-tint);stroke:var(--accent);stroke-width:1.2 }
      #soc-map-elements-root .ns { fill:rgba(31,41,51,0.05);stroke:var(--muted);stroke-width:1 }
      #soc-map-elements-root .ln { stroke:var(--ink);stroke-width:1.2;fill:none }
      #soc-map-elements-root .lm { stroke:var(--muted);stroke-width:1;fill:none }
      #soc-map-elements-root .la { stroke:var(--accent);stroke-width:1.4;fill:none }
      #soc-map-elements-root .dash { stroke-dasharray:5 4 }</style><marker id="soc-map-elements-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52606d"/></marker><marker id="soc-map-elements-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1f51c9"/></marker></defs>
  <rect width="100%" height="100%" fill="#f6f8fc"/>
  <text x="32" y="30" class="e">社會・家鄉在哪裡</text>
<text x="32" y="58" class="h">地圖上的要素</text>
  <rect x="60" y="110" width="520" height="240" rx="6" fill="#ffffff" class="n"/>
