<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="soc-festival-title soc-festival-desc" id="soc-festival-root">
  <title id="soc-festival-title">節慶與習俗</title>
  <desc id="soc-festival-desc">過年、端午節、中秋節與清明節各自搭配的習俗。</desc>
  <defs>
      <style>#soc-festival-root { --paper:#f6f8fc;--paper2:#eef2f8;--ink:#1f2933;--muted:#52606d;--soft:#7b8794;
    --rule:#c3ccd8;--accent:#1f51c9;--accent-tint:rgba(31,81,201,0.08);
    --sans:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
    --serif:'Noto Serif TC','Songti TC',serif; }
      #soc-festival-root { font-family: var(--sans); color: var(--ink); }
      #soc-festival-root .diagram-container { width:100%;overflow-x:auto }
      #soc-festival-root text { font-family:var(--sans) }
      #soc-festival-root .h { font:400 22px var(--serif);fill:var(--ink) }
      #soc-festival-root .e { font:500 12px var(--sans);fill:var(--muted) }
      #soc-festival-root .t { font:600 16px var(--sans);fill:var(--ink) }
      #soc-festival-root .ts { font:600 15px var(--sans);fill:var(--ink) }
      #soc-festival-root .s { font:500 13px var(--sans);fill:var(--soft) }
      #soc-festival-root .sb { font:500 13px var(--sans);fill:var(--ink) }
      #soc-festival-root .a { font:600 15px var(--sans);fill:var(--accent) }
      #soc-festival-root .big { font:400 44px var(--serif);fill:var(--ink) }
      #soc-festival-root .mid { font:400 34px var(--serif);fill:var(--ink) }
      #soc-festival-root .n { fill:#ffffff;stroke:var(--ink);stroke-width:1 }
      #soc-festival-root .na { fill:var(--accent-tint);stroke:var(--accent);stroke-width:1.2 }
      #soc-festival-root .ns { fill:rgba(31,41,51,0.05);stroke:var(--muted);stroke-width:1 }
      #soc-festival-root .ln { stroke:var(--ink);stroke-width:1.2;fill:none }
      #soc-festival-root .lm { stroke:var(--muted);stroke-width:1;fill:none }
      #soc-festival-root .la { stroke:var(--accent);stroke-width:1.4;fill:none }
      #soc-festival-root .dash { stroke-dasharray:5 4 }</style><marker id="soc-festival-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52606d"/></marker><marker id="soc-festival-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1f51c9"/></marker></defs>
  <rect width="100%" height="100%" fill="#f6f8fc"/>
  <text x="32" y="30" class="e">社會・傳統的節慶</text>
<text x="32" y="58" class="h">節慶與習俗</text>
  <rect x="40" y="110" width="272" height="116" rx="6" fill="#f6f8fc"/>
<rect x="40" y="110" width="272" height="116" rx="6" class="n"/>
<text x="60" y="146" class="ts" text-anchor="start">過年</text>
<text x="60" y="176" class="s" text-anchor="start">貼春聯・發紅包</text>
<text x="60" y="204" class="a" text-anchor="start">→</text>
<rect x="328" y="110" width="272" height="116" rx="6" fill="#f6f8fc"/>
<rect x="328" y="110" width="272" height="116" rx="6" class="n"/>
<text x="348" y="146" class="ts" text-anchor="start">端午節</text>
<text x="348" y="176" class="s" text-anchor="start">包粽子・划龍舟</text>
<text x="348" y="204" class="a" text-anchor="start">→</text>
<rect x="40" y="242" width="272" height="116" rx="6" fill="#f6f8fc"/>
<rect x="40" y="242" width="272" height="116" rx="6" class="n"/>
<text x="60" y="278" class="ts" text-anchor="start">中秋節</text>
<text x="60" y="308" class="s" text-anchor="start">賞月・吃月餅</text>
<text x="60" y="336" class="a" text-anchor="start">→</text>
<rect x="328" y="242" width="272" height="116" rx="6" fill="#f6f8fc"/>
<rect x="328" y="242" width="272" height="116" rx="6" class="n"/>
<text x="348" y="278" class="ts" text-anchor="start">清明節</text>
<text x="348" y="308" class="s" text-anchor="start">掃墓・祭祖</text>
<text x="348" y="336" class="a" text-anchor="start">→</text>
<text x="40" y="100" class="sb" text-anchor="start">台灣的節慶與大家一起過，習俗也各不相同。</text>
</svg>
