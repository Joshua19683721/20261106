<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="soc-stilt-house-title soc-stilt-house-desc" id="soc-stilt-house-root">
  <title id="soc-stilt-house-title">原住民族的傳統住屋</title>
  <desc id="soc-stilt-house-desc">架高屋的剖面示意：石板地面、竹木柱子與茅草屋頂。</desc>
  <defs>
      <style>#soc-stilt-house-root { --paper:#f6f8fc;--paper2:#eef2f8;--ink:#1f2933;--muted:#52606d;--soft:#7b8794;
    --rule:#c3ccd8;--accent:#1f51c9;--accent-tint:rgba(31,81,201,0.08);
    --sans:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
    --serif:'Noto Serif TC','Songti TC',serif; }
      #soc-stilt-house-root { font-family: var(--sans); color: var(--ink); }
      #soc-stilt-house-root .diagram-container { width:100%;overflow-x:auto }
      #soc-stilt-house-root text { font-family:var(--sans) }
      #soc-stilt-house-root .h { font:400 22px var(--serif);fill:var(--ink) }
      #soc-stilt-house-root .e { font:500 12px var(--sans);fill:var(--muted) }
      #soc-stilt-house-root .t { font:600 16px var(--sans);fill:var(--ink) }
      #soc-stilt-house-root .ts { font:600 15px var(--sans);fill:var(--ink) }
      #soc-stilt-house-root .s { font:500 13px var(--sans);fill:var(--soft) }
      #soc-stilt-house-root .sb { font:500 13px var(--sans);fill:var(--ink) }
      #soc-stilt-house-root .a { font:600 15px var(--sans);fill:var(--accent) }
      #soc-stilt-house-root .big { font:400 44px var(--serif);fill:var(--ink) }
      #soc-stilt-house-root .mid { font:400 34px var(--serif);fill:var(--ink) }
      #soc-stilt-house-root .n { fill:#ffffff;stroke:var(--ink);stroke-width:1 }
      #soc-stilt-house-root .na { fill:var(--accent-tint);stroke:var(--accent);stroke-width:1.2 }
      #soc-stilt-house-root .ns { fill:rgba(31,41,51,0.05);stroke:var(--muted);stroke-width:1 }
      #soc-stilt-house-root .ln { stroke:var(--ink);stroke-width:1.2;fill:none }
      #soc-stilt-house-root .lm { stroke:var(--muted);stroke-width:1;fill:none }
      #soc-stilt-house-root .la { stroke:var(--accent);stroke-width:1.4;fill:none }
      #soc-stilt-house-root .dash { stroke-dasharray:5 4 }</style><marker id="soc-stilt-house-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52606d"/></marker><marker id="soc-stilt-house-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1f51c9"/></marker></defs>
  <rect width="100%" height="100%" fill="#f6f8fc"/>
  <text x="32" y="30" class="e">社會・傳統住屋與生活</text>
<text x="32" y="58" class="h">原住民族的傳統住屋</text>
  <line x1="60" y1="300" x2="580" y2="300" class="ln"/>
<rect x="80" y="300" width="44" height="12" rx="3" class="ns"/>
<rect x="144" y="300" width="44" height="12" rx="3" class="ns"/>
<rect x="208" y="300" width="44" height="12" rx="3" class="ns"/>
<rect x="272" y="300" width="44" height="12" rx="3" class="ns"/>
<rect x="336" y="300" width="44" height="12" rx="3" class="ns"/>
<rect x="400" y="300" width="44" height="12" rx="3" class="ns"/>
<rect x="464" y="300" width="44" height="12" rx="3" class="ns"/>
<text x="120" y="330" class="s" text-anchor="start">石板地面</text>
<line x1="170" y1="300" x2="170" y2="222" class="ln"/>
<line x1="250" y1="300" x2="250" y2="222" class="ln"/>
<line x1="330" y1="300" x2="330" y2="222" class="ln"/>
<line x1="410" y1="300" x2="410" y2="222" class="ln"/>
<rect x="150" y="206" width="280" height="16" rx="3" fill="#ffffff" class="ln"/>
<text x="290" y="194" class="s" text-anchor="middle">架高的地板（防潮、防蟲）</text>
<rect x="182" y="146" width="216" height="60" fill="#ffffff" class="ln"/>
<path d="M 156 146 L 290 96 L 424 146" class="ln"/>
<path d="M 172 146 L 290 104 L 408 146" class="lm"/>
<text x="290" y="132" class="s" text-anchor="middle">茅草屋頂</text>
<text x="290" y="180" class="s" text-anchor="middle">竹木牆面</text>
<text x="470" y="180" class="s" text-anchor="start">就地取材：</text>
<text x="470" y="202" class="s" text-anchor="start">石板・竹・木</text>
<text x="470" y="224" class="s" text-anchor="start">・茅草</text>
<text x="60" y="366" class="sb" text-anchor="start">用當地就有的材料蓋房子，就是傳統住屋最大的特色。</text>
</svg>
