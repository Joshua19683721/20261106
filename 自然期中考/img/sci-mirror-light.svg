<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sci-mirror-light-title sci-mirror-light-desc" id="sci-mirror-light-root">
  <title id="sci-mirror-light-title">光線遇到鏡子會怎樣</title>
  <desc id="sci-mirror-light-desc">陽光射到平面鏡後反射到牆上形成光點，並標出入射角與反射角。</desc>
  <defs>
      <style>#sci-mirror-light-root { --paper:#f6f8fc;--paper2:#eef2f8;--ink:#1f2933;--muted:#52606d;--soft:#7b8794;
    --rule:#c3ccd8;--accent:#1f51c9;--accent-tint:rgba(31,81,201,0.08);
    --sans:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
    --serif:'Noto Serif TC','Songti TC',serif; }
      #sci-mirror-light-root { font-family: var(--sans); color: var(--ink); }
      #sci-mirror-light-root .diagram-container { width:100%;overflow-x:auto }
      #sci-mirror-light-root text { font-family:var(--sans) }
      #sci-mirror-light-root .h { font:400 22px var(--serif);fill:var(--ink) }
      #sci-mirror-light-root .e { font:500 12px var(--sans);fill:var(--muted) }
      #sci-mirror-light-root .t { font:600 16px var(--sans);fill:var(--ink) }
      #sci-mirror-light-root .ts { font:600 15px var(--sans);fill:var(--ink) }
      #sci-mirror-light-root .s { font:500 13px var(--sans);fill:var(--soft) }
      #sci-mirror-light-root .sb { font:500 13px var(--sans);fill:var(--ink) }
      #sci-mirror-light-root .a { font:600 15px var(--sans);fill:var(--accent) }
      #sci-mirror-light-root .big { font:400 44px var(--serif);fill:var(--ink) }
      #sci-mirror-light-root .mid { font:400 34px var(--serif);fill:var(--ink) }
      #sci-mirror-light-root .n { fill:#ffffff;stroke:var(--ink);stroke-width:1 }
      #sci-mirror-light-root .na { fill:var(--accent-tint);stroke:var(--accent);stroke-width:1.2 }
      #sci-mirror-light-root .ns { fill:rgba(31,41,51,0.05);stroke:var(--muted);stroke-width:1 }
      #sci-mirror-light-root .ln { stroke:var(--ink);stroke-width:1.2;fill:none }
      #sci-mirror-light-root .lm { stroke:var(--muted);stroke-width:1;fill:none }
      #sci-mirror-light-root .la { stroke:var(--accent);stroke-width:1.4;fill:none }
      #sci-mirror-light-root .dash { stroke-dasharray:5 4 }</style><marker id="sci-mirror-light-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52606d"/></marker><marker id="sci-mirror-light-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1f51c9"/></marker></defs>
  <rect width="100%" height="100%" fill="#f6f8fc"/>
  <text x="32" y="30" class="e">自然・光的反射</text>
<text x="32" y="58" class="h">光線遇到鏡子會怎樣</text>
  <circle cx="104" cy="128" r="30" class="na"/>
<text x="104" y="134" class="sb" text-anchor="middle">陽光</text>
<line x1="134" y1="128" x2="292" y2="256" class="la" marker-end="url(#sci-mirror-light-arrow-accent)"/>
<line x1="256" y1="292" x2="344" y2="204" class="ln"/>
<line x1="524" y1="80" x2="524" y2="320" class="ln"/>
<line x1="308" y1="248" x2="524" y2="120" class="la" marker-end="url(#sci-mirror-light-arrow-accent)"/>
<circle cx="524" cy="120" r="9" class="na" fill="#1f51c9"/>
<text x="548" y="112" class="ts" text-anchor="start">牆上的光點</text>
<text x="548" y="134" class="s" text-anchor="start">反射後才出現</text>
<path d="M 262 232 A 46 46 0 0 1 286 214" class="lm"/>
<text x="224" y="214" class="s" text-anchor="start">入射角</text>
<path d="M 330 214 A 46 46 0 0 1 350 232" class="lm"/>
<text x="356" y="214" class="s" text-anchor="start">反射角</text>
<text x="256" y="316" class="ts" text-anchor="middle">鏡子</text>
<text x="64" y="372" class="s" text-anchor="start">光線照到鏡子會彈開，方向改變——這就是「反射」。</text>
</svg>
