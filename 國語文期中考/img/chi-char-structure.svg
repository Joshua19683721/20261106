<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="chi-char-structure-title chi-char-structure-desc" id="chi-char-structure-root">
  <title id="chi-char-structure-title">常見的字形結構</title>
  <desc id="chi-char-structure-desc">六種常見字形結構與例字：獨體、左右、上下、上包下、外包內、左下包右上。</desc>
  <defs>
      <style>#chi-char-structure-root { --paper:#f6f8fc;--paper2:#eef2f8;--ink:#1f2933;--muted:#52606d;--soft:#7b8794;
    --rule:#c3ccd8;--accent:#1f51c9;--accent-tint:rgba(31,81,201,0.08);
    --sans:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
    --serif:'Noto Serif TC','Songti TC',serif; }
      #chi-char-structure-root { font-family: var(--sans); color: var(--ink); }
      #chi-char-structure-root .diagram-container { width:100%;overflow-x:auto }
      #chi-char-structure-root text { font-family:var(--sans) }
      #chi-char-structure-root .h { font:400 22px var(--serif);fill:var(--ink) }
      #chi-char-structure-root .e { font:500 12px var(--sans);fill:var(--muted) }
      #chi-char-structure-root .t { font:600 16px var(--sans);fill:var(--ink) }
      #chi-char-structure-root .ts { font:600 15px var(--sans);fill:var(--ink) }
      #chi-char-structure-root .s { font:500 13px var(--sans);fill:var(--soft) }
      #chi-char-structure-root .sb { font:500 13px var(--sans);fill:var(--ink) }
      #chi-char-structure-root .a { font:600 15px var(--sans);fill:var(--accent) }
      #chi-char-structure-root .big { font:400 44px var(--serif);fill:var(--ink) }
      #chi-char-structure-root .mid { font:400 34px var(--serif);fill:var(--ink) }
      #chi-char-structure-root .n { fill:#ffffff;stroke:var(--ink);stroke-width:1 }
      #chi-char-structure-root .na { fill:var(--accent-tint);stroke:var(--accent);stroke-width:1.2 }
      #chi-char-structure-root .ns { fill:rgba(31,41,51,0.05);stroke:var(--muted);stroke-width:1 }
      #chi-char-structure-root .ln { stroke:var(--ink);stroke-width:1.2;fill:none }
      #chi-char-structure-root .lm { stroke:var(--muted);stroke-width:1;fill:none }
      #chi-char-structure-root .la { stroke:var(--accent);stroke-width:1.4;fill:none }
      #chi-char-structure-root .dash { stroke-dasharray:5 4 }</style><marker id="chi-char-structure-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52606d"/></marker><marker id="chi-char-structure-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1f51c9"/></marker></defs>
  <rect width="100%" height="100%" fill="#f6f8fc"/>
  <text x="32" y="30" class="e">國語文・字形結構</text>
<text x="32" y="58" class="h">常見的字形結構</text>
  <rect x="28" y="92" width="184" height="116" rx="6" fill="#f6f8fc"/>
<rect x="28" y="92" width="184" height="116" rx="6" class="n"/>
<text x="120" y="154" class="big" text-anchor="middle">山</text>
<text x="120" y="186" class="s" text-anchor="middle">獨體字</text>
<rect x="228" y="92" width="184" height="116" rx="6" fill="#f6f8fc"/>
<rect x="228" y="92" width="184" height="116" rx="6" class="n"/>
<text x="320" y="154" class="big" text-anchor="middle">好</text>
<text x="320" y="186" class="s" text-anchor="middle">左右結構</text>
<rect x="428" y="92" width="184" height="116" rx="6" fill="#f6f8fc"/>
<rect x="428" y="92" width="184" height="116" rx="6" class="n"/>
<text x="520" y="154" class="big" text-anchor="middle">花</text>
<text x="520" y="186" class="s" text-anchor="middle">上下結構</text>
<rect x="28" y="224" width="184" height="116" rx="6" fill="#f6f8fc"/>
<rect x="28" y="224" width="184" height="116" rx="6" class="n"/>
<text x="120" y="286" class="big" text-anchor="middle">同</text>
<text x="120" y="318" class="s" text-anchor="middle">上包下</text>
<rect x="228" y="224" width="184" height="116" rx="6" fill="#f6f8fc"/>
<rect x="228" y="224" width="184" height="116" rx="6" class="n"/>
<text x="320" y="286" class="big" text-anchor="middle">國</text>
<text x="320" y="318" class="s" text-anchor="middle">外包內</text>
<rect x="428" y="224" width="184" height="116" rx="6" fill="#f6f8fc"/>
<rect x="428" y="224" width="184" height="116" rx="6" class="n"/>
<text x="520" y="286" class="big" text-anchor="middle">巡</text>
<text x="520" y="318" class="s" text-anchor="middle">左下包右上</text>
<text x="28" y="356" class="s" text-anchor="start">看字時先想：它是怎麼組成的？再判斷屬於哪一種結構。</text>
</svg>
