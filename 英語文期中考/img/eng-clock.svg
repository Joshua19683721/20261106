<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="eng-clock-title eng-clock-desc" id="eng-clock-root">
  <title id="eng-clock-title">It's four fifty.</title>
  <desc id="eng-clock-desc">指著 4:50 的圓形時鐘，說明短針與長針各指在哪裡。</desc>
  <defs>
      <style>#eng-clock-root { --paper:#f6f8fc;--paper2:#eef2f8;--ink:#1f2933;--muted:#52606d;--soft:#7b8794;
    --rule:#c3ccd8;--accent:#1f51c9;--accent-tint:rgba(31,81,201,0.08);
    --sans:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
    --serif:'Noto Serif TC','Songti TC',serif; }
      #eng-clock-root { font-family: var(--sans); color: var(--ink); }
      #eng-clock-root .diagram-container { width:100%;overflow-x:auto }
      #eng-clock-root text { font-family:var(--sans) }
      #eng-clock-root .h { font:400 22px var(--serif);fill:var(--ink) }
      #eng-clock-root .e { font:500 12px var(--sans);fill:var(--muted) }
      #eng-clock-root .t { font:600 16px var(--sans);fill:var(--ink) }
      #eng-clock-root .ts { font:600 15px var(--sans);fill:var(--ink) }
      #eng-clock-root .s { font:500 13px var(--sans);fill:var(--soft) }
      #eng-clock-root .sb { font:500 13px var(--sans);fill:var(--ink) }
      #eng-clock-root .a { font:600 15px var(--sans);fill:var(--accent) }
      #eng-clock-root .big { font:400 44px var(--serif);fill:var(--ink) }
      #eng-clock-root .mid { font:400 34px var(--serif);fill:var(--ink) }
      #eng-clock-root .n { fill:#ffffff;stroke:var(--ink);stroke-width:1 }
      #eng-clock-root .na { fill:var(--accent-tint);stroke:var(--accent);stroke-width:1.2 }
      #eng-clock-root .ns { fill:rgba(31,41,51,0.05);stroke:var(--muted);stroke-width:1 }
      #eng-clock-root .ln { stroke:var(--ink);stroke-width:1.2;fill:none }
      #eng-clock-root .lm { stroke:var(--muted);stroke-width:1;fill:none }
      #eng-clock-root .la { stroke:var(--accent);stroke-width:1.4;fill:none }
      #eng-clock-root .dash { stroke-dasharray:5 4 }</style><marker id="eng-clock-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52606d"/></marker><marker id="eng-clock-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1f51c9"/></marker></defs>
  <rect width="100%" height="100%" fill="#f6f8fc"/>
  <text x="32" y="30" class="e">英語文・Unit 2 Time</text>
<text x="32" y="58" class="h">It's four fifty.</text>
  <circle cx="320" cy="218" r="118" fill="#ffffff" class="n"/>
<line x1="320.0" y1="116.0" x2="320.0" y2="104.0" class="ln"/>
<line x1="371.0" y1="129.7" x2="377.0" y2="119.3" class="lm"/>
<line x1="408.3" y1="167.0" x2="418.7" y2="161.0" class="lm"/>
<line x1="422.0" y1="218.0" x2="434.0" y2="218.0" class="ln"/>
<line x1="408.3" y1="269.0" x2="418.7" y2="275.0" class="lm"/>
<line x1="371.0" y1="306.3" x2="377.0" y2="316.7" class="lm"/>
<line x1="320.0" y1="320.0" x2="320.0" y2="332.0" class="ln"/>
<line x1="269.0" y1="306.3" x2="263.0" y2="316.7" class="lm"/>
<line x1="231.7" y1="269.0" x2="221.3" y2="275.0" class="lm"/>
<line x1="218.0" y1="218.0" x2="206.0" y2="218.0" class="ln"/>
<line x1="231.7" y1="167.0" x2="221.3" y2="161.0" class="lm"/>
<line x1="269.0" y1="129.7" x2="263.0" y2="119.3" class="lm"/>
<text x="320" y="139" class="s" text-anchor="middle">12</text>
<text x="404" y="223" class="s" text-anchor="middle">3</text>
<text x="320" y="307" class="s" text-anchor="middle">6</text>
<text x="236" y="223" class="s" text-anchor="middle">9</text>
<line x1="320" y1="218" x2="357.9" y2="272.1" class="ln" stroke-width="3"/>
<line x1="320" y1="218" x2="236.9" y2="170.0" class="la" stroke-width="2.4"/>
<circle cx="320" cy="218" r="5" class="la" fill="#1f51c9"/>
<text x="320" y="372" class="s" text-anchor="middle">短針指向 4 和 5 之間，長針指向 10，就是 4:50。</text>
</svg>
