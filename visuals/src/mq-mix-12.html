<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>統整應用</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --paper:#f6f8fc;--paper2:#eef2f8;--ink:#1f2933;--muted:#52606d;--soft:#7b8794;
    --rule:#c3ccd8;--accent:#1f51c9;--accent-tint:rgba(31,81,201,0.08);
    --sans:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
    --serif:'Noto Serif TC','Songti TC',serif;
  }
  body{font-family:var(--sans);background:var(--paper);color:var(--ink);padding:24px}
  .frame{max-width:720px;margin:0 auto}
  .eyebrow{font:500 12px var(--sans);color:var(--muted);margin-bottom:6px}
  h1{font:400 22px var(--serif);color:var(--ink);margin-bottom:12px}
  .diagram-container{width:100%;overflow-x:auto}
  svg{width:100%;min-width:640px;display:block}
  svg text{font-family:var(--sans)}
  .h{font:400 22px var(--serif);fill:var(--ink)}
  .e{font:500 12px var(--sans);fill:var(--muted)}
  .t{font:600 16px var(--sans);fill:var(--ink)}
  .ts{font:600 15px var(--sans);fill:var(--ink)}
  .s{font:500 13px var(--sans);fill:var(--soft)}
  .sb{font:500 13px var(--sans);fill:var(--ink)}
  .a{font:600 15px var(--sans);fill:var(--accent)}
  .big{font:400 44px var(--serif);fill:var(--ink)}
  .mid{font:400 34px var(--serif);fill:var(--ink)}
  .n{fill:#ffffff;stroke:var(--ink);stroke-width:1}
  .na{fill:var(--accent-tint);stroke:var(--accent);stroke-width:1.2}
  .ns{fill:rgba(31,41,51,0.05);stroke:var(--muted);stroke-width:1}
  .ln{stroke:var(--ink);stroke-width:1.2;fill:none}
  .lm{stroke:var(--muted);stroke-width:1;fill:none}
  .la{stroke:var(--accent);stroke-width:1.4;fill:none}
  .dash{stroke-dasharray:5 4}
</style>
</head>
<body>
<div class="frame">
<p class="eyebrow">統整應用 統整應用</p>
<h1>統整應用</h1>
<div class="diagram-container">
<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mq-mix-12-title mq-mix-12-desc">
  <title id="mq-mix-12-title">統整應用</title>
  <desc id="mq-mix-12-desc">一瓶果汁有 3/8 杯，另一瓶有 5/8 杯，兩瓶合起來是幾杯？</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52606d"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1f51c9"/></marker></defs>
  <rect width="100%" height="100%" fill="#f6f8fc"/>
  <text x="32" y="30" class="e">統整應用 統整應用</text>
<text x="32" y="58" class="h">統整應用</text>
  <text x="60" y="120" class="ts" text-anchor="start">分數相加</text>
<rect x="80" y="150" width="200" height="54" rx="4" class="n"/>
<line x1="105" y1="150" x2="105" y2="204" class="lm"/>
<line x1="130" y1="150" x2="130" y2="204" class="lm"/>
<line x1="155" y1="150" x2="155" y2="204" class="lm"/>
<line x1="180" y1="150" x2="180" y2="204" class="lm"/>
<line x1="205" y1="150" x2="205" y2="204" class="lm"/>
<line x1="230" y1="150" x2="230" y2="204" class="lm"/>
<line x1="255" y1="150" x2="255" y2="204" class="lm"/>
<rect x="81" y="151" width="22" height="51" rx="3" class="na"/>
<rect x="106" y="151" width="22" height="51" rx="3" class="na"/>
<rect x="131" y="151" width="22" height="51" rx="3" class="na"/>
<text x="180" y="234" class="sb" text-anchor="middle">3/8</text>
<rect x="340" y="150" width="200" height="54" rx="4" class="n"/>
<line x1="365" y1="150" x2="365" y2="204" class="lm"/>
<line x1="390" y1="150" x2="390" y2="204" class="lm"/>
<line x1="415" y1="150" x2="415" y2="204" class="lm"/>
<line x1="440" y1="150" x2="440" y2="204" class="lm"/>
<line x1="465" y1="150" x2="465" y2="204" class="lm"/>
<line x1="490" y1="150" x2="490" y2="204" class="lm"/>
<line x1="515" y1="150" x2="515" y2="204" class="lm"/>
<rect x="341" y="151" width="22" height="51" rx="3" class="na"/>
<rect x="366" y="151" width="22" height="51" rx="3" class="na"/>
<rect x="391" y="151" width="22" height="51" rx="3" class="na"/>
<rect x="416" y="151" width="22" height="51" rx="3" class="na"/>
<rect x="441" y="151" width="22" height="51" rx="3" class="na"/>
<text x="440" y="234" class="sb" text-anchor="middle">5/8</text>
<text x="60" y="340" class="sb" text-anchor="start">題目裡的數字，都可以在圖上找到。</text>
</svg>
</div>
</div>
</body>
</html>
