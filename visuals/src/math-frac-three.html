<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>真分數、假分數與帶分數</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --paper:#f6f8fc;--paper2:#eef2f8;--ink:#1f2933;--muted:#52606d;--soft:#7b8794;
    --rule:#c3ccd8;--accent:#1f51c9;--accent-tint:rgba(31,81,201,0.08);
    --sans:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
    --serif:'Noto Serif TC','Songti TC',serif;
  }
  body{font-family:var(--sans);background:var(--paper);color:var(--ink);padding:24px}
  .frame{max-width:720px;margin:0 auto}
  .eyebrow{font:500 12px var(--sans);color:var(--muted);margin-bottom:6px}
  h1{font:400 22px var(--serif);color:var(--ink);margin-bottom:12px}
  .diagram-container{width:100%;overflow-x:auto}
  svg{width:100%;min-width:640px;display:block}
  svg text{font-family:var(--sans)}
  .h{font:400 22px var(--serif);fill:var(--ink)}
  .e{font:500 12px var(--sans);fill:var(--muted)}
  .t{font:600 16px var(--sans);fill:var(--ink)}
  .ts{font:600 15px var(--sans);fill:var(--ink)}
  .s{font:500 13px var(--sans);fill:var(--soft)}
  .sb{font:500 13px var(--sans);fill:var(--ink)}
  .a{font:600 15px var(--sans);fill:var(--accent)}
  .big{font:400 44px var(--serif);fill:var(--ink)}
  .mid{font:400 34px var(--serif);fill:var(--ink)}
  .n{fill:#ffffff;stroke:var(--ink);stroke-width:1}
  .na{fill:var(--accent-tint);stroke:var(--accent);stroke-width:1.2}
  .ns{fill:rgba(31,41,51,0.05);stroke:var(--muted);stroke-width:1}
  .ln{stroke:var(--ink);stroke-width:1.2;fill:none}
  .lm{stroke:var(--muted);stroke-width:1;fill:none}
  .la{stroke:var(--accent);stroke-width:1.4;fill:none}
  .dash{stroke-dasharray:5 4}
</style>
</head>
<body>
<div class="frame">
<p class="eyebrow">數學・9-1 認識真分數、假分數和帶分數</p>
<h1>真分數、假分數與帶分數</h1>
<div class="diagram-container">
<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="math-frac-three-title math-frac-three-desc">
  <title id="math-frac-three-title">真分數、假分數與帶分數</title>
  <desc id="math-frac-three-desc">三種分數的分數條對照。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52606d"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1f51c9"/></marker></defs>
  <rect width="100%" height="100%" fill="#f6f8fc"/>
  <text x="32" y="30" class="e">數學・9-1 認識真分數、假分數和帶分數</text>
<text x="32" y="58" class="h">真分數、假分數與帶分數</text>
  <rect x="70" y="120" width="180" height="54" rx="4" class="n"/>
<line x1="115" y1="120" x2="115" y2="174" class="lm"/>
<line x1="160" y1="120" x2="160" y2="174" class="lm"/>
<line x1="205" y1="120" x2="205" y2="174" class="lm"/>
<rect x="71" y="121" width="42" height="51" rx="3" class="na"/>
<rect x="116" y="121" width="42" height="51" rx="3" class="na"/>
<text x="160" y="204" class="sb" text-anchor="middle">真分數：分子比分母小</text>
<rect x="300" y="120" width="180" height="54" rx="4" class="n"/>
<line x1="345" y1="120" x2="345" y2="174" class="lm"/>
<line x1="390" y1="120" x2="390" y2="174" class="lm"/>
<line x1="435" y1="120" x2="435" y2="174" class="lm"/>
<rect x="301" y="121" width="42" height="51" rx="3" class="na"/>
<rect x="346" y="121" width="42" height="51" rx="3" class="na"/>
<rect x="391" y="121" width="42" height="51" rx="3" class="na"/>
<rect x="436" y="121" width="42" height="51" rx="3" class="na"/>
<rect x="481" y="121" width="42" height="51" rx="3" class="na"/>
<rect x="526" y="121" width="42" height="51" rx="3" class="na"/>
<text x="390" y="204" class="sb" text-anchor="middle">假分數：分子比分母大</text>
<rect x="70" y="230" width="180" height="54" rx="4" class="n"/>
<line x1="115" y1="230" x2="115" y2="284" class="lm"/>
<line x1="160" y1="230" x2="160" y2="284" class="lm"/>
<line x1="205" y1="230" x2="205" y2="284" class="lm"/>
<rect x="71" y="231" width="42" height="51" rx="3" class="na"/>
<rect x="116" y="231" width="42" height="51" rx="3" class="na"/>
<rect x="161" y="231" width="42" height="51" rx="3" class="na"/>
<text x="160" y="314" class="sb" text-anchor="middle">帶分數：整數＋分數</text>
<rect x="300" y="230" width="180" height="54" rx="4" class="n"/>
<line x1="345" y1="230" x2="345" y2="284" class="lm"/>
<line x1="390" y1="230" x2="390" y2="284" class="lm"/>
<line x1="435" y1="230" x2="435" y2="284" class="lm"/>
<rect x="301" y="231" width="42" height="51" rx="3" class="na"/>
<rect x="346" y="231" width="42" height="51" rx="3" class="na"/>
<text x="390" y="250" class="a" text-anchor="start">＝ 1 又 1/4</text>
<text x="60" y="330" class="sb" text-anchor="start">看分母和分子的大小關係，就能分出三種分數。</text>
</svg>
</div>
</div>
</body>
</html>
