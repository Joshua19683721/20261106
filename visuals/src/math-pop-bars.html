<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>縣市人口比較</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --paper:#f6f8fc;--paper2:#eef2f8;--ink:#1f2933;--muted:#52606d;--soft:#7b8794;
    --rule:#c3ccd8;--accent:#1f51c9;--accent-tint:rgba(31,81,201,0.08);
    --sans:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
    --serif:'Noto Serif TC','Songti TC',serif;
  }
  body{font-family:var(--sans);background:var(--paper);color:var(--ink);padding:24px}
  .frame{max-width:720px;margin:0 auto}
  .eyebrow{font:500 12px var(--sans);color:var(--muted);margin-bottom:6px}
  h1{font:400 22px var(--serif);color:var(--ink);margin-bottom:12px}
  .diagram-container{width:100%;overflow-x:auto}
  svg{width:100%;min-width:640px;display:block}
  svg text{font-family:var(--sans)}
  .h{font:400 22px var(--serif);fill:var(--ink)}
  .e{font:500 12px var(--sans);fill:var(--muted)}
  .t{font:600 16px var(--sans);fill:var(--ink)}
  .ts{font:600 15px var(--sans);fill:var(--ink)}
  .s{font:500 13px var(--sans);fill:var(--soft)}
  .sb{font:500 13px var(--sans);fill:var(--ink)}
  .a{font:600 15px var(--sans);fill:var(--accent)}
  .big{font:400 44px var(--serif);fill:var(--ink)}
  .mid{font:400 34px var(--serif);fill:var(--ink)}
  .n{fill:#ffffff;stroke:var(--ink);stroke-width:1}
  .na{fill:var(--accent-tint);stroke:var(--accent);stroke-width:1.2}
  .ns{fill:rgba(31,41,51,0.05);stroke:var(--muted);stroke-width:1}
  .ln{stroke:var(--ink);stroke-width:1.2;fill:none}
  .lm{stroke:var(--muted);stroke-width:1;fill:none}
  .la{stroke:var(--accent);stroke-width:1.4;fill:none}
  .dash{stroke-dasharray:5 4}
</style>
</head>
<body>
<div class="frame">
<p class="eyebrow">數學・素養題組・一億以內的數</p>
<h1>縣市人口比較</h1>
<div class="diagram-container">
<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="math-pop-bars-title math-pop-bars-desc">
  <title id="math-pop-bars-title">縣市人口比較</title>
  <desc id="math-pop-bars-desc">四個縣市人口（萬人）的長條圖。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52606d"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1f51c9"/></marker></defs>
  <rect width="100%" height="100%" fill="#f6f8fc"/>
  <text x="32" y="30" class="e">數學・素養題組・一億以內的數</text>
<text x="32" y="58" class="h">縣市人口比較</text>
  <line x1="130" y1="300" x2="130" y2="50" class="ln"/>
<line x1="130" y1="300" x2="560" y2="300" class="ln"/>
<line x1="130" y1="300" x2="560" y2="300" class="lm dash"/>
<text x="118" y="305" class="s" text-anchor="end">0</text>
<line x1="130" y1="247" x2="560" y2="247" class="lm dash"/>
<text x="118" y="252" class="s" text-anchor="end">100</text>
<line x1="130" y1="195" x2="560" y2="195" class="lm dash"/>
<text x="118" y="200" class="s" text-anchor="end">200</text>
<line x1="130" y1="143" x2="560" y2="143" class="lm dash"/>
<text x="118" y="148" class="s" text-anchor="end">300</text>
<line x1="130" y1="91" x2="560" y2="91" class="lm dash"/>
<text x="118" y="96" class="s" text-anchor="end">400</text>
<rect x="170" y="91" width="22" height="208" rx="6" class="n"/>
<rect x="170" y="91" width="22" height="208" rx="6" class="na"/>
<text x="181" y="326" class="ts" text-anchor="middle">新北</text>
<rect x="270" y="154" width="22" height="145" rx="6" class="n"/>
<rect x="270" y="154" width="22" height="145" rx="6" class="na"/>
<text x="281" y="326" class="ts" text-anchor="middle">臺中</text>
<rect x="370" y="159" width="22" height="140" rx="6" class="n"/>
<rect x="370" y="159" width="22" height="140" rx="6" class="na"/>
<text x="381" y="326" class="ts" text-anchor="middle">高雄</text>
<rect x="470" y="233" width="22" height="66" rx="6" class="n"/>
<rect x="470" y="233" width="22" height="66" rx="6" class="na"/>
<text x="481" y="326" class="ts" text-anchor="middle">彰化</text>
<text x="90" y="42" class="s" text-anchor="end">萬人</text>
<text x="60" y="350" class="sb" text-anchor="start">用「萬」當單位，人口數一下就看得清楚。</text>
</svg>
</div>
</div>
</body>
</html>
