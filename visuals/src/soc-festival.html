<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>節慶與習俗</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --paper:#f6f8fc;--paper2:#eef2f8;--ink:#1f2933;--muted:#52606d;--soft:#7b8794;
    --rule:#c3ccd8;--accent:#1f51c9;--accent-tint:rgba(31,81,201,0.08);
    --sans:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
    --serif:'Noto Serif TC','Songti TC',serif;
  }
  body{font-family:var(--sans);background:var(--paper);color:var(--ink);padding:24px}
  .frame{max-width:720px;margin:0 auto}
  .eyebrow{font:500 12px var(--sans);color:var(--muted);margin-bottom:6px}
  h1{font:400 22px var(--serif);color:var(--ink);margin-bottom:12px}
  .diagram-container{width:100%;overflow-x:auto}
  svg{width:100%;min-width:640px;display:block}
  svg text{font-family:var(--sans)}
  .h{font:400 22px var(--serif);fill:var(--ink)}
  .e{font:500 12px var(--sans);fill:var(--muted)}
  .t{font:600 16px var(--sans);fill:var(--ink)}
  .ts{font:600 15px var(--sans);fill:var(--ink)}
  .s{font:500 13px var(--sans);fill:var(--soft)}
  .sb{font:500 13px var(--sans);fill:var(--ink)}
  .a{font:600 15px var(--sans);fill:var(--accent)}
  .big{font:400 44px var(--serif);fill:var(--ink)}
  .mid{font:400 34px var(--serif);fill:var(--ink)}
  .n{fill:#ffffff;stroke:var(--ink);stroke-width:1}
  .na{fill:var(--accent-tint);stroke:var(--accent);stroke-width:1.2}
  .ns{fill:rgba(31,41,51,0.05);stroke:var(--muted);stroke-width:1}
  .ln{stroke:var(--ink);stroke-width:1.2;fill:none}
  .lm{stroke:var(--muted);stroke-width:1;fill:none}
  .la{stroke:var(--accent);stroke-width:1.4;fill:none}
  .dash{stroke-dasharray:5 4}
</style>
</head>
<body>
<div class="frame">
<p class="eyebrow">社會・傳統的節慶</p>
<h1>節慶與習俗</h1>
<div class="diagram-container">
<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="soc-festival-title soc-festival-desc">
  <title id="soc-festival-title">節慶與習俗</title>
  <desc id="soc-festival-desc">過年、端午節、中秋節與清明節各自搭配的習俗。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52606d"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1f51c9"/></marker></defs>
  <rect width="100%" height="100%" fill="#f6f8fc"/>
  <text x="32" y="30" class="e">社會・傳統的節慶</text>
<text x="32" y="58" class="h">節慶與習俗</text>
  <rect x="40" y="110" width="272" height="116" rx="6" fill="#f6f8fc"/>
<rect x="40" y="110" width="272" height="116" rx="6" class="n"/>
<text x="60" y="146" class="ts" text-anchor="start">過年</text>
<text x="60" y="176" class="s" text-anchor="start">貼春聯・發紅包</text>
<text x="60" y="204" class="a" text-anchor="start">→</text>
<rect x="328" y="110" width="272" height="116" rx="6" fill="#f6f8fc"/>
<rect x="328" y="110" width="272" height="116" rx="6" class="n"/>
<text x="348" y="146" class="ts" text-anchor="start">端午節</text>
<text x="348" y="176" class="s" text-anchor="start">包粽子・划龍舟</text>
<text x="348" y="204" class="a" text-anchor="start">→</text>
<rect x="40" y="242" width="272" height="116" rx="6" fill="#f6f8fc"/>
<rect x="40" y="242" width="272" height="116" rx="6" class="n"/>
<text x="60" y="278" class="ts" text-anchor="start">中秋節</text>
<text x="60" y="308" class="s" text-anchor="start">賞月・吃月餅</text>
<text x="60" y="336" class="a" text-anchor="start">→</text>
<rect x="328" y="242" width="272" height="116" rx="6" fill="#f6f8fc"/>
<rect x="328" y="242" width="272" height="116" rx="6" class="n"/>
<text x="348" y="278" class="ts" text-anchor="start">清明節</text>
<text x="348" y="308" class="s" text-anchor="start">掃墓・祭祖</text>
<text x="348" y="336" class="a" text-anchor="start">→</text>
<text x="40" y="100" class="sb" text-anchor="start">台灣的節慶與大家一起過，習俗也各不相同。</text>
</svg>
</div>
</div>
</body>
</html>
