<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>位值表：數字放在哪一位</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --paper:#f6f8fc;--paper2:#eef2f8;--ink:#1f2933;--muted:#52606d;--soft:#7b8794;
    --rule:#c3ccd8;--accent:#1f51c9;--accent-tint:rgba(31,81,201,0.08);
    --sans:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
    --serif:'Noto Serif TC','Songti TC',serif;
  }
  body{font-family:var(--sans);background:var(--paper);color:var(--ink);padding:24px}
  .frame{max-width:720px;margin:0 auto}
  .eyebrow{font:500 12px var(--sans);color:var(--muted);margin-bottom:6px}
  h1{font:400 22px var(--serif);color:var(--ink);margin-bottom:12px}
  .diagram-container{width:100%;overflow-x:auto}
  svg{width:100%;min-width:640px;display:block}
  svg text{font-family:var(--sans)}
  .h{font:400 22px var(--serif);fill:var(--ink)}
  .e{font:500 12px var(--sans);fill:var(--muted)}
  .t{font:600 16px var(--sans);fill:var(--ink)}
  .ts{font:600 15px var(--sans);fill:var(--ink)}
  .s{font:500 13px var(--sans);fill:var(--soft)}
  .sb{font:500 13px var(--sans);fill:var(--ink)}
  .a{font:600 15px var(--sans);fill:var(--accent)}
  .big{font:400 44px var(--serif);fill:var(--ink)}
  .mid{font:400 34px var(--serif);fill:var(--ink)}
  .n{fill:#ffffff;stroke:var(--ink);stroke-width:1}
  .na{fill:var(--accent-tint);stroke:var(--accent);stroke-width:1.2}
  .ns{fill:rgba(31,41,51,0.05);stroke:var(--muted);stroke-width:1}
  .ln{stroke:var(--ink);stroke-width:1.2;fill:none}
  .lm{stroke:var(--muted);stroke-width:1;fill:none}
  .la{stroke:var(--accent);stroke-width:1.4;fill:none}
  .dash{stroke-dasharray:5 4}
</style>
</head>
<body>
<div class="frame">
<p class="eyebrow">數學・1-1 十萬以內的數</p>
<h1>位值表：數字放在哪一位</h1>
<div class="diagram-container">
<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="math-kv-place-title math-kv-place-desc">
  <title id="math-kv-place-title">位值表：數字放在哪一位</title>
  <desc id="math-kv-place-desc">位值表由左至右為萬、千、百、十、一，7 9 2 1 5 填入對應的位。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52606d"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1f51c9"/></marker></defs>
  <rect width="100%" height="100%" fill="#f6f8fc"/>
  <text x="32" y="30" class="e">數學・1-1 十萬以內的數</text>
<text x="32" y="58" class="h">位值表：數字放在哪一位</text>
  <rect x="70" y="140" width="320" height="52" rx="0" class="n"/>
<rect x="70" y="192" width="320" height="52" rx="0" class="n"/>
<line x1="70" y1="140" x2="70" y2="244" class="lm"/>
<text x="102" y="172" class="s" text-anchor="middle">萬</text>
<text x="102" y="228" class="sb" text-anchor="middle">7</text>
<line x1="134" y1="140" x2="134" y2="244" class="lm"/>
<text x="166" y="172" class="s" text-anchor="middle">千</text>
<text x="166" y="228" class="a" text-anchor="middle">9</text>
<line x1="198" y1="140" x2="198" y2="244" class="lm"/>
<text x="230" y="172" class="s" text-anchor="middle">百</text>
<text x="230" y="228" class="sb" text-anchor="middle">2</text>
<line x1="262" y1="140" x2="262" y2="244" class="lm"/>
<text x="294" y="172" class="s" text-anchor="middle">十</text>
<text x="294" y="228" class="sb" text-anchor="middle">1</text>
<line x1="326" y1="140" x2="326" y2="244" class="lm"/>
<text x="358" y="172" class="s" text-anchor="middle">一</text>
<text x="358" y="228" class="sb" text-anchor="middle">5</text>
<line x1="70" y1="192" x2="390" y2="192" class="lm"/>
<rect x="134" y="192" width="64" height="52" rx="0" class="na"/>
<text x="60" y="320" class="sb" text-anchor="start">同樣的數字，放的位置不同，位值就不同。</text>
</svg>
</div>
</div>
</body>
</html>
