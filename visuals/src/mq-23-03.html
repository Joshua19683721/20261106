<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>三、四位數×二位數</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --paper:#f6f8fc;--paper2:#eef2f8;--ink:#1f2933;--muted:#52606d;--soft:#7b8794;
    --rule:#c3ccd8;--accent:#1f51c9;--accent-tint:rgba(31,81,201,0.08);
    --sans:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
    --serif:'Noto Serif TC','Songti TC',serif;
  }
  body{font-family:var(--sans);background:var(--paper);color:var(--ink);padding:24px}
  .frame{max-width:720px;margin:0 auto}
  .eyebrow{font:500 12px var(--sans);color:var(--muted);margin-bottom:6px}
  h1{font:400 22px var(--serif);color:var(--ink);margin-bottom:12px}
  .diagram-container{width:100%;overflow-x:auto}
  svg{width:100%;min-width:640px;display:block}
  svg text{font-family:var(--sans)}
  .h{font:400 22px var(--serif);fill:var(--ink)}
  .e{font:500 12px var(--sans);fill:var(--muted)}
  .t{font:600 16px var(--sans);fill:var(--ink)}
  .ts{font:600 15px var(--sans);fill:var(--ink)}
  .s{font:500 13px var(--sans);fill:var(--soft)}
  .sb{font:500 13px var(--sans);fill:var(--ink)}
  .a{font:600 15px var(--sans);fill:var(--accent)}
  .big{font:400 44px var(--serif);fill:var(--ink)}
  .mid{font:400 34px var(--serif);fill:var(--ink)}
  .n{fill:#ffffff;stroke:var(--ink);stroke-width:1}
  .na{fill:var(--accent-tint);stroke:var(--accent);stroke-width:1.2}
  .ns{fill:rgba(31,41,51,0.05);stroke:var(--muted);stroke-width:1}
  .ln{stroke:var(--ink);stroke-width:1.2;fill:none}
  .lm{stroke:var(--muted);stroke-width:1;fill:none}
  .la{stroke:var(--accent);stroke-width:1.4;fill:none}
  .dash{stroke-dasharray:5 4}
</style>
</head>
<body>
<div class="frame">
<p class="eyebrow">2-3 三、四位數×二位數</p>
<h1>三、四位數×二位數</h1>
<div class="diagram-container">
<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mq-23-03-title mq-23-03-desc">
  <title id="mq-23-03-title">三、四位數×二位數</title>
  <desc id="mq-23-03-desc">305 × 68 ＝？</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52606d"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1f51c9"/></marker></defs>
  <rect width="100%" height="100%" fill="#f6f8fc"/>
  <text x="32" y="30" class="e">2-3 三、四位數×二位數</text>
<text x="32" y="58" class="h">三、四位數×二位數</text>
  <text x="70" y="120" class="sb" text-anchor="start">把 305 拆成 3、0、5，和 68 組配對</text>
<rect x="170" y="160" width="27" height="27" rx="2" class="ns"/>
<rect x="200" y="160" width="27" height="27" rx="2" class="ns"/>
<rect x="230" y="160" width="27" height="27" rx="2" class="ns"/>
<rect x="170" y="190" width="27" height="27" rx="2" class="ns"/>
<rect x="200" y="190" width="27" height="27" rx="2" class="ns"/>
<rect x="230" y="190" width="27" height="27" rx="2" class="ns"/>
<rect x="170" y="220" width="27" height="27" rx="2" class="ns"/>
<rect x="200" y="220" width="27" height="27" rx="2" class="ns"/>
<rect x="230" y="220" width="27" height="27" rx="2" class="ns"/>
<rect x="170" y="250" width="27" height="27" rx="2" class="ns"/>
<rect x="200" y="250" width="27" height="27" rx="2" class="ns"/>
<rect x="230" y="250" width="27" height="27" rx="2" class="ns"/>
<rect x="164" y="154" width="90" height="120" rx="4" class="n" fill="none" opacity="0"/>
<text x="215" y="308" class="s" text-anchor="middle">每一位</text>
<text x="156" y="220" class="s" text-anchor="end">68</text>
<text x="80" y="300" class="s" text-anchor="start">每一格代表一個 10，</text>
<text x="80" y="324" class="s" text-anchor="start">再乘上組數。</text>
</svg>
</div>
</div>
</body>
</html>
