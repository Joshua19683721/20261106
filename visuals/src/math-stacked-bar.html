<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>堆疊長條圖怎麼看</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --paper:#f6f8fc;--paper2:#eef2f8;--ink:#1f2933;--muted:#52606d;--soft:#7b8794;
    --rule:#c3ccd8;--accent:#1f51c9;--accent-tint:rgba(31,81,201,0.08);
    --sans:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
    --serif:'Noto Serif TC','Songti TC',serif;
  }
  body{font-family:var(--sans);background:var(--paper);color:var(--ink);padding:24px}
  .frame{max-width:720px;margin:0 auto}
  .eyebrow{font:500 12px var(--sans);color:var(--muted);margin-bottom:6px}
  h1{font:400 22px var(--serif);color:var(--ink);margin-bottom:12px}
  .diagram-container{width:100%;overflow-x:auto}
  svg{width:100%;min-width:640px;display:block}
  svg text{font-family:var(--sans)}
  .h{font:400 22px var(--serif);fill:var(--ink)}
  .e{font:500 12px var(--sans);fill:var(--muted)}
  .t{font:600 16px var(--sans);fill:var(--ink)}
  .ts{font:600 15px var(--sans);fill:var(--ink)}
  .s{font:500 13px var(--sans);fill:var(--soft)}
  .sb{font:500 13px var(--sans);fill:var(--ink)}
  .a{font:600 15px var(--sans);fill:var(--accent)}
  .big{font:400 44px var(--serif);fill:var(--ink)}
  .mid{font:400 34px var(--serif);fill:var(--ink)}
  .n{fill:#ffffff;stroke:var(--ink);stroke-width:1}
  .na{fill:var(--accent-tint);stroke:var(--accent);stroke-width:1.2}
  .ns{fill:rgba(31,41,51,0.05);stroke:var(--muted);stroke-width:1}
  .ln{stroke:var(--ink);stroke-width:1.2;fill:none}
  .lm{stroke:var(--muted);stroke-width:1;fill:none}
  .la{stroke:var(--accent);stroke-width:1.4;fill:none}
  .dash{stroke-dasharray:5 4}
</style>
</head>
<body>
<div class="frame">
<p class="eyebrow">數學・10-4 報讀複雜的統計圖</p>
<h1>堆疊長條圖怎麼看</h1>
<div class="diagram-container">
<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="math-stacked-bar-title math-stacked-bar-desc">
  <title id="math-stacked-bar-title">堆疊長條圖怎麼看</title>
  <desc id="math-stacked-bar-desc">堆疊長條圖的一根長條：下層男生 6 人、上層女生 4 人。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52606d"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1f51c9"/></marker></defs>
  <rect width="100%" height="100%" fill="#f6f8fc"/>
  <text x="32" y="30" class="e">數學・10-4 報讀複雜的統計圖</text>
<text x="32" y="58" class="h">堆疊長條圖怎麼看</text>
  <line x1="150" y1="300" x2="150" y2="108" class="ln"/>
<line x1="150" y1="300" x2="500" y2="300" class="ln"/>
<line x1="150" y1="276" x2="500" y2="276" class="lm dash"/>
<text x="138" y="281" class="s" text-anchor="end">2</text>
<line x1="150" y1="252" x2="500" y2="252" class="lm dash"/>
<text x="138" y="257" class="s" text-anchor="end">4</text>
<line x1="150" y1="228" x2="500" y2="228" class="lm dash"/>
<text x="138" y="233" class="s" text-anchor="end">6</text>
<line x1="150" y1="204" x2="500" y2="204" class="lm dash"/>
<text x="138" y="209" class="s" text-anchor="end">8</text>
<line x1="150" y1="180" x2="500" y2="180" class="lm dash"/>
<text x="138" y="185" class="s" text-anchor="end">10</text>
<line x1="150" y1="156" x2="500" y2="156" class="lm dash"/>
<text x="138" y="161" class="s" text-anchor="end">12</text>
<line x1="150" y1="132" x2="500" y2="132" class="lm dash"/>
<text x="138" y="137" class="s" text-anchor="end">14</text>
<line x1="150" y1="108" x2="500" y2="108" class="lm dash"/>
<text x="138" y="113" class="s" text-anchor="end">16</text>
<rect x="220" y="156" width="70" height="144" fill="#ffffff" class="n"/>
<rect x="220" y="156" width="70" height="144" class="ns"/>
<rect x="220" y="60" width="70" height="96" fill="#ffffff" class="n"/>
<rect x="220" y="60" width="70" height="96" class="na"/>
<text x="255" y="190" class="sb" text-anchor="middle">男生 6 人</text>
<text x="255" y="90" class="sb" text-anchor="middle">女生 4 人</text>
<text x="255" y="328" class="ts" text-anchor="middle">某一項</text>
<text x="60" y="360" class="sb" text-anchor="start">堆疊長條圖：下層與上層的長條要一起算。</text>
</svg>
</div>
</div>
</body>
</html>
