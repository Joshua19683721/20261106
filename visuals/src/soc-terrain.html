<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>臺灣常見的五種地形</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --paper:#f6f8fc;--paper2:#eef2f8;--ink:#1f2933;--muted:#52606d;--soft:#7b8794;
    --rule:#c3ccd8;--accent:#1f51c9;--accent-tint:rgba(31,81,201,0.08);
    --sans:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
    --serif:'Noto Serif TC','Songti TC',serif;
  }
  body{font-family:var(--sans);background:var(--paper);color:var(--ink);padding:24px}
  .frame{max-width:720px;margin:0 auto}
  .eyebrow{font:500 12px var(--sans);color:var(--muted);margin-bottom:6px}
  h1{font:400 22px var(--serif);color:var(--ink);margin-bottom:12px}
  .diagram-container{width:100%;overflow-x:auto}
  svg{width:100%;min-width:640px;display:block}
  svg text{font-family:var(--sans)}
  .h{font:400 22px var(--serif);fill:var(--ink)}
  .e{font:500 12px var(--sans);fill:var(--muted)}
  .t{font:600 16px var(--sans);fill:var(--ink)}
  .ts{font:600 15px var(--sans);fill:var(--ink)}
  .s{font:500 13px var(--sans);fill:var(--soft)}
  .sb{font:500 13px var(--sans);fill:var(--ink)}
  .a{font:600 15px var(--sans);fill:var(--accent)}
  .big{font:400 44px var(--serif);fill:var(--ink)}
  .mid{font:400 34px var(--serif);fill:var(--ink)}
  .n{fill:#ffffff;stroke:var(--ink);stroke-width:1}
  .na{fill:var(--accent-tint);stroke:var(--accent);stroke-width:1.2}
  .ns{fill:rgba(31,41,51,0.05);stroke:var(--muted);stroke-width:1}
  .ln{stroke:var(--ink);stroke-width:1.2;fill:none}
  .lm{stroke:var(--muted);stroke-width:1;fill:none}
  .la{stroke:var(--accent);stroke-width:1.4;fill:none}
  .dash{stroke-dasharray:5 4}
</style>
</head>
<body>
<div class="frame">
<p class="eyebrow">社會・家鄉的地形</p>
<h1>臺灣常見的五種地形</h1>
<div class="diagram-container">
<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="soc-terrain-title soc-terrain-desc">
  <title id="soc-terrain-title">臺灣常見的五種地形</title>
  <desc id="soc-terrain-desc">山地、丘陵、台地、平原、盆地五種地形的剖面小圖。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52606d"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1f51c9"/></marker></defs>
  <rect width="100%" height="100%" fill="#f6f8fc"/>
  <text x="32" y="30" class="e">社會・家鄉的地形</text>
<text x="32" y="58" class="h">臺灣常見的五種地形</text>
  <rect x="28" y="92" width="104" height="176" rx="6" fill="#f6f8fc"/>
<rect x="28" y="92" width="104" height="176" rx="6" class="n"/>
<g transform="translate(34 224)"><path d="M 12 132 L 34 52 L 52 92 L 70 34 L 92 132" class="ln"/></g>
<text x="80" y="252" class="ts" text-anchor="middle">山地</text>
<rect x="148" y="92" width="104" height="176" rx="6" fill="#f6f8fc"/>
<rect x="148" y="92" width="104" height="176" rx="6" class="n"/>
<g transform="translate(154 224)"><path d="M 12 132 C 28 86, 44 86, 52 112 C 62 84, 78 86, 92 132" class="ln"/></g>
<text x="200" y="252" class="ts" text-anchor="middle">丘陵</text>
<rect x="268" y="92" width="104" height="176" rx="6" fill="#f6f8fc"/>
<rect x="268" y="92" width="104" height="176" rx="6" class="n"/>
<g transform="translate(274 224)"><path d="M 12 132 L 26 132 L 34 60 L 74 60 L 84 132 L 92 132" class="ln"/></g>
<text x="320" y="252" class="ts" text-anchor="middle">台地</text>
<rect x="388" y="92" width="104" height="176" rx="6" fill="#f6f8fc"/>
<rect x="388" y="92" width="104" height="176" rx="6" class="n"/>
<g transform="translate(394 224)"><path d="M 12 132 L 92 132" class="ln"/></g>
<text x="440" y="252" class="ts" text-anchor="middle">平原</text>
<rect x="508" y="92" width="104" height="176" rx="6" fill="#f6f8fc"/>
<rect x="508" y="92" width="104" height="176" rx="6" class="n"/>
<g transform="translate(514 224)"><path d="M 12 132 L 26 48 L 40 104 L 64 104 L 78 48 L 92 132" class="ln"/></g>
<text x="560" y="252" class="ts" text-anchor="middle">盆地</text>
<text x="28" y="304" class="s" text-anchor="start">由左而右：山勢高低與起伏不同，就分成不同的地形。</text>
<text x="28" y="336" class="s" text-anchor="start">台地＝頂部平坦、邊緣較陡；盆地＝四周較高、中間低平。</text>
</svg>
</div>
</div>
</body>
</html>
