<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>地圖上的要素</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --paper:#f6f8fc;--paper2:#eef2f8;--ink:#1f2933;--muted:#52606d;--soft:#7b8794;
    --rule:#c3ccd8;--accent:#1f51c9;--accent-tint:rgba(31,81,201,0.08);
    --sans:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
    --serif:'Noto Serif TC','Songti TC',serif;
  }
  body{font-family:var(--sans);background:var(--paper);color:var(--ink);padding:24px}
  .frame{max-width:720px;margin:0 auto}
  .eyebrow{font:500 12px var(--sans);color:var(--muted);margin-bottom:6px}
  h1{font:400 22px var(--serif);color:var(--ink);margin-bottom:12px}
  .diagram-container{width:100%;overflow-x:auto}
  svg{width:100%;min-width:640px;display:block}
  svg text{font-family:var(--sans)}
  .h{font:400 22px var(--serif);fill:var(--ink)}
  .e{font:500 12px var(--sans);fill:var(--muted)}
  .t{font:600 16px var(--sans);fill:var(--ink)}
  .ts{font:600 15px var(--sans);fill:var(--ink)}
  .s{font:500 13px var(--sans);fill:var(--soft)}
  .sb{font:500 13px var(--sans);fill:var(--ink)}
  .a{font:600 15px var(--sans);fill:var(--accent)}
  .big{font:400 44px var(--serif);fill:var(--ink)}
  .mid{font:400 34px var(--serif);fill:var(--ink)}
  .n{fill:#ffffff;stroke:var(--ink);stroke-width:1}
  .na{fill:var(--accent-tint);stroke:var(--accent);stroke-width:1.2}
  .ns{fill:rgba(31,41,51,0.05);stroke:var(--muted);stroke-width:1}
  .ln{stroke:var(--ink);stroke-width:1.2;fill:none}
  .lm{stroke:var(--muted);stroke-width:1;fill:none}
  .la{stroke:var(--accent);stroke-width:1.4;fill:none}
  .dash{stroke-dasharray:5 4}
</style>
</head>
<body>
<div class="frame">
<p class="eyebrow">社會・家鄉在哪裡</p>
<h1>地圖上的要素</h1>
<div class="diagram-container">
<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="soc-map-elements-title soc-map-elements-desc">
  <title id="soc-map-elements-title">地圖上的要素</title>
  <desc id="soc-map-elements-desc">示意地圖上有比例尺、指北針、圖例與聚落。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52606d"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1f51c9"/></marker></defs>
  <rect width="100%" height="100%" fill="#f6f8fc"/>
  <text x="32" y="30" class="e">社會・家鄉在哪裡</text>
<text x="32" y="58" class="h">地圖上的要素</text>
  <rect x="60" y="110" width="520" height="240" rx="6" fill="#ffffff" class="n"/>
<path d="M 100 190 C 180 150, 250 230, 330 190" class="la" fill="none"/>
<path d="M 100 300 C 190 260, 240 320, 330 290" class="la" fill="none"/>
<rect x="380" y="140" width="90" height="60" class="ns"/>
<text x="425" y="178" class="s" text-anchor="middle">聚落</text>
<circle cx="220" cy="250" r="8" class="na" fill="#1f51c9"/>
<text x="240" y="256" class="s" text-anchor="start">學校</text>
<rect x="90" y="372" width="120" height="12" fill="#ffffff" class="n"/>
<rect x="90" y="372" width="60" height="12" class="ns"/>
<text x="90" y="362" class="s" text-anchor="middle">0</text>
<text x="150" y="362" class="s" text-anchor="middle">1</text>
<text x="210" y="362" class="s" text-anchor="middle">2 公里</text>
<text x="224" y="384" class="s" text-anchor="start">1 : 5000</text>
<circle cx="520" cy="150" r="22" class="n"/>
<path d="M 520 134 L 528 160 L 520 152 L 512 160 Z" class="la" fill="#1f51c9"/>
<text x="520" y="190" class="s" text-anchor="middle">N</text>
<rect x="380" y="300" width="170" height="44" rx="4" fill="#ffffff" class="n"/>
<rect x="392" y="312" width="18" height="18" class="ns"/>
<text x="418" y="326" class="s" text-anchor="start">學校</text>
</svg>
</div>
</div>
</body>
</html>
