<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>灼燙傷急救：沖、脫、蓋、送</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --paper:#f6f8fc;--paper2:#eef2f8;--ink:#1f2933;--muted:#52606d;--soft:#7b8794;
    --rule:#c3ccd8;--accent:#1f51c9;--accent-tint:rgba(31,81,201,0.08);
    --sans:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
    --serif:'Noto Serif TC','Songti TC',serif;
  }
  body{font-family:var(--sans);background:var(--paper);color:var(--ink);padding:24px}
  .frame{max-width:720px;margin:0 auto}
  .eyebrow{font:500 12px var(--sans);color:var(--muted);margin-bottom:6px}
  h1{font:400 22px var(--serif);color:var(--ink);margin-bottom:12px}
  .diagram-container{width:100%;overflow-x:auto}
  svg{width:100%;min-width:640px;display:block}
  svg text{font-family:var(--sans)}
  .h{font:400 22px var(--serif);fill:var(--ink)}
  .e{font:500 12px var(--sans);fill:var(--muted)}
  .t{font:600 16px var(--sans);fill:var(--ink)}
  .ts{font:600 15px var(--sans);fill:var(--ink)}
  .s{font:500 13px var(--sans);fill:var(--soft)}
  .sb{font:500 13px var(--sans);fill:var(--ink)}
  .a{font:600 15px var(--sans);fill:var(--accent)}
  .big{font:400 44px var(--serif);fill:var(--ink)}
  .mid{font:400 34px var(--serif);fill:var(--ink)}
  .n{fill:#ffffff;stroke:var(--ink);stroke-width:1}
  .na{fill:var(--accent-tint);stroke:var(--accent);stroke-width:1.2}
  .ns{fill:rgba(31,41,51,0.05);stroke:var(--muted);stroke-width:1}
  .ln{stroke:var(--ink);stroke-width:1.2;fill:none}
  .lm{stroke:var(--muted);stroke-width:1;fill:none}
  .la{stroke:var(--accent);stroke-width:1.4;fill:none}
  .dash{stroke-dasharray:5 4}
</style>
</head>
<body>
<div class="frame">
<p class="eyebrow">健康與體育・小心灼燙傷</p>
<h1>灼燙傷急救：沖、脫、蓋、送</h1>
<div class="diagram-container">
<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hp-burn-title hp-burn-desc">
  <title id="hp-burn-title">灼燙傷急救：沖、脫、蓋、送</title>
  <desc id="hp-burn-desc">灼燙傷急救四個步驟依序排列，並提醒不可塗牙膏或戳破水泡。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52606d"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1f51c9"/></marker></defs>
  <rect width="100%" height="100%" fill="#f6f8fc"/>
  <text x="32" y="30" class="e">健康與體育・小心灼燙傷</text>
<text x="32" y="58" class="h">灼燙傷急救：沖、脫、蓋、送</text>
  <rect x="20" y="116" width="130" height="108" rx="6" fill="#f6f8fc"/>
<rect x="20" y="116" width="130" height="108" rx="6" class="n"/>
<text x="36" y="148" class="a" text-anchor="start">①</text>
<text x="72" y="148" class="ts" text-anchor="start">沖</text>
<text x="36" y="178" class="s" text-anchor="start">用流動的冷水</text>
<text x="36" y="198" class="s" text-anchor="start">沖 10～15 分鐘</text>
<line x1="152" y1="170" x2="168" y2="170" class="lm" marker-end="url(#arrow)"/>
<rect x="170" y="116" width="130" height="108" rx="6" fill="#f6f8fc"/>
<rect x="170" y="116" width="130" height="108" rx="6" class="n"/>
<text x="186" y="148" class="a" text-anchor="start">②</text>
<text x="222" y="148" class="ts" text-anchor="start">脫</text>
<text x="186" y="178" class="s" text-anchor="start">小心脫下衣物</text>
<text x="186" y="198" class="s" text-anchor="start">黏住不要硬撕</text>
<line x1="302" y1="170" x2="318" y2="170" class="lm" marker-end="url(#arrow)"/>
<rect x="320" y="116" width="130" height="108" rx="6" fill="#f6f8fc"/>
<rect x="320" y="116" width="130" height="108" rx="6" class="n"/>
<text x="336" y="148" class="a" text-anchor="start">③</text>
<text x="372" y="148" class="ts" text-anchor="start">蓋</text>
<text x="336" y="178" class="s" text-anchor="start">用乾淨的布</text>
<text x="336" y="198" class="s" text-anchor="start">或紗布覆蓋傷口</text>
<line x1="452" y1="170" x2="468" y2="170" class="lm" marker-end="url(#arrow)"/>
<rect x="470" y="116" width="130" height="108" rx="6" fill="#f6f8fc"/>
<rect x="470" y="116" width="130" height="108" rx="6" class="n"/>
<text x="486" y="148" class="a" text-anchor="start">④</text>
<text x="522" y="148" class="ts" text-anchor="start">送</text>
<text x="486" y="178" class="s" text-anchor="start">送醫治療</text>
<text x="486" y="198" class="s" text-anchor="start">並告知受傷原因</text>
<text x="20" y="268" class="sb" text-anchor="start">順序：沖 → 脫 → 蓋 → 送，一步一步做，傷口才不會更嚴重。</text>
<text x="20" y="316" class="s" text-anchor="start">不要塗牙膏、醬油或撒鹽巴，也不要自己戳破水泡。</text>
<text x="20" y="344" class="s" text-anchor="start">燙傷後先用流動冷水沖洗，是最重要的第一步。</text>
</svg>
</div>
</div>
</body>
</html>
