<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>It's four fifty.</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --paper:#f6f8fc;--paper2:#eef2f8;--ink:#1f2933;--muted:#52606d;--soft:#7b8794;
    --rule:#c3ccd8;--accent:#1f51c9;--accent-tint:rgba(31,81,201,0.08);
    --sans:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
    --serif:'Noto Serif TC','Songti TC',serif;
  }
  body{font-family:var(--sans);background:var(--paper);color:var(--ink);padding:24px}
  .frame{max-width:720px;margin:0 auto}
  .eyebrow{font:500 12px var(--sans);color:var(--muted);margin-bottom:6px}
  h1{font:400 22px var(--serif);color:var(--ink);margin-bottom:12px}
  .diagram-container{width:100%;overflow-x:auto}
  svg{width:100%;min-width:640px;display:block}
  svg text{font-family:var(--sans)}
  .h{font:400 22px var(--serif);fill:var(--ink)}
  .e{font:500 12px var(--sans);fill:var(--muted)}
  .t{font:600 16px var(--sans);fill:var(--ink)}
  .ts{font:600 15px var(--sans);fill:var(--ink)}
  .s{font:500 13px var(--sans);fill:var(--soft)}
  .sb{font:500 13px var(--sans);fill:var(--ink)}
  .a{font:600 15px var(--sans);fill:var(--accent)}
  .big{font:400 44px var(--serif);fill:var(--ink)}
  .mid{font:400 34px var(--serif);fill:var(--ink)}
  .n{fill:#ffffff;stroke:var(--ink);stroke-width:1}
  .na{fill:var(--accent-tint);stroke:var(--accent);stroke-width:1.2}
  .ns{fill:rgba(31,41,51,0.05);stroke:var(--muted);stroke-width:1}
  .ln{stroke:var(--ink);stroke-width:1.2;fill:none}
  .lm{stroke:var(--muted);stroke-width:1;fill:none}
  .la{stroke:var(--accent);stroke-width:1.4;fill:none}
  .dash{stroke-dasharray:5 4}
</style>
</head>
<body>
<div class="frame">
<p class="eyebrow">英語文・Unit 2 Time</p>
<h1>It's four fifty.</h1>
<div class="diagram-container">
<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="eng-clock-title eng-clock-desc">
  <title id="eng-clock-title">It's four fifty.</title>
  <desc id="eng-clock-desc">指著 4:50 的圓形時鐘，說明短針與長針各指在哪裡。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52606d"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1f51c9"/></marker></defs>
  <rect width="100%" height="100%" fill="#f6f8fc"/>
  <text x="32" y="30" class="e">英語文・Unit 2 Time</text>
<text x="32" y="58" class="h">It's four fifty.</text>
  <circle cx="320" cy="218" r="118" fill="#ffffff" class="n"/>
<line x1="320.0" y1="116.0" x2="320.0" y2="104.0" class="ln"/>
<line x1="371.0" y1="129.7" x2="377.0" y2="119.3" class="lm"/>
<line x1="408.3" y1="167.0" x2="418.7" y2="161.0" class="lm"/>
<line x1="422.0" y1="218.0" x2="434.0" y2="218.0" class="ln"/>
<line x1="408.3" y1="269.0" x2="418.7" y2="275.0" class="lm"/>
<line x1="371.0" y1="306.3" x2="377.0" y2="316.7" class="lm"/>
<line x1="320.0" y1="320.0" x2="320.0" y2="332.0" class="ln"/>
<line x1="269.0" y1="306.3" x2="263.0" y2="316.7" class="lm"/>
<line x1="231.7" y1="269.0" x2="221.3" y2="275.0" class="lm"/>
<line x1="218.0" y1="218.0" x2="206.0" y2="218.0" class="ln"/>
<line x1="231.7" y1="167.0" x2="221.3" y2="161.0" class="lm"/>
<line x1="269.0" y1="129.7" x2="263.0" y2="119.3" class="lm"/>
<text x="320" y="139" class="s" text-anchor="middle">12</text>
<text x="404" y="223" class="s" text-anchor="middle">3</text>
<text x="320" y="307" class="s" text-anchor="middle">6</text>
<text x="236" y="223" class="s" text-anchor="middle">9</text>
<line x1="320" y1="218" x2="357.9" y2="272.1" class="ln" stroke-width="3"/>
<line x1="320" y1="218" x2="236.9" y2="170.0" class="la" stroke-width="2.4"/>
<circle cx="320" cy="218" r="5" class="la" fill="#1f51c9"/>
<text x="320" y="372" class="s" text-anchor="middle">短針指向 4 和 5 之間，長針指向 10，就是 4:50。</text>
</svg>
</div>
</div>
</body>
</html>
