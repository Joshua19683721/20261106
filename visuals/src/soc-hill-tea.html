<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>山坡上的階梯茶園</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --paper:#f6f8fc;--paper2:#eef2f8;--ink:#1f2933;--muted:#52606d;--soft:#7b8794;
    --rule:#c3ccd8;--accent:#1f51c9;--accent-tint:rgba(31,81,201,0.08);
    --sans:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
    --serif:'Noto Serif TC','Songti TC',serif;
  }
  body{font-family:var(--sans);background:var(--paper);color:var(--ink);padding:24px}
  .frame{max-width:720px;margin:0 auto}
  .eyebrow{font:500 12px var(--sans);color:var(--muted);margin-bottom:6px}
  h1{font:400 22px var(--serif);color:var(--ink);margin-bottom:12px}
  .diagram-container{width:100%;overflow-x:auto}
  svg{width:100%;min-width:640px;display:block}
  svg text{font-family:var(--sans)}
  .h{font:400 22px var(--serif);fill:var(--ink)}
  .e{font:500 12px var(--sans);fill:var(--muted)}
  .t{font:600 16px var(--sans);fill:var(--ink)}
  .ts{font:600 15px var(--sans);fill:var(--ink)}
  .s{font:500 13px var(--sans);fill:var(--soft)}
  .sb{font:500 13px var(--sans);fill:var(--ink)}
  .a{font:600 15px var(--sans);fill:var(--accent)}
  .big{font:400 44px var(--serif);fill:var(--ink)}
  .mid{font:400 34px var(--serif);fill:var(--ink)}
  .n{fill:#ffffff;stroke:var(--ink);stroke-width:1}
  .na{fill:var(--accent-tint);stroke:var(--accent);stroke-width:1.2}
  .ns{fill:rgba(31,41,51,0.05);stroke:var(--muted);stroke-width:1}
  .ln{stroke:var(--ink);stroke-width:1.2;fill:none}
  .lm{stroke:var(--muted);stroke-width:1;fill:none}
  .la{stroke:var(--accent);stroke-width:1.4;fill:none}
  .dash{stroke-dasharray:5 4}
</style>
</head>
<body>
<div class="frame">
<p class="eyebrow">社會・丘陵的茶園</p>
<h1>山坡上的階梯茶園</h1>
<div class="diagram-container">
<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="soc-hill-tea-title soc-hill-tea-desc">
  <title id="soc-hill-tea-title">山坡上的階梯茶園</title>
  <desc id="soc-hill-tea-desc">丘陵坡地沿等高線做成階梯種植茶樹的剖面示意。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52606d"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1f51c9"/></marker></defs>
  <rect width="100%" height="100%" fill="#f6f8fc"/>
  <text x="32" y="30" class="e">社會・丘陵的茶園</text>
<text x="32" y="58" class="h">山坡上的階梯茶園</text>
  <line x1="48" y1="300" x2="592" y2="300" class="lm"/>
<path d="M 48 300 L 168 232 L 288 164 L 408 108 L 528 72" class="ln"/>
<line x1="112" y1="232" x2="168" y2="232" class="ln"/>
<line x1="112" y1="258" x2="168" y2="258" class="la dash"/>
<circle cx="128" cy="226" r="7" class="na"/>
<circle cx="146" cy="226" r="7" class="na"/>
<circle cx="164" cy="226" r="7" class="na"/>
<line x1="232" y1="164" x2="288" y2="164" class="ln"/>
<line x1="232" y1="190" x2="288" y2="190" class="la dash"/>
<circle cx="248" cy="158" r="7" class="na"/>
<circle cx="266" cy="158" r="7" class="na"/>
<circle cx="284" cy="158" r="7" class="na"/>
<line x1="352" y1="108" x2="408" y2="108" class="ln"/>
<line x1="352" y1="134" x2="408" y2="134" class="la dash"/>
<circle cx="368" cy="102" r="7" class="na"/>
<circle cx="386" cy="102" r="7" class="na"/>
<circle cx="404" cy="102" r="7" class="na"/>
<line x1="472" y1="72" x2="528" y2="72" class="ln"/>
<line x1="472" y1="98" x2="528" y2="98" class="la dash"/>
<circle cx="488" cy="66" r="7" class="na"/>
<circle cx="506" cy="66" r="7" class="na"/>
<circle cx="524" cy="66" r="7" class="na"/>
<text x="200" y="344" class="s" text-anchor="middle">階梯茶園：沿著等高線一階一階種茶</text>
<text x="88" y="196" class="ts" text-anchor="start">丘陵</text>
<text x="88" y="220" class="s" text-anchor="start">坡度較緩</text>
<text x="556" y="132" class="s" text-anchor="start">山頂</text>
<text x="64" y="372" class="s" text-anchor="start">一階一階的茶樹排成階梯，方便耕作也減少土壤流失。</text>
</svg>
</div>
</div>
</body>
</html>
