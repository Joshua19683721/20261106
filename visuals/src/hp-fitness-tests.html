<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>體適能檢測的常見項目</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --paper:#f6f8fc;--paper2:#eef2f8;--ink:#1f2933;--muted:#52606d;--soft:#7b8794;
    --rule:#c3ccd8;--accent:#1f51c9;--accent-tint:rgba(31,81,201,0.08);
    --sans:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
    --serif:'Noto Serif TC','Songti TC',serif;
  }
  body{font-family:var(--sans);background:var(--paper);color:var(--ink);padding:24px}
  .frame{max-width:720px;margin:0 auto}
  .eyebrow{font:500 12px var(--sans);color:var(--muted);margin-bottom:6px}
  h1{font:400 22px var(--serif);color:var(--ink);margin-bottom:12px}
  .diagram-container{width:100%;overflow-x:auto}
  svg{width:100%;min-width:640px;display:block}
  svg text{font-family:var(--sans)}
  .h{font:400 22px var(--serif);fill:var(--ink)}
  .e{font:500 12px var(--sans);fill:var(--muted)}
  .t{font:600 16px var(--sans);fill:var(--ink)}
  .ts{font:600 15px var(--sans);fill:var(--ink)}
  .s{font:500 13px var(--sans);fill:var(--soft)}
  .sb{font:500 13px var(--sans);fill:var(--ink)}
  .a{font:600 15px var(--sans);fill:var(--accent)}
  .big{font:400 44px var(--serif);fill:var(--ink)}
  .mid{font:400 34px var(--serif);fill:var(--ink)}
  .n{fill:#ffffff;stroke:var(--ink);stroke-width:1}
  .na{fill:var(--accent-tint);stroke:var(--accent);stroke-width:1.2}
  .ns{fill:rgba(31,41,51,0.05);stroke:var(--muted);stroke-width:1}
  .ln{stroke:var(--ink);stroke-width:1.2;fill:none}
  .lm{stroke:var(--muted);stroke-width:1;fill:none}
  .la{stroke:var(--accent);stroke-width:1.4;fill:none}
  .dash{stroke-dasharray:5 4}
</style>
</head>
<body>
<div class="frame">
<p class="eyebrow">健康與體育・健康體適能</p>
<h1>體適能檢測的常見項目</h1>
<div class="diagram-container">
<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hp-fitness-tests-title hp-fitness-tests-desc">
  <title id="hp-fitness-tests-title">體適能檢測的常見項目</title>
  <desc id="hp-fitness-tests-desc">立定跳遠、坐姿體前彎、800 公尺跑、仰臥起坐、引向上與跳繩六項。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52606d"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1f51c9"/></marker></defs>
  <rect width="100%" height="100%" fill="#f6f8fc"/>
  <text x="32" y="30" class="e">健康與體育・健康體適能</text>
<text x="32" y="58" class="h">體適能檢測的常見項目</text>
  <rect x="40" y="116" width="176" height="112" rx="6" fill="#f6f8fc"/>
<rect x="40" y="116" width="176" height="112" rx="6" class="n"/>
<path d="M 68 162 Q 98 120 128 162" class="la" fill="none"/>
<line x1="64" y1="162" x2="132" y2="162" class="lm"/>
<text x="128" y="208" class="ts" text-anchor="middle">立定跳遠</text>
<rect x="230" y="116" width="176" height="112" rx="6" fill="#f6f8fc"/>
<rect x="230" y="116" width="176" height="112" rx="6" class="n"/>
<circle cx="266" cy="128" r="9" class="ln"/>
<path d="M 266 138 L 282 160 L 318 160" class="ln"/>
<line x1="248" y1="168" x2="328" y2="168" class="lm dash"/>
<text x="318" y="208" class="ts" text-anchor="middle">坐姿體前彎</text>
<rect x="420" y="116" width="176" height="112" rx="6" fill="#f6f8fc"/>
<rect x="420" y="116" width="176" height="112" rx="6" class="n"/>
<circle cx="460" cy="124" r="9" class="ln"/>
<path d="M 460 134 L 484 146 L 504 132" class="la" fill="none"/>
<line x1="438" y1="168" x2="518" y2="168" class="lm"/>
<text x="508" y="208" class="ts" text-anchor="middle">800 公尺跑</text>
<rect x="40" y="244" width="176" height="112" rx="6" fill="#f6f8fc"/>
<rect x="40" y="244" width="176" height="112" rx="6" class="n"/>
<circle cx="72" cy="278" r="9" class="ln"/>
<path d="M 82 278 L 114 276" class="ln"/>
<path d="M 114 276 L 128 288" class="ln"/>
<text x="128" y="336" class="ts" text-anchor="middle">30 秒仰臥起坐</text>
<rect x="230" y="244" width="176" height="112" rx="6" fill="#f6f8fc"/>
<rect x="230" y="244" width="176" height="112" rx="6" class="n"/>
<line x1="254" y1="250" x2="322" y2="250" class="ln"/>
<circle cx="278" cy="272" r="8" class="ln"/>
<line x1="278" y1="260" x2="278" y2="250" class="ln"/>
<line x1="298" y1="260" x2="298" y2="250" class="ln"/>
<text x="318" y="336" class="ts" text-anchor="middle">引向上</text>
<rect x="420" y="244" width="176" height="112" rx="6" fill="#f6f8fc"/>
<rect x="420" y="244" width="176" height="112" rx="6" class="n"/>
<path d="M 468 270 A 30 30 0 1 1 488 270" class="la" fill="none"/>
<circle cx="478" cy="284" r="6" class="ln"/>
<text x="508" y="336" class="ts" text-anchor="middle">一分鐘跳繩</text>
<text x="40" y="100" class="sb" text-anchor="start">體適能檢測常用的項目：每一項都有它要測的能力。</text>
</svg>
</div>
</div>
</body>
</html>
