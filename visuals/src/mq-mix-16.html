<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>統整應用</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --paper:#f6f8fc;--paper2:#eef2f8;--ink:#1f2933;--muted:#52606d;--soft:#7b8794;
    --rule:#c3ccd8;--accent:#1f51c9;--accent-tint:rgba(31,81,201,0.08);
    --sans:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
    --serif:'Noto Serif TC','Songti TC',serif;
  }
  body{font-family:var(--sans);background:var(--paper);color:var(--ink);padding:24px}
  .frame{max-width:720px;margin:0 auto}
  .eyebrow{font:500 12px var(--sans);color:var(--muted);margin-bottom:6px}
  h1{font:400 22px var(--serif);color:var(--ink);margin-bottom:12px}
  .diagram-container{width:100%;overflow-x:auto}
  svg{width:100%;min-width:640px;display:block}
  svg text{font-family:var(--sans)}
  .h{font:400 22px var(--serif);fill:var(--ink)}
  .e{font:500 12px var(--sans);fill:var(--muted)}
  .t{font:600 16px var(--sans);fill:var(--ink)}
  .ts{font:600 15px var(--sans);fill:var(--ink)}
  .s{font:500 13px var(--sans);fill:var(--soft)}
  .sb{font:500 13px var(--sans);fill:var(--ink)}
  .a{font:600 15px var(--sans);fill:var(--accent)}
  .big{font:400 44px var(--serif);fill:var(--ink)}
  .mid{font:400 34px var(--serif);fill:var(--ink)}
  .n{fill:#ffffff;stroke:var(--ink);stroke-width:1}
  .na{fill:var(--accent-tint);stroke:var(--accent);stroke-width:1.2}
  .ns{fill:rgba(31,41,51,0.05);stroke:var(--muted);stroke-width:1}
  .ln{stroke:var(--ink);stroke-width:1.2;fill:none}
  .lm{stroke:var(--muted);stroke-width:1;fill:none}
  .la{stroke:var(--accent);stroke-width:1.4;fill:none}
  .dash{stroke-dasharray:5 4}
</style>
</head>
<body>
<div class="frame">
<p class="eyebrow">統整應用 統整應用</p>
<h1>統整應用</h1>
<div class="diagram-container">
<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mq-mix-16-title mq-mix-16-desc">
  <title id="mq-mix-16-title">統整應用</title>
  <desc id="mq-mix-16-desc">長條圖中，甲 24 本、乙 18 本、丙 12 本，甲比丙多幾本？</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52606d"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1f51c9"/></marker></defs>
  <rect width="100%" height="100%" fill="#f6f8fc"/>
  <text x="32" y="30" class="e">統整應用 統整應用</text>
<text x="32" y="58" class="h">統整應用</text>
  <text x="60" y="120" class="ts" text-anchor="start">長條圖比較</text>
<line x1="140" y1="300" x2="140" y2="50" class="ln"/>
<line x1="140" y1="300" x2="560" y2="300" class="ln"/>
<line x1="140" y1="300" x2="560" y2="300" class="lm dash"/>
<text x="128" y="305" class="s" text-anchor="end">0</text>
<line x1="140" y1="283" x2="560" y2="283" class="lm dash"/>
<text x="128" y="288" class="s" text-anchor="end">2</text>
<line x1="140" y1="266" x2="560" y2="266" class="lm dash"/>
<text x="128" y="271" class="s" text-anchor="end">4</text>
<line x1="140" y1="250" x2="560" y2="250" class="lm dash"/>
<text x="128" y="255" class="s" text-anchor="end">6</text>
<line x1="140" y1="233" x2="560" y2="233" class="lm dash"/>
<text x="128" y="238" class="s" text-anchor="end">8</text>
<line x1="140" y1="216" x2="560" y2="216" class="lm dash"/>
<text x="128" y="221" class="s" text-anchor="end">10</text>
<line x1="140" y1="200" x2="560" y2="200" class="lm dash"/>
<text x="128" y="205" class="s" text-anchor="end">12</text>
<line x1="140" y1="183" x2="560" y2="183" class="lm dash"/>
<text x="128" y="188" class="s" text-anchor="end">14</text>
<line x1="140" y1="166" x2="560" y2="166" class="lm dash"/>
<text x="128" y="171" class="s" text-anchor="end">16</text>
<line x1="140" y1="150" x2="560" y2="150" class="lm dash"/>
<text x="128" y="155" class="s" text-anchor="end">18</text>
<line x1="140" y1="133" x2="560" y2="133" class="lm dash"/>
<text x="128" y="138" class="s" text-anchor="end">20</text>
<line x1="140" y1="116" x2="560" y2="116" class="lm dash"/>
<text x="128" y="121" class="s" text-anchor="end">22</text>
<line x1="140" y1="100" x2="560" y2="100" class="lm dash"/>
<text x="128" y="105" class="s" text-anchor="end">24</text>
<line x1="140" y1="83" x2="560" y2="83" class="lm dash"/>
<text x="128" y="88" class="s" text-anchor="end">26</text>
<line x1="140" y1="66" x2="560" y2="66" class="lm dash"/>
<text x="128" y="71" class="s" text-anchor="end">28</text>
<line x1="140" y1="49" x2="560" y2="49" class="lm dash"/>
<text x="128" y="54" class="s" text-anchor="end">30</text>
<rect x="180" y="100" width="22" height="200" rx="6" class="n"/>
<rect x="180" y="100" width="22" height="200" rx="6" class="na"/>
<text x="191" y="326" class="ts" text-anchor="middle">甲</text>
<rect x="270" y="150" width="22" height="150" rx="6" class="n"/>
<rect x="270" y="150" width="22" height="150" rx="6" class="na"/>
<text x="281" y="326" class="ts" text-anchor="middle">乙</text>
<rect x="360" y="200" width="22" height="100" rx="6" class="n"/>
<rect x="360" y="200" width="22" height="100" rx="6" class="na"/>
<text x="371" y="326" class="ts" text-anchor="middle">丙</text>
<text x="100" y="42" class="s" text-anchor="end">本</text>
<text x="60" y="340" class="sb" text-anchor="start">題目裡的數字，都可以在圖上找到。</text>
</svg>
</div>
</div>
</body>
</html>
