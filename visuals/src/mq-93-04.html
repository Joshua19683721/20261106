<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>同分母分數的加減</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --paper:#f6f8fc;--paper2:#eef2f8;--ink:#1f2933;--muted:#52606d;--soft:#7b8794;
    --rule:#c3ccd8;--accent:#1f51c9;--accent-tint:rgba(31,81,201,0.08);
    --sans:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
    --serif:'Noto Serif TC','Songti TC',serif;
  }
  body{font-family:var(--sans);background:var(--paper);color:var(--ink);padding:24px}
  .frame{max-width:720px;margin:0 auto}
  .eyebrow{font:500 12px var(--sans);color:var(--muted);margin-bottom:6px}
  h1{font:400 22px var(--serif);color:var(--ink);margin-bottom:12px}
  .diagram-container{width:100%;overflow-x:auto}
  svg{width:100%;min-width:640px;display:block}
  svg text{font-family:var(--sans)}
  .h{font:400 22px var(--serif);fill:var(--ink)}
  .e{font:500 12px var(--sans);fill:var(--muted)}
  .t{font:600 16px var(--sans);fill:var(--ink)}
  .ts{font:600 15px var(--sans);fill:var(--ink)}
  .s{font:500 13px var(--sans);fill:var(--soft)}
  .sb{font:500 13px var(--sans);fill:var(--ink)}
  .a{font:600 15px var(--sans);fill:var(--accent)}
  .big{font:400 44px var(--serif);fill:var(--ink)}
  .mid{font:400 34px var(--serif);fill:var(--ink)}
  .n{fill:#ffffff;stroke:var(--ink);stroke-width:1}
  .na{fill:var(--accent-tint);stroke:var(--accent);stroke-width:1.2}
  .ns{fill:rgba(31,41,51,0.05);stroke:var(--muted);stroke-width:1}
  .ln{stroke:var(--ink);stroke-width:1.2;fill:none}
  .lm{stroke:var(--muted);stroke-width:1;fill:none}
  .la{stroke:var(--accent);stroke-width:1.4;fill:none}
  .dash{stroke-dasharray:5 4}
</style>
</head>
<body>
<div class="frame">
<p class="eyebrow">9-3 同分母分數的加減</p>
<h1>同分母分數的加減</h1>
<div class="diagram-container">

  <rect width="100%" height="100%" fill="#f6f8fc"/>
  <text x="32" y="30" class="e">9-3 同分母分數的加減</text>
<text x="32" y="58" class="h">同分母分數的加減</text>
  <rect x="90" y="150" width="220" height="54" rx="4" class="n"/>
<line x1="117" y1="150" x2="117" y2="204" class="lm"/>
<line x1="145" y1="150" x2="145" y2="204" class="lm"/>

<rect x="91" y="151" width="24" height="51" rx="3" class="na"/>
<rect x="119" y="151" width="24" height="51" rx="3" class="na"/>
<rect x="146" y="151" width="24" height="51" rx="3" class="na"/>
<text x="200" y="234" class="sb" text-anchor="middle">3/8</text>
<rect x="350" y="150" width="220" height="54" rx="4" class="n"/>
<line x1="377" y1="150" x2="377" y2="204" class="lm"/>
<line x1="405" y1="150" x2="405" y2="204" class="lm"/>
<line x1="432" y1="150" x2="432" y2="204" class="lm"/>
<line x1="460" y1="150" x2="460" y2="204" class="lm"/>

<line x1="542" y1="150" x2="542" y2="204" class="lm"/>
<rect x="351" y="151" width="24" height="51" rx="3" class="na"/>
<rect x="379" y="151" width="24" height="51" rx="3" class="na"/>
<rect x="406" y="151" width="24" height="51" rx="3" class="na"/>
<rect x="434" y="151" width="24" height="51" rx="3" class="na"/>
<rect x="461" y="151" width="24" height="51" rx="3" class="na"/>
<text x="460" y="234" class="sb" text-anchor="middle">5/8</text>
<text x="60" y="320" class="sb" text-anchor="start">同分母分數相加，分母不變、分子相加。</text>
</svg>
</div>
</div>
</body>
</html>
