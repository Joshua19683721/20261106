<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>情境：統計圖怎麼看</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --paper:#f6f8fc;--paper2:#eef2f8;--ink:#1f2933;--muted:#52606d;--soft:#7b8794;
    --rule:#c3ccd8;--accent:#1f51c9;--accent-tint:rgba(31,81,201,0.08);
    --sans:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
    --serif:'Noto Serif TC','Songti TC',serif;
  }
  body{font-family:var(--sans);background:var(--paper);color:var(--ink);padding:24px}
  .frame{max-width:720px;margin:0 auto}
  .eyebrow{font:500 12px var(--sans);color:var(--muted);margin-bottom:6px}
  h1{font:400 22px var(--serif);color:var(--ink);margin-bottom:12px}
  .diagram-container{width:100%;overflow-x:auto}
  svg{width:100%;min-width:640px;display:block}
  svg text{font-family:var(--sans)}
  .h{font:400 22px var(--serif);fill:var(--ink)}
  .e{font:500 12px var(--sans);fill:var(--muted)}
  .t{font:600 16px var(--sans);fill:var(--ink)}
  .ts{font:600 15px var(--sans);fill:var(--ink)}
  .s{font:500 13px var(--sans);fill:var(--soft)}
  .sb{font:500 13px var(--sans);fill:var(--ink)}
  .a{font:600 15px var(--sans);fill:var(--accent)}
  .big{font:400 44px var(--serif);fill:var(--ink)}
  .mid{font:400 34px var(--serif);fill:var(--ink)}
  .n{fill:#ffffff;stroke:var(--ink);stroke-width:1}
  .na{fill:var(--accent-tint);stroke:var(--accent);stroke-width:1.2}
  .ns{fill:rgba(31,41,51,0.05);stroke:var(--muted);stroke-width:1}
  .ln{stroke:var(--ink);stroke-width:1.2;fill:none}
  .lm{stroke:var(--muted);stroke-width:1;fill:none}
  .la{stroke:var(--accent);stroke-width:1.4;fill:none}
  .dash{stroke-dasharray:5 4}
</style>
</head>
<body>
<div class="frame">
<p class="eyebrow">數學・統整應用</p>
<h1>情境：統計圖怎麼看</h1>
<div class="diagram-container">
<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="math-story-chart-title math-story-chart-desc">
  <title id="math-story-chart-title">情境：統計圖怎麼看</title>
  <desc id="math-story-chart-desc">長條圖與折線圖的說明卡。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52606d"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1f51c9"/></marker></defs>
  <rect width="100%" height="100%" fill="#f6f8fc"/>
  <text x="32" y="30" class="e">數學・統整應用</text>
<text x="32" y="58" class="h">情境：統計圖怎麼看</text>
  <line x1="100" y1="250" x2="100" y2="80" class="ln"/>
<line x1="100" y1="250" x2="560" y2="250" class="ln"/>
<line x1="100" y1="250" x2="560" y2="250" class="lm dash"/>
<text x="88" y="255" class="s" text-anchor="end">0</text>
<line x1="100" y1="207" x2="560" y2="207" class="lm dash"/>
<text x="88" y="212" class="s" text-anchor="end">4</text>
<line x1="100" y1="165" x2="560" y2="165" class="lm dash"/>
<text x="88" y="170" class="s" text-anchor="end">8</text>
<line x1="100" y1="122" x2="560" y2="122" class="lm dash"/>
<text x="88" y="127" class="s" text-anchor="end">12</text>
<line x1="100" y1="80" x2="560" y2="80" class="lm dash"/>
<text x="88" y="85" class="s" text-anchor="end">16</text>
<rect x="140" y="122" width="22" height="127" rx="6" class="n"/>
<rect x="140" y="122" width="22" height="127" rx="6" class="na"/>
<text x="151" y="276" class="ts" text-anchor="middle">甲</text>
<rect x="190" y="165" width="22" height="85" rx="6" class="n"/>
<rect x="190" y="165" width="22" height="85" rx="6" class="na"/>
<text x="201" y="276" class="ts" text-anchor="middle">乙</text>
<rect x="240" y="186" width="22" height="63" rx="6" class="n"/>
<rect x="240" y="186" width="22" height="63" rx="6" class="na"/>
<text x="251" y="276" class="ts" text-anchor="middle">丙</text>
<text x="60" y="72" class="s" text-anchor="end">人</text>
<text x="240" y="136" class="ts" text-anchor="start">圖表要看懂</text>
<text x="240" y="170" class="s" text-anchor="start">長條圖：比較多寡</text>
<text x="240" y="196" class="s" text-anchor="start">折線圖：看出變化</text>
<text x="380" y="160" class="ts" text-anchor="start">長條圖</text>
<text x="380" y="186" class="s" text-anchor="start">一根一根比較</text>
<text x="380" y="224" class="ts" text-anchor="start">折線圖</text>
<text x="380" y="250" class="s" text-anchor="start">連起來看變化</text>
<text x="60" y="350" class="sb" text-anchor="start">先看圖表的名稱與標題，再看數值。</text>
</svg>
</div>
</div>
</body>
</html>
