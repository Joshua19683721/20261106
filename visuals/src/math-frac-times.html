<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>分數乘整數</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --paper:#f6f8fc;--paper2:#eef2f8;--ink:#1f2933;--muted:#52606d;--soft:#7b8794;
    --rule:#c3ccd8;--accent:#1f51c9;--accent-tint:rgba(31,81,201,0.08);
    --sans:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
    --serif:'Noto Serif TC','Songti TC',serif;
  }
  body{font-family:var(--sans);background:var(--paper);color:var(--ink);padding:24px}
  .frame{max-width:720px;margin:0 auto}
  .eyebrow{font:500 12px var(--sans);color:var(--muted);margin-bottom:6px}
  h1{font:400 22px var(--serif);color:var(--ink);margin-bottom:12px}
  .diagram-container{width:100%;overflow-x:auto}
  svg{width:100%;min-width:640px;display:block}
  svg text{font-family:var(--sans)}
  .h{font:400 22px var(--serif);fill:var(--ink)}
  .e{font:500 12px var(--sans);fill:var(--muted)}
  .t{font:600 16px var(--sans);fill:var(--ink)}
  .ts{font:600 15px var(--sans);fill:var(--ink)}
  .s{font:500 13px var(--sans);fill:var(--soft)}
  .sb{font:500 13px var(--sans);fill:var(--ink)}
  .a{font:600 15px var(--sans);fill:var(--accent)}
  .big{font:400 44px var(--serif);fill:var(--ink)}
  .mid{font:400 34px var(--serif);fill:var(--ink)}
  .n{fill:#ffffff;stroke:var(--ink);stroke-width:1}
  .na{fill:var(--accent-tint);stroke:var(--accent);stroke-width:1.2}
  .ns{fill:rgba(31,41,51,0.05);stroke:var(--muted);stroke-width:1}
  .ln{stroke:var(--ink);stroke-width:1.2;fill:none}
  .lm{stroke:var(--muted);stroke-width:1;fill:none}
  .la{stroke:var(--accent);stroke-width:1.4;fill:none}
  .dash{stroke-dasharray:5 4}
</style>
</head>
<body>
<div class="frame">
<p class="eyebrow">數學・9-4 分數與整數相乘</p>
<h1>分數乘整數</h1>
<div class="diagram-container">
<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="math-frac-times-title math-frac-times-desc">
  <title id="math-frac-times-title">分數乘整數</title>
  <desc id="math-frac-times-desc">5/12 的分數條與 4 個 5/12 併排。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52606d"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1f51c9"/></marker></defs>
  <rect width="100%" height="100%" fill="#f6f8fc"/>
  <text x="32" y="30" class="e">數學・9-4 分數與整數相乘</text>
<text x="32" y="58" class="h">分數乘整數</text>
  <rect x="110" y="130" width="330" height="54" rx="4" class="n"/>
<line x1="137" y1="130" x2="137" y2="184" class="lm"/>
<line x1="165" y1="130" x2="165" y2="184" class="lm"/>
<line x1="192" y1="130" x2="192" y2="184" class="lm"/>
<line x1="220" y1="130" x2="220" y2="184" class="lm"/>
<line x1="247" y1="130" x2="247" y2="184" class="lm"/>
<line x1="275" y1="130" x2="275" y2="184" class="lm"/>
<line x1="302" y1="130" x2="302" y2="184" class="lm"/>
<line x1="330" y1="130" x2="330" y2="184" class="lm"/>
<line x1="357" y1="130" x2="357" y2="184" class="lm"/>
<line x1="385" y1="130" x2="385" y2="184" class="lm"/>
<line x1="412" y1="130" x2="412" y2="184" class="lm"/>
<rect x="111" y="131" width="24" height="51" rx="3" class="na"/>
<rect x="139" y="131" width="24" height="51" rx="3" class="na"/>
<rect x="166" y="131" width="24" height="51" rx="3" class="na"/>
<rect x="194" y="131" width="24" height="51" rx="3" class="na"/>
<rect x="221" y="131" width="24" height="51" rx="3" class="na"/>
<text x="275" y="214" class="sb" text-anchor="middle">5/12</text>
<rect x="120" y="220" width="80" height="46" rx="4" class="ns"/>
<text x="160" y="250" class="s" text-anchor="middle">5/12</text>
<rect x="210" y="220" width="80" height="46" rx="4" class="ns"/>
<text x="250" y="250" class="s" text-anchor="middle">5/12</text>
<rect x="300" y="220" width="80" height="46" rx="4" class="ns"/>
<text x="340" y="250" class="s" text-anchor="middle">5/12</text>
<rect x="390" y="220" width="80" height="46" rx="4" class="ns"/>
<text x="430" y="250" class="s" text-anchor="middle">5/12</text>
<text x="110" y="300" class="sb" text-anchor="start">乘 4，就是 4 個 5/12 一起算</text>
</svg>
</div>
</div>
</body>
</html>
