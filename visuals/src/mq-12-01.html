<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>一億以內的數</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --paper:#f6f8fc;--paper2:#eef2f8;--ink:#1f2933;--muted:#52606d;--soft:#7b8794;
    --rule:#c3ccd8;--accent:#1f51c9;--accent-tint:rgba(31,81,201,0.08);
    --sans:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
    --serif:'Noto Serif TC','Songti TC',serif;
  }
  body{font-family:var(--sans);background:var(--paper);color:var(--ink);padding:24px}
  .frame{max-width:720px;margin:0 auto}
  .eyebrow{font:500 12px var(--sans);color:var(--muted);margin-bottom:6px}
  h1{font:400 22px var(--serif);color:var(--ink);margin-bottom:12px}
  .diagram-container{width:100%;overflow-x:auto}
  svg{width:100%;min-width:640px;display:block}
  svg text{font-family:var(--sans)}
  .h{font:400 22px var(--serif);fill:var(--ink)}
  .e{font:500 12px var(--sans);fill:var(--muted)}
  .t{font:600 16px var(--sans);fill:var(--ink)}
  .ts{font:600 15px var(--sans);fill:var(--ink)}
  .s{font:500 13px var(--sans);fill:var(--soft)}
  .sb{font:500 13px var(--sans);fill:var(--ink)}
  .a{font:600 15px var(--sans);fill:var(--accent)}
  .big{font:400 44px var(--serif);fill:var(--ink)}
  .mid{font:400 34px var(--serif);fill:var(--ink)}
  .n{fill:#ffffff;stroke:var(--ink);stroke-width:1}
  .na{fill:var(--accent-tint);stroke:var(--accent);stroke-width:1.2}
  .ns{fill:rgba(31,41,51,0.05);stroke:var(--muted);stroke-width:1}
  .ln{stroke:var(--ink);stroke-width:1.2;fill:none}
  .lm{stroke:var(--muted);stroke-width:1;fill:none}
  .la{stroke:var(--accent);stroke-width:1.4;fill:none}
  .dash{stroke-dasharray:5 4}
</style>
</head>
<body>
<div class="frame">
<p class="eyebrow">1-2 一億以內的數</p>
<h1>一億以內的數</h1>
<div class="diagram-container">
<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mq-12-01-title mq-12-01-desc">
  <title id="mq-12-01-title">一億以內的數</title>
  <desc id="mq-12-01-desc">「30,802,005」讀作什麼？</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52606d"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1f51c9"/></marker></defs>
  <rect width="100%" height="100%" fill="#f6f8fc"/>
  <text x="32" y="30" class="e">1-2 一億以內的數</text>
<text x="32" y="58" class="h">一億以內的數</text>
  <rect x="70" y="140" width="480" height="52" rx="0" class="n"/>
<rect x="70" y="192" width="480" height="52" rx="0" class="n"/>
<line x1="70" y1="140" x2="70" y2="244" class="lm"/>
<text x="100" y="172" class="s" text-anchor="middle">千萬</text>
<text x="100" y="228" class="sb" text-anchor="middle">3</text>
<line x1="130" y1="140" x2="130" y2="244" class="lm"/>
<text x="160" y="172" class="s" text-anchor="middle">百萬</text>
<text x="160" y="228" class="sb" text-anchor="middle">0</text>
<line x1="190" y1="140" x2="190" y2="244" class="lm"/>
<text x="220" y="172" class="s" text-anchor="middle">十萬</text>
<text x="220" y="228" class="sb" text-anchor="middle">8</text>
<line x1="250" y1="140" x2="250" y2="244" class="lm"/>
<text x="280" y="172" class="s" text-anchor="middle">萬</text>
<text x="280" y="228" class="sb" text-anchor="middle">0</text>
<line x1="310" y1="140" x2="310" y2="244" class="lm"/>
<text x="340" y="172" class="s" text-anchor="middle">千</text>
<text x="340" y="228" class="sb" text-anchor="middle">2</text>
<line x1="370" y1="140" x2="370" y2="244" class="lm"/>
<text x="400" y="172" class="s" text-anchor="middle">百</text>
<text x="400" y="228" class="sb" text-anchor="middle">0</text>
<line x1="430" y1="140" x2="430" y2="244" class="lm"/>
<text x="460" y="172" class="s" text-anchor="middle">十</text>
<text x="460" y="228" class="sb" text-anchor="middle">0</text>
<line x1="490" y1="140" x2="490" y2="244" class="lm"/>
<text x="520" y="172" class="s" text-anchor="middle">一</text>
<text x="520" y="228" class="sb" text-anchor="middle">5</text>
<line x1="70" y1="192" x2="550" y2="192" class="lm"/>
<text x="60" y="330" class="sb" text-anchor="start">照著位值表，一個位一個位讀出來。</text>
</svg>
</div>
</div>
</body>
</html>
