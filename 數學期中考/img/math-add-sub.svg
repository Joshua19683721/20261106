<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="math-add-sub-title math-add-sub-desc" id="math-add-sub-root">
  <title id="math-add-sub-title">大數的加法與減法</title>
  <desc id="math-add-sub-desc">兩張位值表，分別對應加法與減法的題目。</desc>
  <defs>
      <style>#math-add-sub-root { --paper:#f6f8fc;--paper2:#eef2f8;--ink:#1f2933;--muted:#52606d;--soft:#7b8794;
    --rule:#c3ccd8;--accent:#1f51c9;--accent-tint:rgba(31,81,201,0.08);
    --sans:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
    --serif:'Noto Serif TC','Songti TC',serif; }
      #math-add-sub-root { font-family: var(--sans); color: var(--ink); }
      #math-add-sub-root .diagram-container { width:100%;overflow-x:auto }
      #math-add-sub-root text { font-family:var(--sans) }
      #math-add-sub-root .h { font:400 22px var(--serif);fill:var(--ink) }
      #math-add-sub-root .e { font:500 12px var(--sans);fill:var(--muted) }
      #math-add-sub-root .t { font:600 16px var(--sans);fill:var(--ink) }
      #math-add-sub-root .ts { font:600 15px var(--sans);fill:var(--ink) }
      #math-add-sub-root .s { font:500 13px var(--sans);fill:var(--soft) }
      #math-add-sub-root .sb { font:500 13px var(--sans);fill:var(--ink) }
      #math-add-sub-root .a { font:600 15px var(--sans);fill:var(--accent) }
      #math-add-sub-root .big { font:400 44px var(--serif);fill:var(--ink) }
      #math-add-sub-root .mid { font:400 34px var(--serif);fill:var(--ink) }
      #math-add-sub-root .n { fill:#ffffff;stroke:var(--ink);stroke-width:1 }
      #math-add-sub-root .na { fill:var(--accent-tint);stroke:var(--accent);stroke-width:1.2 }
      #math-add-sub-root .ns { fill:rgba(31,41,51,0.05);stroke:var(--muted);stroke-width:1 }
      #math-add-sub-root .ln { stroke:var(--ink);stroke-width:1.2;fill:none }
      #math-add-sub-root .lm { stroke:var(--muted);stroke-width:1;fill:none }
      #math-add-sub-root .la { stroke:var(--accent);stroke-width:1.4;fill:none }
      #math-add-sub-root .dash { stroke-dasharray:5 4 }</style><marker id="math-add-sub-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52606d"/></marker><marker id="math-add-sub-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1f51c9"/></marker></defs>
  <rect width="100%" height="100%" fill="#f6f8fc"/>
  <text x="32" y="30" class="e">數學・1-4 大數的加減</text>
<text x="32" y="58" class="h">大數的加法與減法</text>
