<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mp-12-title mp-12-desc" id="mp-12-root">
  <title id="mp-12-title">素養題組・三角形</title>
  <desc id="mp-12-desc">七巧板由許多圖形拼成：\n其中兩塊三角形全等，\n拼成大正方形時，全等的圖形可以</desc>
  <defs>
      <style>#mp-12-root { --paper:#f6f8fc;--paper2:#eef2f8;--ink:#1f2933;--muted:#52606d;--soft:#7b8794;
    --rule:#c3ccd8;--accent:#1f51c9;--accent-tint:rgba(31,81,201,0.08);
    --sans:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
    --serif:'Noto Serif TC','Songti TC',serif; }
      #mp-12-root { font-family: var(--sans); color: var(--ink); }
      #mp-12-root .diagram-container { width:100%;overflow-x:auto }
      #mp-12-root text { font-family:var(--sans) }
      #mp-12-root .h { font:400 22px var(--serif);fill:var(--ink) }
      #mp-12-root .e { font:500 12px var(--sans);fill:var(--muted) }
      #mp-12-root .t { font:600 16px var(--sans);fill:var(--ink) }
      #mp-12-root .ts { font:600 15px var(--sans);fill:var(--ink) }
      #mp-12-root .s { font:500 13px var(--sans);fill:var(--soft) }
      #mp-12-root .sb { font:500 13px var(--sans);fill:var(--ink) }
      #mp-12-root .a { font:600 15px var(--sans);fill:var(--accent) }
      #mp-12-root .big { font:400 44px var(--serif);fill:var(--ink) }
      #mp-12-root .mid { font:400 34px var(--serif);fill:var(--ink) }
      #mp-12-root .n { fill:#ffffff;stroke:var(--ink);stroke-width:1 }
      #mp-12-root .na { fill:var(--accent-tint);stroke:var(--accent);stroke-width:1.2 }
      #mp-12-root .ns { fill:rgba(31,41,51,0.05);stroke:var(--muted);stroke-width:1 }
      #mp-12-root .ln { stroke:var(--ink);stroke-width:1.2;fill:none }
      #mp-12-root .lm { stroke:var(--muted);stroke-width:1;fill:none }
      #mp-12-root .la { stroke:var(--accent);stroke-width:1.4;fill:none }
      #mp-12-root .dash { stroke-dasharray:5 4 }</style><marker id="mp-12-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52606d"/></marker><marker id="mp-12-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1f51c9"/></marker></defs>
  <rect width="100%" height="100%" fill="#f6f8fc"/>
  <text x="32" y="30" class="e">素養題組・三角形</text>
<text x="32" y="58" class="h">素養題組・三角形</text>
  <path d="M 120 260 L 260 120 L 260 260 Z" class="ln"/>
<path d="M 260 120 L 400 260 L 260 260 Z" class="la" stroke-dasharray="5,4"/>
<text x="190" y="200" class="ts" text-anchor="middle">甲</text>
<text x="330" y="200" class="ts" text-anchor="middle">乙</text>
<text x="190" y="240" class="s" text-anchor="middle">？公分</text>
<text x="330" y="240" class="s" text-anchor="middle">？公分</text>
<text x="260" y="300" class="sb" text-anchor="middle">拼成大正方形</text>
<text x="60" y="350" class="sb" text-anchor="start">疊合後完全重合，就是全等。</text>
</svg>
