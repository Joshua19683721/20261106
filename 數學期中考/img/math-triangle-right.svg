<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="math-triangle-right-title math-triangle-right-desc" id="math-triangle-right-root">
  <title id="math-triangle-right-title">以角分類三角形</title>
  <desc id="math-triangle-right-desc">有一個角是 90 度的三角形，圖中標出 90 度的直角位置。</desc>
  <defs>
      <style>#math-triangle-right-root { --paper:#f6f8fc;--paper2:#eef2f8;--ink:#1f2933;--muted:#52606d;--soft:#7b8794;
    --rule:#c3ccd8;--accent:#1f51c9;--accent-tint:rgba(31,81,201,0.08);
    --sans:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
    --serif:'Noto Serif TC','Songti TC',serif; }
      #math-triangle-right-root { font-family: var(--sans); color: var(--ink); }
      #math-triangle-right-root .diagram-container { width:100%;overflow-x:auto }
      #math-triangle-right-root text { font-family:var(--sans) }
      #math-triangle-right-root .h { font:400 22px var(--serif);fill:var(--ink) }
      #math-triangle-right-root .e { font:500 12px var(--sans);fill:var(--muted) }
      #math-triangle-right-root .t { font:600 16px var(--sans);fill:var(--ink) }
      #math-triangle-right-root .ts { font:600 15px var(--sans);fill:var(--ink) }
      #math-triangle-right-root .s { font:500 13px var(--sans);fill:var(--soft) }
      #math-triangle-right-root .sb { font:500 13px var(--sans);fill:var(--ink) }
      #math-triangle-right-root .a { font:600 15px var(--sans);fill:var(--accent) }
      #math-triangle-right-root .big { font:400 44px var(--serif);fill:var(--ink) }
      #math-triangle-right-root .mid { font:400 34px var(--serif);fill:var(--ink) }
      #math-triangle-right-root .n { fill:#ffffff;stroke:var(--ink);stroke-width:1 }
      #math-triangle-right-root .na { fill:var(--accent-tint);stroke:var(--accent);stroke-width:1.2 }
      #math-triangle-right-root .ns { fill:rgba(31,41,51,0.05);stroke:var(--muted);stroke-width:1 }
      #math-triangle-right-root .ln { stroke:var(--ink);stroke-width:1.2;fill:none }
      #math-triangle-right-root .lm { stroke:var(--muted);stroke-width:1;fill:none }
      #math-triangle-right-root .la { stroke:var(--accent);stroke-width:1.4;fill:none }
      #math-triangle-right-root .dash { stroke-dasharray:5 4 }</style><marker id="math-triangle-right-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52606d"/></marker><marker id="math-triangle-right-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1f51c9"/></marker></defs>
  <rect width="100%" height="100%" fill="#f6f8fc"/>
  <text x="32" y="30" class="e">數學・6-3 三角形</text>
<text x="32" y="58" class="h">以角分類三角形</text>
  <path d="M 180 300 L 180 140 L 400 300 Z" class="ln"/>
<path d="M 180 272 L 208 272 L 208 300" class="la"/>
<text x="224" y="288" class="a" text-anchor="start">90°</text>
<text x="180" y="326" class="s" text-anchor="middle">直角</text>
<line x1="120" y1="300" x2="460" y2="300" class="lm"/>
<text x="120" y="356" class="s" text-anchor="start">三個角合起來是 180 度；其中一個角是 90 度。</text>
</svg>
