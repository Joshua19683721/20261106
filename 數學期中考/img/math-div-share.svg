<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="math-div-share-title math-div-share-desc" id="math-div-share-root">
  <title id="math-div-share-title">除法情境：分裝與平均分</title>
  <desc id="math-div-share-desc">4 列 3 欄的方格模型。</desc>
  <defs>
      <style>#math-div-share-root { --paper:#f6f8fc;--paper2:#eef2f8;--ink:#1f2933;--muted:#52606d;--soft:#7b8794;
    --rule:#c3ccd8;--accent:#1f51c9;--accent-tint:rgba(31,81,201,0.08);
    --sans:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
    --serif:'Noto Serif TC','Songti TC',serif; }
      #math-div-share-root { font-family: var(--sans); color: var(--ink); }
      #math-div-share-root .diagram-container { width:100%;overflow-x:auto }
      #math-div-share-root text { font-family:var(--sans) }
      #math-div-share-root .h { font:400 22px var(--serif);fill:var(--ink) }
      #math-div-share-root .e { font:500 12px var(--sans);fill:var(--muted) }
      #math-div-share-root .t { font:600 16px var(--sans);fill:var(--ink) }
      #math-div-share-root .ts { font:600 15px var(--sans);fill:var(--ink) }
      #math-div-share-root .s { font:500 13px var(--sans);fill:var(--soft) }
      #math-div-share-root .sb { font:500 13px var(--sans);fill:var(--ink) }
      #math-div-share-root .a { font:600 15px var(--sans);fill:var(--accent) }
      #math-div-share-root .big { font:400 44px var(--serif);fill:var(--ink) }
      #math-div-share-root .mid { font:400 34px var(--serif);fill:var(--ink) }
      #math-div-share-root .n { fill:#ffffff;stroke:var(--ink);stroke-width:1 }
      #math-div-share-root .na { fill:var(--accent-tint);stroke:var(--accent);stroke-width:1.2 }
      #math-div-share-root .ns { fill:rgba(31,41,51,0.05);stroke:var(--muted);stroke-width:1 }
      #math-div-share-root .ln { stroke:var(--ink);stroke-width:1.2;fill:none }
      #math-div-share-root .lm { stroke:var(--muted);stroke-width:1;fill:none }
      #math-div-share-root .la { stroke:var(--accent);stroke-width:1.4;fill:none }
      #math-div-share-root .dash { stroke-dasharray:5 4 }</style><marker id="math-div-share-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52606d"/></marker><marker id="math-div-share-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1f51c9"/></marker></defs>
