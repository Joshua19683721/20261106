<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="math-story-population-title math-story-population-desc" id="math-story-population-root">
  <title id="math-story-population-title">情境：大數相減</title>
  <desc id="math-story-population-desc">人口總數與其中一部分的示意。</desc>
  <defs>
      <style>#math-story-population-root { --paper:#f6f8fc;--paper2:#eef2f8;--ink:#1f2933;--muted:#52606d;--soft:#7b8794;
    --rule:#c3ccd8;--accent:#1f51c9;--accent-tint:rgba(31,81,201,0.08);
    --sans:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
    --serif:'Noto Serif TC','Songti TC',serif; }
      #math-story-population-root { font-family: var(--sans); color: var(--ink); }
      #math-story-population-root .diagram-container { width:100%;overflow-x:auto }
      #math-story-population-root text { font-family:var(--sans) }
      #math-story-population-root .h { font:400 22px var(--serif);fill:var(--ink) }
      #math-story-population-root .e { font:500 12px var(--sans);fill:var(--muted) }
      #math-story-population-root .t { font:600 16px var(--sans);fill:var(--ink) }
      #math-story-population-root .ts { font:600 15px var(--sans);fill:var(--ink) }
      #math-story-population-root .s { font:500 13px var(--sans);fill:var(--soft) }
      #math-story-population-root .sb { font:500 13px var(--sans);fill:var(--ink) }
      #math-story-population-root .a { font:600 15px var(--sans);fill:var(--accent) }
      #math-story-population-root .big { font:400 44px var(--serif);fill:var(--ink) }
      #math-story-population-root .mid { font:400 34px var(--serif);fill:var(--ink) }
      #math-story-population-root .n { fill:#ffffff;stroke:var(--ink);stroke-width:1 }
      #math-story-population-root .na { fill:var(--accent-tint);stroke:var(--accent);stroke-width:1.2 }
      #math-story-population-root .ns { fill:rgba(31,41,51,0.05);stroke:var(--muted);stroke-width:1 }
      #math-story-population-root .ln { stroke:var(--ink);stroke-width:1.2;fill:none }
      #math-story-population-root .lm { stroke:var(--muted);stroke-width:1;fill:none }
      #math-story-population-root .la { stroke:var(--accent);stroke-width:1.4;fill:none }
      #math-story-population-root .dash { stroke-dasharray:5 4 }</style><marker id="math-story-population-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52606d"/></marker><marker id="math-story-population-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1f51c9"/></marker></defs>
  <rect width="100%" height="100%" fill="#f6f8fc"/>
  <text x="32" y="30" class="e">數學・統整應用</text>
<text x="32" y="58" class="h">情境：大數相減</text>
  <rect x="90" y="120" width="70" height="90" rx="6" class="n"/>
<text x="125" y="172" class="ts" text-anchor="middle">人</text>
<text x="240" y="136" class="ts" text-anchor="start">縣市人口</text>
<text x="240" y="170" class="s" text-anchor="start">總人口 1,250,000 人</text>
<text x="240" y="196" class="s" text-anchor="start">市區 680,000 人</text>
<text x="240" y="222" class="s" text-anchor="start">其餘住在郊區</text>
<text x="60" y="330" class="sb" text-anchor="start">全部減掉一部分，剩下來的就是另一部分。</text>
</svg>
