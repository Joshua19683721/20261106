<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mq-51-02-title mq-51-02-desc" id="mq-51-02-root">
  <title id="mq-51-02-title">認識公里</title>
  <desc id="mq-51-02-desc">5000 公尺等於幾公里？</desc>
  <defs>
      <style>#mq-51-02-root { --paper:#f6f8fc;--paper2:#eef2f8;--ink:#1f2933;--muted:#52606d;--soft:#7b8794;
    --rule:#c3ccd8;--accent:#1f51c9;--accent-tint:rgba(31,81,201,0.08);
    --sans:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
    --serif:'Noto Serif TC','Songti TC',serif; }
      #mq-51-02-root { font-family: var(--sans); color: var(--ink); }
      #mq-51-02-root .diagram-container { width:100%;overflow-x:auto }
      #mq-51-02-root text { font-family:var(--sans) }
      #mq-51-02-root .h { font:400 22px var(--serif);fill:var(--ink) }
      #mq-51-02-root .e { font:500 12px var(--sans);fill:var(--muted) }
      #mq-51-02-root .t { font:600 16px var(--sans);fill:var(--ink) }
      #mq-51-02-root .ts { font:600 15px var(--sans);fill:var(--ink) }
      #mq-51-02-root .s { font:500 13px var(--sans);fill:var(--soft) }
      #mq-51-02-root .sb { font:500 13px var(--sans);fill:var(--ink) }
      #mq-51-02-root .a { font:600 15px var(--sans);fill:var(--accent) }
      #mq-51-02-root .big { font:400 44px var(--serif);fill:var(--ink) }
      #mq-51-02-root .mid { font:400 34px var(--serif);fill:var(--ink) }
      #mq-51-02-root .n { fill:#ffffff;stroke:var(--ink);stroke-width:1 }
      #mq-51-02-root .na { fill:var(--accent-tint);stroke:var(--accent);stroke-width:1.2 }
      #mq-51-02-root .ns { fill:rgba(31,41,51,0.05);stroke:var(--muted);stroke-width:1 }
      #mq-51-02-root .ln { stroke:var(--ink);stroke-width:1.2;fill:none }
      #mq-51-02-root .lm { stroke:var(--muted);stroke-width:1;fill:none }
      #mq-51-02-root .la { stroke:var(--accent);stroke-width:1.4;fill:none }
      #mq-51-02-root .dash { stroke-dasharray:5 4 }</style><marker id="mq-51-02-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52606d"/></marker><marker id="mq-51-02-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1f51c9"/></marker></defs>
  <rect width="100%" height="100%" fill="#f6f8fc"/>
  <text x="32" y="30" class="e">5-1 認識公里</text>
<text x="32" y="58" class="h">認識公里</text>
  <line x1="100" y1="250" x2="520" y2="250" class="ln"/>
<rect x="100" y="210" width="40" height="40" rx="6" class="n"/>
<circle cx="320" cy="190" r="16" class="na" fill="#1f51c9"/>
<text x="320" y="160" class="a" text-anchor="middle">5000 公尺</text>
<text x="60" y="320" class="sb" text-anchor="start">從起點走到這個位置，是幾公里？</text>
</svg>
