    --sans:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
    --serif:'Noto Serif TC','Songti TC',serif; }
      #mq-52-02-root { font-family: var(--sans); color: var(--ink); }
      #mq-52-02-root .diagram-container { width:100%;overflow-x:auto }
      #mq-52-02-root text { font-family:var(--sans) }
      #mq-52-02-root .h { font:400 22px var(--serif);fill:var(--ink) }
      #mq-52-02-root .e { font:500 12px var(--sans);fill:var(--muted) }
      #mq-52-02-root .t { font:600 16px var(--sans);fill:var(--ink) }
      #mq-52-02-root .ts { font:600 15px var(--sans);fill:var(--ink) }
      #mq-52-02-root .s { font:500 13px var(--sans);fill:var(--soft) }
      #mq-52-02-root .sb { font:500 13px var(--sans);fill:var(--ink) }
      #mq-52-02-root .a { font:600 15px var(--sans);fill:var(--accent) }
      #mq-52-02-root .big { font:400 44px var(--serif);fill:var(--ink) }
      #mq-52-02-root .mid { font:400 34px var(--serif);fill:var(--ink) }
      #mq-52-02-root .n { fill:#ffffff;stroke:var(--ink);stroke-width:1 }
      #mq-52-02-root .na { fill:var(--accent-tint);stroke:var(--accent);stroke-width:1.2 }
      #mq-52-02-root .ns { fill:rgba(31,41,51,0.05);stroke:var(--muted);stroke-width:1 }
      #mq-52-02-root .ln { stroke:var(--ink);stroke-width:1.2;fill:none }
      #mq-52-02-root .lm { stroke:var(--muted);stroke-width:1;fill:none }
      #mq-52-02-root .la { stroke:var(--accent);stroke-width:1.4;fill:none }
      #mq-52-02-root .dash { stroke-dasharray:5 4 }</style><marker id="mq-52-02-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52606d"/></marker><marker id="mq-52-02-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1f51c9"/></marker></defs>
