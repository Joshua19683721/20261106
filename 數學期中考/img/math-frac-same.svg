<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="math-frac-same-title math-frac-same-desc" id="math-frac-same-root">
  <title id="math-frac-same-title">同分母分數的加減</title>
  <desc id="math-frac-same-desc">1/5 與 3/5 的分數條。</desc>
  <defs>
      <style>#math-frac-same-root { --paper:#f6f8fc;--paper2:#eef2f8;--ink:#1f2933;--muted:#52606d;--soft:#7b8794;
    --rule:#c3ccd8;--accent:#1f51c9;--accent-tint:rgba(31,81,201,0.08);
    --sans:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
    --serif:'Noto Serif TC','Songti TC',serif; }
      #math-frac-same-root { font-family: var(--sans); color: var(--ink); }
      #math-frac-same-root .diagram-container { width:100%;overflow-x:auto }
      #math-frac-same-root text { font-family:var(--sans) }
      #math-frac-same-root .h { font:400 22px var(--serif);fill:var(--ink) }
      #math-frac-same-root .e { font:500 12px var(--sans);fill:var(--muted) }
      #math-frac-same-root .t { font:600 16px var(--sans);fill:var(--ink) }
      #math-frac-same-root .ts { font:600 15px var(--sans);fill:var(--ink) }
      #math-frac-same-root .s { font:500 13px var(--sans);fill:var(--soft) }
      #math-frac-same-root .sb { font:500 13px var(--sans);fill:var(--ink) }
      #math-frac-same-root .a { font:600 15px var(--sans);fill:var(--accent) }
      #math-frac-same-root .big { font:400 44px var(--serif);fill:var(--ink) }
      #math-frac-same-root .mid { font:400 34px var(--serif);fill:var(--ink) }
      #math-frac-same-root .n { fill:#ffffff;stroke:var(--ink);stroke-width:1 }
      #math-frac-same-root .na { fill:var(--accent-tint);stroke:var(--accent);stroke-width:1.2 }
      #math-frac-same-root .ns { fill:rgba(31,41,51,0.05);stroke:var(--muted);stroke-width:1 }
      #math-frac-same-root .ln { stroke:var(--ink);stroke-width:1.2;fill:none }
      #math-frac-same-root .lm { stroke:var(--muted);stroke-width:1;fill:none }
      #math-frac-same-root .la { stroke:var(--accent);stroke-width:1.4;fill:none }
      #math-frac-same-root .dash { stroke-dasharray:5 4 }</style><marker id="math-frac-same-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52606d"/></marker><marker id="math-frac-same-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1f51c9"/></marker></defs>
  <rect width="100%" height="100%" fill="#f6f8fc"/>
  <text x="32" y="30" class="e">數學・9-3 同分母分數的加減</text>
<text x="32" y="58" class="h">同分母分數的加減</text>
  <rect x="110" y="130" width="300" height="54" rx="4" class="n"/>
<line x1="170" y1="130" x2="170" y2="184" class="lm"/>
<line x1="230" y1="130" x2="230" y2="184" class="lm"/>
<line x1="290" y1="130" x2="290" y2="184" class="lm"/>
<line x1="350" y1="130" x2="350" y2="184" class="lm"/>
<rect x="111" y="131" width="57" height="51" rx="3" class="na"/>
<text x="260" y="214" class="sb" text-anchor="middle">1/5</text>
<rect x="110" y="220" width="300" height="54" rx="4" class="n"/>
<line x1="170" y1="220" x2="170" y2="274" class="lm"/>
<line x1="230" y1="220" x2="230" y2="274" class="lm"/>
<line x1="290" y1="220" x2="290" y2="274" class="lm"/>
<line x1="350" y1="220" x2="350" y2="274" class="lm"/>
<rect x="111" y="221" width="57" height="51" rx="3" class="na"/>
<rect x="171" y="221" width="57" height="51" rx="3" class="na"/>
<rect x="231" y="221" width="57" height="51" rx="3" class="na"/>
<text x="260" y="304" class="sb" text-anchor="middle">3/5</text>
<text x="430" y="160" class="s" text-anchor="start">同分母</text>
<text x="430" y="250" class="s" text-anchor="start">分母不變</text>
<text x="60" y="320" class="sb" text-anchor="start">分母相同時，分子愈大，分數就愈大。</text>
</svg>
