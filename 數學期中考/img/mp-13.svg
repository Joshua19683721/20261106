<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mp-13-title mp-13-desc" id="mp-13-root">
  <title id="mp-13-title">素養題組・小數</title>
  <desc id="mp-13-desc">超市商品的容量：\n牛奶 1.35 公升，果汁 0.75 公升，\n沙拉油 2.</desc>
  <defs>
      <style>#mp-13-root { --paper:#f6f8fc;--paper2:#eef2f8;--ink:#1f2933;--muted:#52606d;--soft:#7b8794;
    --rule:#c3ccd8;--accent:#1f51c9;--accent-tint:rgba(31,81,201,0.08);
    --sans:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
    --serif:'Noto Serif TC','Songti TC',serif; }
      #mp-13-root { font-family: var(--sans); color: var(--ink); }
      #mp-13-root .diagram-container { width:100%;overflow-x:auto }
      #mp-13-root text { font-family:var(--sans) }
      #mp-13-root .h { font:400 22px var(--serif);fill:var(--ink) }
      #mp-13-root .e { font:500 12px var(--sans);fill:var(--muted) }
      #mp-13-root .t { font:600 16px var(--sans);fill:var(--ink) }
      #mp-13-root .ts { font:600 15px var(--sans);fill:var(--ink) }
      #mp-13-root .s { font:500 13px var(--sans);fill:var(--soft) }
      #mp-13-root .sb { font:500 13px var(--sans);fill:var(--ink) }
      #mp-13-root .a { font:600 15px var(--sans);fill:var(--accent) }
      #mp-13-root .big { font:400 44px var(--serif);fill:var(--ink) }
      #mp-13-root .mid { font:400 34px var(--serif);fill:var(--ink) }
      #mp-13-root .n { fill:#ffffff;stroke:var(--ink);stroke-width:1 }
      #mp-13-root .na { fill:var(--accent-tint);stroke:var(--accent);stroke-width:1.2 }
      #mp-13-root .ns { fill:rgba(31,41,51,0.05);stroke:var(--muted);stroke-width:1 }
      #mp-13-root .ln { stroke:var(--ink);stroke-width:1.2;fill:none }
      #mp-13-root .lm { stroke:var(--muted);stroke-width:1;fill:none }
      #mp-13-root .la { stroke:var(--accent);stroke-width:1.4;fill:none }
      #mp-13-root .dash { stroke-dasharray:5 4 }</style><marker id="mp-13-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52606d"/></marker><marker id="mp-13-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1f51c9"/></marker></defs>
  <rect width="100%" height="100%" fill="#f6f8fc"/>
  <text x="32" y="30" class="e">素養題組・小數</text>
<text x="32" y="58" class="h">素養題組・小數</text>
  <text x="60" y="120" class="ts" text-anchor="start">短文裡的數據</text>
<rect x="60" y="140" width="168" height="64" rx="6" class="n"/>
<text x="72" y="166" class="s" text-anchor="start">牛奶 </text>
<text x="72" y="192" class="a" text-anchor="start">1.35 公升</text>
<rect x="244" y="140" width="168" height="64" rx="6" class="n"/>
<text x="256" y="166" class="s" text-anchor="start">果汁 </text>
<text x="256" y="192" class="a" text-anchor="start">0.75 公升</text>
<rect x="428" y="140" width="168" height="64" rx="6" class="n"/>
<text x="440" y="166" class="s" text-anchor="start">沙拉油 </text>
<text x="440" y="192" class="a" text-anchor="start">2.5 公升</text>
<rect x="60" y="216" width="168" height="64" rx="6" class="n"/>
<text x="72" y="242" class="s" text-anchor="start">醬油 </text>
<text x="72" y="268" class="a" text-anchor="start">0.6 公升</text>
<text x="60" y="350" class="sb" text-anchor="start">把短文的數字和題目對起來，計算就會更清楚。</text>
</svg>
