<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="math-story-chart-title math-story-chart-desc" id="math-story-chart-root">
  <title id="math-story-chart-title">情境：統計圖怎麼看</title>
  <desc id="math-story-chart-desc">長條圖與折線圖的說明卡。</desc>
  <defs>
      <style>#math-story-chart-root { --paper:#f6f8fc;--paper2:#eef2f8;--ink:#1f2933;--muted:#52606d;--soft:#7b8794;
    --rule:#c3ccd8;--accent:#1f51c9;--accent-tint:rgba(31,81,201,0.08);
    --sans:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
    --serif:'Noto Serif TC','Songti TC',serif; }
      #math-story-chart-root { font-family: var(--sans); color: var(--ink); }
      #math-story-chart-root .diagram-container { width:100%;overflow-x:auto }
      #math-story-chart-root text { font-family:var(--sans) }
      #math-story-chart-root .h { font:400 22px var(--serif);fill:var(--ink) }
      #math-story-chart-root .e { font:500 12px var(--sans);fill:var(--muted) }
      #math-story-chart-root .t { font:600 16px var(--sans);fill:var(--ink) }
      #math-story-chart-root .ts { font:600 15px var(--sans);fill:var(--ink) }
      #math-story-chart-root .s { font:500 13px var(--sans);fill:var(--soft) }
      #math-story-chart-root .sb { font:500 13px var(--sans);fill:var(--ink) }
      #math-story-chart-root .a { font:600 15px var(--sans);fill:var(--accent) }
      #math-story-chart-root .big { font:400 44px var(--serif);fill:var(--ink) }
      #math-story-chart-root .mid { font:400 34px var(--serif);fill:var(--ink) }
      #math-story-chart-root .n { fill:#ffffff;stroke:var(--ink);stroke-width:1 }
      #math-story-chart-root .na { fill:var(--accent-tint);stroke:var(--accent);stroke-width:1.2 }
      #math-story-chart-root .ns { fill:rgba(31,41,51,0.05);stroke:var(--muted);stroke-width:1 }
      #math-story-chart-root .ln { stroke:var(--ink);stroke-width:1.2;fill:none }
      #math-story-chart-root .lm { stroke:var(--muted);stroke-width:1;fill:none }
      #math-story-chart-root .la { stroke:var(--accent);stroke-width:1.4;fill:none }
      #math-story-chart-root .dash { stroke-dasharray:5 4 }</style><marker id="math-story-chart-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52606d"/></marker><marker id="math-story-chart-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1f51c9"/></marker></defs>
  <rect width="100%" height="100%" fill="#f6f8fc"/>
  <text x="32" y="30" class="e">數學・統整應用</text>
<text x="32" y="58" class="h">情境：統計圖怎麼看</text>
  <line x1="100" y1="250" x2="100" y2="80" class="ln"/>
<line x1="100" y1="250" x2="560" y2="250" class="ln"/>
<line x1="100" y1="250" x2="560" y2="250" class="lm dash"/>
<text x="88" y="255" class="s" text-anchor="end">0</text>
<line x1="100" y1="207" x2="560" y2="207" class="lm dash"/>
<text x="88" y="212" class="s" text-anchor="end">4</text>
<line x1="100" y1="165" x2="560" y2="165" class="lm dash"/>
<text x="88" y="170" class="s" text-anchor="end">8</text>
<line x1="100" y1="122" x2="560" y2="122" class="lm dash"/>
<text x="88" y="127" class="s" text-anchor="end">12</text>
<line x1="100" y1="80" x2="560" y2="80" class="lm dash"/>
<text x="88" y="85" class="s" text-anchor="end">16</text>
<rect x="140" y="122" width="22" height="127" rx="6" class="n"/>
<rect x="140" y="122" width="22" height="127" rx="6" class="na"/>
<text x="151" y="276" class="ts" text-anchor="middle">甲</text>
<rect x="190" y="165" width="22" height="85" rx="6" class="n"/>
<rect x="190" y="165" width="22" height="85" rx="6" class="na"/>
<text x="201" y="276" class="ts" text-anchor="middle">乙</text>
<rect x="240" y="186" width="22" height="63" rx="6" class="n"/>
<rect x="240" y="186" width="22" height="63" rx="6" class="na"/>
<text x="251" y="276" class="ts" text-anchor="middle">丙</text>
<text x="60" y="72" class="s" text-anchor="end">人</text>
<text x="240" y="136" class="ts" text-anchor="start">圖表要看懂</text>
<text x="240" y="170" class="s" text-anchor="start">長條圖：比較多寡</text>
<text x="240" y="196" class="s" text-anchor="start">折線圖：看出變化</text>
<text x="380" y="160" class="ts" text-anchor="start">長條圖</text>
<text x="380" y="186" class="s" text-anchor="start">一根一根比較</text>
<text x="380" y="224" class="ts" text-anchor="start">折線圖</text>
<text x="380" y="250" class="s" text-anchor="start">連起來看變化</text>
<text x="60" y="350" class="sb" text-anchor="start">先看圖表的名稱與標題，再看數值。</text>
</svg>
