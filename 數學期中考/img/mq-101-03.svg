<rect x="260" y="175" width="22" height="125" rx="6" class="n"/>
<rect x="260" y="175" width="22" height="125" rx="6" class="na"/>
<text x="271" y="326" class="ts" text-anchor="middle">乙</text>
<rect x="340" y="237" width="22" height="62" rx="6" class="n"/>
<rect x="340" y="237" width="22" height="62" rx="6" class="na"/>
<text x="351" y="326" class="ts" text-anchor="middle">丙</text>
<text x="100" y="42" class="s" text-anchor="end">數量</text>
<text x="120" y="130" class="s" text-anchor="start">縱軸：數量多少</text>
<text x="120" y="150" class="s" text-anchor="start">橫軸：項目名稱</text>
<text x="60" y="350" class="sb" text-anchor="start">看長條圖，先看清楚標題和每一格代表多少。</text>
