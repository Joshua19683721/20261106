<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mq-mix-17-title mq-mix-17-desc" id="mq-mix-17-root">
  <title id="mq-mix-17-title">統整應用</title>
  <desc id="mq-mix-17-desc">一週借書量：週一 20 本、週二 30 本、週三 25 本、週四 35 本，四天</desc>
  <defs>
      <style>#mq-mix-17-root { --paper:#f6f8fc;--paper2:#eef2f8;--ink:#1f2933;--muted:#52606d;--soft:#7b8794;
    --rule:#c3ccd8;--accent:#1f51c9;--accent-tint:rgba(31,81,201,0.08);
    --sans:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
    --serif:'Noto Serif TC','Songti TC',serif; }
      #mq-mix-17-root { font-family: var(--sans); color: var(--ink); }
      #mq-mix-17-root .diagram-container { width:100%;overflow-x:auto }
      #mq-mix-17-root text { font-family:var(--sans) }
      #mq-mix-17-root .h { font:400 22px var(--serif);fill:var(--ink) }
      #mq-mix-17-root .e { font:500 12px var(--sans);fill:var(--muted) }
      #mq-mix-17-root .t { font:600 16px var(--sans);fill:var(--ink) }
      #mq-mix-17-root .ts { font:600 15px var(--sans);fill:var(--ink) }
      #mq-mix-17-root .s { font:500 13px var(--sans);fill:var(--soft) }
      #mq-mix-17-root .sb { font:500 13px var(--sans);fill:var(--ink) }
      #mq-mix-17-root .a { font:600 15px var(--sans);fill:var(--accent) }
      #mq-mix-17-root .big { font:400 44px var(--serif);fill:var(--ink) }
      #mq-mix-17-root .mid { font:400 34px var(--serif);fill:var(--ink) }
      #mq-mix-17-root .n { fill:#ffffff;stroke:var(--ink);stroke-width:1 }
      #mq-mix-17-root .na { fill:var(--accent-tint);stroke:var(--accent);stroke-width:1.2 }
      #mq-mix-17-root .ns { fill:rgba(31,41,51,0.05);stroke:var(--muted);stroke-width:1 }
      #mq-mix-17-root .ln { stroke:var(--ink);stroke-width:1.2;fill:none }
      #mq-mix-17-root .lm { stroke:var(--muted);stroke-width:1;fill:none }
      #mq-mix-17-root .la { stroke:var(--accent);stroke-width:1.4;fill:none }
      #mq-mix-17-root .dash { stroke-dasharray:5 4 }</style><marker id="mq-mix-17-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52606d"/></marker><marker id="mq-mix-17-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1f51c9"/></marker></defs>
  <rect width="100%" height="100%" fill="#f6f8fc"/>
  <text x="32" y="30" class="e">統整應用 統整應用</text>
<text x="32" y="58" class="h">統整應用</text>
  <text x="60" y="120" class="ts" text-anchor="start">一週借書折線圖</text>
<line x1="140" y1="300" x2="140" y2="60" class="ln"/>
<line x1="140" y1="300" x2="560" y2="300" class="ln"/>
<line x1="180" y1="180" x2="300" y2="120" class="la" stroke-width="2.4"/>
<line x1="300" y1="120" x2="420" y2="150" class="la" stroke-width="2.4"/>
<line x1="420" y1="150" x2="540" y2="90" class="la" stroke-width="2.4"/>
<circle cx="180" cy="180" r="7" class="na" fill="#ffffff"/>
<text x="180" y="326" class="s" text-anchor="middle">一</text>
<circle cx="300" cy="120" r="7" class="na" fill="#ffffff"/>
<text x="300" y="326" class="s" text-anchor="middle">二</text>
<circle cx="420" cy="150" r="7" class="na" fill="#ffffff"/>
<text x="420" y="326" class="s" text-anchor="middle">三</text>
<circle cx="540" cy="90" r="7" class="na" fill="#ffffff"/>
<text x="540" y="326" class="s" text-anchor="middle">四</text>
<text x="128" y="52" class="s" text-anchor="end">本</text>
<text x="60" y="340" class="sb" text-anchor="start">題目裡的數字，都可以在圖上找到。</text>
</svg>
