<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="math-story-angle-title math-story-angle-desc" id="math-story-angle-root">
  <title id="math-story-angle-title">情境：角與角的比較</title>
  <desc id="math-story-angle-desc">量角器與兩個角的說明卡。</desc>
  <defs>
      <style>#math-story-angle-root { --paper:#f6f8fc;--paper2:#eef2f8;--ink:#1f2933;--muted:#52606d;--soft:#7b8794;
    --rule:#c3ccd8;--accent:#1f51c9;--accent-tint:rgba(31,81,201,0.08);
    --sans:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
    --serif:'Noto Serif TC','Songti TC',serif; }
      #math-story-angle-root { font-family: var(--sans); color: var(--ink); }
      #math-story-angle-root .diagram-container { width:100%;overflow-x:auto }
      #math-story-angle-root text { font-family:var(--sans) }
      #math-story-angle-root .h { font:400 22px var(--serif);fill:var(--ink) }
      #math-story-angle-root .e { font:500 12px var(--sans);fill:var(--muted) }
      #math-story-angle-root .t { font:600 16px var(--sans);fill:var(--ink) }
      #math-story-angle-root .ts { font:600 15px var(--sans);fill:var(--ink) }
      #math-story-angle-root .s { font:500 13px var(--sans);fill:var(--soft) }
      #math-story-angle-root .sb { font:500 13px var(--sans);fill:var(--ink) }
      #math-story-angle-root .a { font:600 15px var(--sans);fill:var(--accent) }
      #math-story-angle-root .big { font:400 44px var(--serif);fill:var(--ink) }
      #math-story-angle-root .mid { font:400 34px var(--serif);fill:var(--ink) }
      #math-story-angle-root .n { fill:#ffffff;stroke:var(--ink);stroke-width:1 }
      #math-story-angle-root .na { fill:var(--accent-tint);stroke:var(--accent);stroke-width:1.2 }
      #math-story-angle-root .ns { fill:rgba(31,41,51,0.05);stroke:var(--muted);stroke-width:1 }
      #math-story-angle-root .ln { stroke:var(--ink);stroke-width:1.2;fill:none }
      #math-story-angle-root .lm { stroke:var(--muted);stroke-width:1;fill:none }
      #math-story-angle-root .la { stroke:var(--accent);stroke-width:1.4;fill:none }
      #math-story-angle-root .dash { stroke-dasharray:5 4 }</style><marker id="math-story-angle-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52606d"/></marker><marker id="math-story-angle-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1f51c9"/></marker></defs>
  <rect width="100%" height="100%" fill="#f6f8fc"/>
  <text x="32" y="30" class="e">數學・統整應用</text>
<text x="32" y="58" class="h">情境：角與角的比較</text>
  <path d="M 70 200 A 90 90 0 0 1 250 200" class="lm"/>
<text x="240" y="136" class="ts" text-anchor="start">兩個角合起來</text>
<text x="240" y="170" class="s" text-anchor="start">一個角 35 度</text>
<text x="240" y="196" class="s" text-anchor="start">另一個角比它大 40 度</text>
<text x="60" y="330" class="sb" text-anchor="start">先求出另一個角，再把兩個角加起来。</text>
</svg>
