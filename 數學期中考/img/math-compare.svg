<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="math-compare-title math-compare-desc" id="math-compare-root">
  <title id="math-compare-title">比較兩個數的大小</title>
  <desc id="math-compare-desc">兩張數字卡與中間的比較符號框。</desc>
  <defs>
      <style>#math-compare-root { --paper:#f6f8fc;--paper2:#eef2f8;--ink:#1f2933;--muted:#52606d;--soft:#7b8794;
    --rule:#c3ccd8;--accent:#1f51c9;--accent-tint:rgba(31,81,201,0.08);
    --sans:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
    --serif:'Noto Serif TC','Songti TC',serif; }
      #math-compare-root { font-family: var(--sans); color: var(--ink); }
      #math-compare-root .diagram-container { width:100%;overflow-x:auto }
      #math-compare-root text { font-family:var(--sans) }
      #math-compare-root .h { font:400 22px var(--serif);fill:var(--ink) }
      #math-compare-root .e { font:500 12px var(--sans);fill:var(--muted) }
      #math-compare-root .t { font:600 16px var(--sans);fill:var(--ink) }
      #math-compare-root .ts { font:600 15px var(--sans);fill:var(--ink) }
      #math-compare-root .s { font:500 13px var(--sans);fill:var(--soft) }
      #math-compare-root .sb { font:500 13px var(--sans);fill:var(--ink) }
      #math-compare-root .a { font:600 15px var(--sans);fill:var(--accent) }
      #math-compare-root .big { font:400 44px var(--serif);fill:var(--ink) }
      #math-compare-root .mid { font:400 34px var(--serif);fill:var(--ink) }
      #math-compare-root .n { fill:#ffffff;stroke:var(--ink);stroke-width:1 }
      #math-compare-root .na { fill:var(--accent-tint);stroke:var(--accent);stroke-width:1.2 }
      #math-compare-root .ns { fill:rgba(31,41,51,0.05);stroke:var(--muted);stroke-width:1 }
      #math-compare-root .ln { stroke:var(--ink);stroke-width:1.2;fill:none }
      #math-compare-root .lm { stroke:var(--muted);stroke-width:1;fill:none }
      #math-compare-root .la { stroke:var(--accent);stroke-width:1.4;fill:none }
      #math-compare-root .dash { stroke-dasharray:5 4 }</style><marker id="math-compare-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52606d"/></marker><marker id="math-compare-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1f51c9"/></marker></defs>
  <rect width="100%" height="100%" fill="#f6f8fc"/>
  <text x="32" y="30" class="e">數學・1-3 比較大小</text>
<text x="32" y="58" class="h">比較兩個數的大小</text>
  <rect x="110" y="150" width="150" height="90" rx="6" class="n"/>
<text x="185" y="208" class="ts" text-anchor="middle">7654321</text>
<rect x="370" y="150" width="150" height="90" rx="6" class="n"/>
<text x="445" y="208" class="ts" text-anchor="middle">['<rect x="110" y="150" width="150" height="90" rx="6" class="n"/>', '<text x="185" y="208" class="ts" text-anchor="middle">7654321</text>', '<rect x="370" y="150" width="150" height="90" rx="6" class="n"/>']</text>
<rect x="290" y="170" width="60" height="50" rx="6" class="n"/>
<text x="320" y="204" class="a" text-anchor="middle">?</text>
<text x="60" y="320" class="sb" text-anchor="start">先比位數，再從最高位一位一位比下去。</text>
</svg>
