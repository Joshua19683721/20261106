<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mq-101-04-title mq-101-04-desc" id="mq-101-04-root">
  <title id="mq-101-04-title">報讀生活中的統計圖</title>
  <desc id="mq-101-04-desc">一張長條圖的縱軸每一格代表 5 人，某項目的長條高 4 格，表示多少人？</desc>
  <defs>
      <style>#mq-101-04-root { --paper:#f6f8fc;--paper2:#eef2f8;--ink:#1f2933;--muted:#52606d;--soft:#7b8794;
    --rule:#c3ccd8;--accent:#1f51c9;--accent-tint:rgba(31,81,201,0.08);
    --sans:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
    --serif:'Noto Serif TC','Songti TC',serif; }
      #mq-101-04-root { font-family: var(--sans); color: var(--ink); }
      #mq-101-04-root .diagram-container { width:100%;overflow-x:auto }
      #mq-101-04-root text { font-family:var(--sans) }
      #mq-101-04-root .h { font:400 22px var(--serif);fill:var(--ink) }
      #mq-101-04-root .e { font:500 12px var(--sans);fill:var(--muted) }
      #mq-101-04-root .t { font:600 16px var(--sans);fill:var(--ink) }
      #mq-101-04-root .ts { font:600 15px var(--sans);fill:var(--ink) }
      #mq-101-04-root .s { font:500 13px var(--sans);fill:var(--soft) }
      #mq-101-04-root .sb { font:500 13px var(--sans);fill:var(--ink) }
      #mq-101-04-root .a { font:600 15px var(--sans);fill:var(--accent) }
      #mq-101-04-root .big { font:400 44px var(--serif);fill:var(--ink) }
      #mq-101-04-root .mid { font:400 34px var(--serif);fill:var(--ink) }
      #mq-101-04-root .n { fill:#ffffff;stroke:var(--ink);stroke-width:1 }
      #mq-101-04-root .na { fill:var(--accent-tint);stroke:var(--accent);stroke-width:1.2 }
      #mq-101-04-root .ns { fill:rgba(31,41,51,0.05);stroke:var(--muted);stroke-width:1 }
      #mq-101-04-root .ln { stroke:var(--ink);stroke-width:1.2;fill:none }
      #mq-101-04-root .lm { stroke:var(--muted);stroke-width:1;fill:none }
      #mq-101-04-root .la { stroke:var(--accent);stroke-width:1.4;fill:none }
      #mq-101-04-root .dash { stroke-dasharray:5 4 }</style><marker id="mq-101-04-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52606d"/></marker><marker id="mq-101-04-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1f51c9"/></marker></defs>
  <rect width="100%" height="100%" fill="#f6f8fc"/>
  <text x="32" y="30" class="e">10-1 報讀生活中的統計圖</text>
<text x="32" y="58" class="h">報讀生活中的統計圖</text>
  <line x1="140" y1="300" x2="140" y2="50" class="ln"/>
<line x1="140" y1="300" x2="560" y2="300" class="ln"/>
<line x1="140" y1="300" x2="560" y2="300" class="lm dash"/>
<text x="128" y="305" class="s" text-anchor="end">0</text>
<line x1="140" y1="250" x2="560" y2="250" class="lm dash"/>
<text x="128" y="255" class="s" text-anchor="end">5</text>
<line x1="140" y1="200" x2="560" y2="200" class="lm dash"/>
<text x="128" y="205" class="s" text-anchor="end">10</text>
<line x1="140" y1="150" x2="560" y2="150" class="lm dash"/>
<text x="128" y="155" class="s" text-anchor="end">15</text>
<line x1="140" y1="100" x2="560" y2="100" class="lm dash"/>
<text x="128" y="105" class="s" text-anchor="end">20</text>
<line x1="140" y1="50" x2="560" y2="50" class="lm dash"/>
<text x="128" y="55" class="s" text-anchor="end">25</text>
<rect x="180" y="100" width="22" height="200" rx="6" class="n"/>
<rect x="180" y="100" width="22" height="200" rx="6" class="na"/>
<text x="191" y="326" class="ts" text-anchor="middle">某一項</text>
<text x="100" y="42" class="s" text-anchor="end">人</text>
<text x="60" y="350" class="sb" text-anchor="start">縱軸每一格代表 5 人，數一數有幾格。</text>
