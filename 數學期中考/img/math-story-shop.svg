<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="math-story-shop-title math-story-shop-desc" id="math-story-shop-root">
  <title id="math-story-shop-title">情境：買東西要算總價</title>
  <desc id="math-story-shop-desc">一台平板電腦與 8 個相同價格的示意。</desc>
  <defs>
      <style>#math-story-shop-root { --paper:#f6f8fc;--paper2:#eef2f8;--ink:#1f2933;--muted:#52606d;--soft:#7b8794;
    --rule:#c3ccd8;--accent:#1f51c9;--accent-tint:rgba(31,81,201,0.08);
    --sans:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
    --serif:'Noto Serif TC','Songti TC',serif; }
      #math-story-shop-root { font-family: var(--sans); color: var(--ink); }
      #math-story-shop-root .diagram-container { width:100%;overflow-x:auto }
      #math-story-shop-root text { font-family:var(--sans) }
      #math-story-shop-root .h { font:400 22px var(--serif);fill:var(--ink) }
      #math-story-shop-root .e { font:500 12px var(--sans);fill:var(--muted) }
      #math-story-shop-root .t { font:600 16px var(--sans);fill:var(--ink) }
      #math-story-shop-root .ts { font:600 15px var(--sans);fill:var(--ink) }
      #math-story-shop-root .s { font:500 13px var(--sans);fill:var(--soft) }
      #math-story-shop-root .sb { font:500 13px var(--sans);fill:var(--ink) }
      #math-story-shop-root .a { font:600 15px var(--sans);fill:var(--accent) }
      #math-story-shop-root .big { font:400 44px var(--serif);fill:var(--ink) }
      #math-story-shop-root .mid { font:400 34px var(--serif);fill:var(--ink) }
      #math-story-shop-root .n { fill:#ffffff;stroke:var(--ink);stroke-width:1 }
      #math-story-shop-root .na { fill:var(--accent-tint);stroke:var(--accent);stroke-width:1.2 }
      #math-story-shop-root .ns { fill:rgba(31,41,51,0.05);stroke:var(--muted);stroke-width:1 }
      #math-story-shop-root .ln { stroke:var(--ink);stroke-width:1.2;fill:none }
      #math-story-shop-root .lm { stroke:var(--muted);stroke-width:1;fill:none }
      #math-story-shop-root .la { stroke:var(--accent);stroke-width:1.4;fill:none }
      #math-story-shop-root .dash { stroke-dasharray:5 4 }</style><marker id="math-story-shop-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52606d"/></marker><marker id="math-story-shop-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1f51c9"/></marker></defs>
  <rect width="100%" height="100%" fill="#f6f8fc"/>
  <text x="32" y="30" class="e">數學・統整應用</text>
<text x="32" y="58" class="h">情境：買東西要算總價</text>
  <rect x="90" y="120" width="70" height="90" rx="6" class="n"/>
<text x="125" y="172" class="ts" text-anchor="middle">電</text>
<text x="240" y="136" class="ts" text-anchor="start">買 8 臺平板電腦</text>
<text x="240" y="170" class="s" text-anchor="start">每臺 3,250 元</text>
<text x="240" y="196" class="s" text-anchor="start">8 個 3,250 相加</text>
<text x="60" y="320" class="sb" text-anchor="start">同樣的價錢乘上件數，就是總共的錢。</text>
</svg>
