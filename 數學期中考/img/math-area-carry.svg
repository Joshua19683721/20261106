<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="math-area-carry-title math-area-carry-desc" id="math-area-carry-root">
  <title id="math-area-carry-title">進位乘法的面積模型</title>
  <desc id="math-area-carry-desc">246 乘 57 的拆位面積模型。</desc>
  <defs>
      <style>#math-area-carry-root { --paper:#f6f8fc;--paper2:#eef2f8;--ink:#1f2933;--muted:#52606d;--soft:#7b8794;
    --rule:#c3ccd8;--accent:#1f51c9;--accent-tint:rgba(31,81,201,0.08);
    --sans:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
    --serif:'Noto Serif TC','Songti TC',serif; }
      #math-area-carry-root { font-family: var(--sans); color: var(--ink); }
      #math-area-carry-root .diagram-container { width:100%;overflow-x:auto }
      #math-area-carry-root text { font-family:var(--sans) }
      #math-area-carry-root .h { font:400 22px var(--serif);fill:var(--ink) }
      #math-area-carry-root .e { font:500 12px var(--sans);fill:var(--muted) }
      #math-area-carry-root .t { font:600 16px var(--sans);fill:var(--ink) }
      #math-area-carry-root .ts { font:600 15px var(--sans);fill:var(--ink) }
      #math-area-carry-root .s { font:500 13px var(--sans);fill:var(--soft) }
      #math-area-carry-root .sb { font:500 13px var(--sans);fill:var(--ink) }
      #math-area-carry-root .a { font:600 15px var(--sans);fill:var(--accent) }
      #math-area-carry-root .big { font:400 44px var(--serif);fill:var(--ink) }
      #math-area-carry-root .mid { font:400 34px var(--serif);fill:var(--ink) }
      #math-area-carry-root .n { fill:#ffffff;stroke:var(--ink);stroke-width:1 }
      #math-area-carry-root .na { fill:var(--accent-tint);stroke:var(--accent);stroke-width:1.2 }
      #math-area-carry-root .ns { fill:rgba(31,41,51,0.05);stroke:var(--muted);stroke-width:1 }
      #math-area-carry-root .ln { stroke:var(--ink);stroke-width:1.2;fill:none }
      #math-area-carry-root .lm { stroke:var(--muted);stroke-width:1;fill:none }
      #math-area-carry-root .la { stroke:var(--accent);stroke-width:1.4;fill:none }
      #math-area-carry-root .dash { stroke-dasharray:5 4 }</style><marker id="math-area-carry-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52606d"/></marker><marker id="math-area-carry-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1f51c9"/></marker></defs>
  <rect width="100%" height="100%" fill="#f6f8fc"/>
  <text x="32" y="30" class="e">數學・2-3 三位數乘兩位數（進位）</text>
<text x="32" y="58" class="h">進位乘法的面積模型</text>
  <rect x="150" y="140" width="23" height="23" rx="2" class="ns"/>
