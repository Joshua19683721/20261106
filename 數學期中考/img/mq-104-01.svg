<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mq-104-01-title mq-104-01-desc" id="mq-104-01-root">
  <title id="mq-104-01-title">報讀複雜的統計圖</title>
  <desc id="mq-104-01-desc">把兩組資料疊在同一根長條上，可以看合計的長條圖叫做什麼？</desc>
  <defs>
      <style>#mq-104-01-root { --paper:#f6f8fc;--paper2:#eef2f8;--ink:#1f2933;--muted:#52606d;--soft:#7b8794;
    --rule:#c3ccd8;--accent:#1f51c9;--accent-tint:rgba(31,81,201,0.08);
    --sans:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
    --serif:'Noto Serif TC','Songti TC',serif; }
      #mq-104-01-root { font-family: var(--sans); color: var(--ink); }
      #mq-104-01-root .diagram-container { width:100%;overflow-x:auto }
      #mq-104-01-root text { font-family:var(--sans) }
      #mq-104-01-root .h { font:400 22px var(--serif);fill:var(--ink) }
      #mq-104-01-root .e { font:500 12px var(--sans);fill:var(--muted) }
      #mq-104-01-root .t { font:600 16px var(--sans);fill:var(--ink) }
      #mq-104-01-root .ts { font:600 15px var(--sans);fill:var(--ink) }
      #mq-104-01-root .s { font:500 13px var(--sans);fill:var(--soft) }
      #mq-104-01-root .sb { font:500 13px var(--sans);fill:var(--ink) }
      #mq-104-01-root .a { font:600 15px var(--sans);fill:var(--accent) }
      #mq-104-01-root .big { font:400 44px var(--serif);fill:var(--ink) }
      #mq-104-01-root .mid { font:400 34px var(--serif);fill:var(--ink) }
      #mq-104-01-root .n { fill:#ffffff;stroke:var(--ink);stroke-width:1 }
      #mq-104-01-root .na { fill:var(--accent-tint);stroke:var(--accent);stroke-width:1.2 }
      #mq-104-01-root .ns { fill:rgba(31,41,51,0.05);stroke:var(--muted);stroke-width:1 }
      #mq-104-01-root .ln { stroke:var(--ink);stroke-width:1.2;fill:none }
      #mq-104-01-root .lm { stroke:var(--muted);stroke-width:1;fill:none }
      #mq-104-01-root .la { stroke:var(--accent);stroke-width:1.4;fill:none }
      #mq-104-01-root .dash { stroke-dasharray:5 4 }</style><marker id="mq-104-01-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52606d"/></marker><marker id="mq-104-01-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1f51c9"/></marker></defs>
  <rect width="100%" height="100%" fill="#f6f8fc"/>
  <text x="32" y="30" class="e">10-4 報讀複雜的統計圖</text>
<text x="32" y="58" class="h">報讀複雜的統計圖</text>
  <text x="90" y="140" class="ts" text-anchor="start">雙長條圖</text>
<rect x="90" y="165" width="60" height="110" rx="6" class="n"/>
<rect x="165" y="165" width="60" height="80" rx="6" class="na"/>
<text x="90" y="300" class="s" text-anchor="middle">甲組</text>
<text x="165" y="300" class="s" text-anchor="middle">乙組</text>
<text x="280" y="160" class="ts" text-anchor="start">堆疊長條圖</text>
<rect x="280" y="200" width="60" height="70" rx="6" class="n"/>
<rect x="280" y="165" width="60" height="35" rx="6" class="na"/>
<text x="310" y="300" class="s" text-anchor="middle">上層／下層</text>
<text x="60" y="340" class="sb" text-anchor="start">並排的是雙長條，疊起來的是堆疊長條。</text>
</svg>
