  <title id="mq-31-02-title">量角器的認識與報讀</title>
  <desc id="mq-31-02-desc">常用量角器上，每一小格代表幾度？</desc>
  <defs>
      <style>#mq-31-02-root { --paper:#f6f8fc;--paper2:#eef2f8;--ink:#1f2933;--muted:#52606d;--soft:#7b8794;
