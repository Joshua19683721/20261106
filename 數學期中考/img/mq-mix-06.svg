<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mq-mix-06-title mq-mix-06-desc" id="mq-mix-06-root">
  <title id="mq-mix-06-title">統整應用</title>
  <desc id="mq-mix-06-desc">一個角是 35 度，另一個角比它大 40 度，兩個角合起來是幾度？</desc>
  <defs>
      <style>#mq-mix-06-root { --paper:#f6f8fc;--paper2:#eef2f8;--ink:#1f2933;--muted:#52606d;--soft:#7b8794;
    --rule:#c3ccd8;--accent:#1f51c9;--accent-tint:rgba(31,81,201,0.08);
    --sans:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
    --serif:'Noto Serif TC','Songti TC',serif; }
      #mq-mix-06-root { font-family: var(--sans); color: var(--ink); }
      #mq-mix-06-root .diagram-container { width:100%;overflow-x:auto }
      #mq-mix-06-root text { font-family:var(--sans) }
      #mq-mix-06-root .h { font:400 22px var(--serif);fill:var(--ink) }
      #mq-mix-06-root .e { font:500 12px var(--sans);fill:var(--muted) }
      #mq-mix-06-root .t { font:600 16px var(--sans);fill:var(--ink) }
      #mq-mix-06-root .ts { font:600 15px var(--sans);fill:var(--ink) }
      #mq-mix-06-root .s { font:500 13px var(--sans);fill:var(--soft) }
      #mq-mix-06-root .sb { font:500 13px var(--sans);fill:var(--ink) }
      #mq-mix-06-root .a { font:600 15px var(--sans);fill:var(--accent) }
      #mq-mix-06-root .big { font:400 44px var(--serif);fill:var(--ink) }
      #mq-mix-06-root .mid { font:400 34px var(--serif);fill:var(--ink) }
      #mq-mix-06-root .n { fill:#ffffff;stroke:var(--ink);stroke-width:1 }
      #mq-mix-06-root .na { fill:var(--accent-tint);stroke:var(--accent);stroke-width:1.2 }
      #mq-mix-06-root .ns { fill:rgba(31,41,51,0.05);stroke:var(--muted);stroke-width:1 }
      #mq-mix-06-root .ln { stroke:var(--ink);stroke-width:1.2;fill:none }
      #mq-mix-06-root .lm { stroke:var(--muted);stroke-width:1;fill:none }
      #mq-mix-06-root .la { stroke:var(--accent);stroke-width:1.4;fill:none }
      #mq-mix-06-root .dash { stroke-dasharray:5 4 }</style><marker id="mq-mix-06-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52606d"/></marker><marker id="mq-mix-06-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1f51c9"/></marker></defs>
  <rect width="100%" height="100%" fill="#f6f8fc"/>
  <text x="32" y="30" class="e">統整應用 統整應用</text>
<text x="32" y="58" class="h">統整應用</text>
  <text x="60" y="120" class="ts" text-anchor="start">角與角的比較</text>
<path d="M 120 260 L 120 160 L 210 260" class="ln"/>
<text x="160" y="200" class="a" text-anchor="middle">35°</text>
<path d="M 300 260 L 300 120 L 420 260" class="ln"/>
<text x="345" y="200" class="a" text-anchor="middle">？度</text>
<text x="400" y="300" class="s" text-anchor="middle">比 35 度再大 40 度</text>
<text x="60" y="340" class="sb" text-anchor="start">題目裡的數字，都可以在圖上找到。</text>
</svg>
