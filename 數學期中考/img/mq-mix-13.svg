<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mq-mix-13-title mq-mix-13-desc" id="mq-mix-13-root">
  <title id="mq-mix-13-title">統整應用</title>
  <desc id="mq-mix-13-desc">1/6 杯的果汁，5 杯共有多少杯？</desc>
  <defs>
      <style>#mq-mix-13-root { --paper:#f6f8fc;--paper2:#eef2f8;--ink:#1f2933;--muted:#52606d;--soft:#7b8794;
    --rule:#c3ccd8;--accent:#1f51c9;--accent-tint:rgba(31,81,201,0.08);
    --sans:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
    --serif:'Noto Serif TC','Songti TC',serif; }
      #mq-mix-13-root { font-family: var(--sans); color: var(--ink); }
      #mq-mix-13-root .diagram-container { width:100%;overflow-x:auto }
      #mq-mix-13-root text { font-family:var(--sans) }
      #mq-mix-13-root .h { font:400 22px var(--serif);fill:var(--ink) }
      #mq-mix-13-root .e { font:500 12px var(--sans);fill:var(--muted) }
      #mq-mix-13-root .t { font:600 16px var(--sans);fill:var(--ink) }
      #mq-mix-13-root .ts { font:600 15px var(--sans);fill:var(--ink) }
      #mq-mix-13-root .s { font:500 13px var(--sans);fill:var(--soft) }
      #mq-mix-13-root .sb { font:500 13px var(--sans);fill:var(--ink) }
      #mq-mix-13-root .a { font:600 15px var(--sans);fill:var(--accent) }
      #mq-mix-13-root .big { font:400 44px var(--serif);fill:var(--ink) }
      #mq-mix-13-root .mid { font:400 34px var(--serif);fill:var(--ink) }
      #mq-mix-13-root .n { fill:#ffffff;stroke:var(--ink);stroke-width:1 }
      #mq-mix-13-root .na { fill:var(--accent-tint);stroke:var(--accent);stroke-width:1.2 }
      #mq-mix-13-root .ns { fill:rgba(31,41,51,0.05);stroke:var(--muted);stroke-width:1 }
      #mq-mix-13-root .ln { stroke:var(--ink);stroke-width:1.2;fill:none }
      #mq-mix-13-root .lm { stroke:var(--muted);stroke-width:1;fill:none }
      #mq-mix-13-root .la { stroke:var(--accent);stroke-width:1.4;fill:none }
      #mq-mix-13-root .dash { stroke-dasharray:5 4 }</style><marker id="mq-mix-13-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52606d"/></marker><marker id="mq-mix-13-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1f51c9"/></marker></defs>
  <rect width="100%" height="100%" fill="#f6f8fc"/>
  <text x="32" y="30" class="e">統整應用 統整應用</text>
<text x="32" y="58" class="h">統整應用</text>
  <text x="60" y="120" class="ts" text-anchor="start">分數乘整數</text>
<rect x="80" y="150" width="200" height="54" rx="4" class="n"/>
<line x1="113" y1="150" x2="113" y2="204" class="lm"/>
<line x1="146" y1="150" x2="146" y2="204" class="lm"/>
<line x1="180" y1="150" x2="180" y2="204" class="lm"/>
<line x1="213" y1="150" x2="213" y2="204" class="lm"/>
<line x1="246" y1="150" x2="246" y2="204" class="lm"/>
<rect x="81" y="151" width="30" height="51" rx="3" class="na"/>
<text x="180" y="234" class="sb" text-anchor="middle">1/6</text>
<rect x="340" y="150" width="50" height="54" rx="3" class="ns"/>
<rect x="396" y="150" width="50" height="54" rx="3" class="ns"/>
<rect x="452" y="150" width="50" height="54" rx="3" class="ns"/>
<rect x="508" y="150" width="50" height="54" rx="3" class="ns"/>
<rect x="564" y="150" width="50" height="54" rx="3" class="ns"/>
<text x="470" y="224" class="a" text-anchor="middle">× 5</text>
<text x="60" y="340" class="sb" text-anchor="start">題目裡的數字，都可以在圖上找到。</text>
</svg>
