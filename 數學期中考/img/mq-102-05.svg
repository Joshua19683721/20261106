      #mq-102-05-root .a { font:600 15px var(--sans);fill:var(--accent) }
      #mq-102-05-root .big { font:400 44px var(--serif);fill:var(--ink) }
      #mq-102-05-root .mid { font:400 34px var(--serif);fill:var(--ink) }
      #mq-102-05-root .n { fill:#ffffff;stroke:var(--ink);stroke-width:1 }
      #mq-102-05-root .na { fill:var(--accent-tint);stroke:var(--accent);stroke-width:1.2 }
      #mq-102-05-root .ns { fill:rgba(31,41,51,0.05);stroke:var(--muted);stroke-width:1 }
      #mq-102-05-root .ln { stroke:var(--ink);stroke-width:1.2;fill:none }
      #mq-102-05-root .lm { stroke:var(--muted);stroke-width:1;fill:none }
      #mq-102-05-root .la { stroke:var(--accent);stroke-width:1.4;fill:none }
      #mq-102-05-root .dash { stroke-dasharray:5 4 }</style><marker id="mq-102-05-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52606d"/></marker><marker id="mq-102-05-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1f51c9"/></marker></defs>
