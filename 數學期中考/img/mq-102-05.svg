    --sans:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
    --serif:'Noto Serif TC','Songti TC',serif; }
      #mq-102-05-root { font-family: var(--sans); color: var(--ink); }
      #mq-102-05-root .diagram-container { width:100%;overflow-x:auto }
      #mq-102-05-root text { font-family:var(--sans) }
      #mq-102-05-root .h { font:400 22px var(--serif);fill:var(--ink) }
