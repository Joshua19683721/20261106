  <desc id="mq-102-05-desc">圖書角各類書本數：故事書 24 本、科學書 18 本、漫畫書 12 本，故事書比</desc>
  <defs>
      <style>#mq-102-05-root { --paper:#f6f8fc;--paper2:#eef2f8;--ink:#1f2933;--muted:#52606d;--soft:#7b8794;
