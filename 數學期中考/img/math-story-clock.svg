<line x1="320" y1="322" x2="320" y2="334" class="ln"/>
<line x1="269" y1="308" x2="263" y2="318" class="lm"/>
<line x1="231" y1="271" x2="221" y2="277" class="lm"/>
<line x1="218" y1="220" x2="206" y2="220" class="ln"/>
<line x1="231" y1="169" x2="221" y2="163" class="lm"/>
<line x1="268" y1="131" x2="262" y2="121" class="lm"/>
<text x="320" y="141" class="s" text-anchor="middle">12</text>
<text x="404" y="225" class="s" text-anchor="middle">3</text>
<text x="320" y="309" class="s" text-anchor="middle">6</text>
<text x="236" y="225" class="s" text-anchor="middle">9</text>
<line x1="320" y1="220" x2="386" y2="220" class="ln" stroke-width="3"/>
<line x1="320" y1="220" x2="320" y2="124" class="la" stroke-width="2.4"/>
<circle cx="320" cy="220" r="5" class="la" fill="#1f51c9"/>
<text x="60" y="350" class="sb" text-anchor="start">鐘面一大格是 30 度，轉 120 度就是 4 大格。</text>
</svg>
