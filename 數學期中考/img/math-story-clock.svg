<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="math-story-clock-title math-story-clock-desc" id="math-story-clock-root">
  <title id="math-story-clock-title">情境：從 3 點轉 120 度</title>
  <desc id="math-story-clock-desc">指著 3 點的圓形時鐘。</desc>
  <defs>
      <style>#math-story-clock-root { --paper:#f6f8fc;--paper2:#eef2f8;--ink:#1f2933;--muted:#52606d;--soft:#7b8794;
    --rule:#c3ccd8;--accent:#1f51c9;--accent-tint:rgba(31,81,201,0.08);
    --sans:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
    --serif:'Noto Serif TC','Songti TC',serif; }
      #math-story-clock-root { font-family: var(--sans); color: var(--ink); }
      #math-story-clock-root .diagram-container { width:100%;overflow-x:auto }
      #math-story-clock-root text { font-family:var(--sans) }
      #math-story-clock-root .h { font:400 22px var(--serif);fill:var(--ink) }
      #math-story-clock-root .e { font:500 12px var(--sans);fill:var(--muted) }
      #math-story-clock-root .t { font:600 16px var(--sans);fill:var(--ink) }
      #math-story-clock-root .ts { font:600 15px var(--sans);fill:var(--ink) }
      #math-story-clock-root .s { font:500 13px var(--sans);fill:var(--soft) }
      #math-story-clock-root .sb { font:500 13px var(--sans);fill:var(--ink) }
      #math-story-clock-root .a { font:600 15px var(--sans);fill:var(--accent) }
      #math-story-clock-root .big { font:400 44px var(--serif);fill:var(--ink) }
      #math-story-clock-root .mid { font:400 34px var(--serif);fill:var(--ink) }
      #math-story-clock-root .n { fill:#ffffff;stroke:var(--ink);stroke-width:1 }
      #math-story-clock-root .na { fill:var(--accent-tint);stroke:var(--accent);stroke-width:1.2 }
      #math-story-clock-root .ns { fill:rgba(31,41,51,0.05);stroke:var(--muted);stroke-width:1 }
      #math-story-clock-root .ln { stroke:var(--ink);stroke-width:1.2;fill:none }
      #math-story-clock-root .lm { stroke:var(--muted);stroke-width:1;fill:none }
      #math-story-clock-root .la { stroke:var(--accent);stroke-width:1.4;fill:none }
      #math-story-clock-root .dash { stroke-dasharray:5 4 }</style><marker id="math-story-clock-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52606d"/></marker><marker id="math-story-clock-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1f51c9"/></marker></defs>
  <rect width="100%" height="100%" fill="#f6f8fc"/>
  <text x="32" y="30" class="e">數學・統整應用</text>
<text x="32" y="58" class="h">情境：從 3 點轉 120 度</text>
  <circle cx="320" cy="220" r="118" class="n"/>
<line x1="320" y1="118" x2="320" y2="106" class="ln"/>
<line x1="371" y1="131" x2="377" y2="121" class="lm"/>
