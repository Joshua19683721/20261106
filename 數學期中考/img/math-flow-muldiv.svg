<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="math-flow-muldiv-title math-flow-muldiv-desc" id="math-flow-muldiv-root">
  <title id="math-flow-muldiv-title">兩步驟乘除的順序</title>
  <desc id="math-flow-muldiv-desc">兩步驟乘除的運算流程圖。</desc>
  <defs>
      <style>#math-flow-muldiv-root { --paper:#f6f8fc;--paper2:#eef2f8;--ink:#1f2933;--muted:#52606d;--soft:#7b8794;
    --rule:#c3ccd8;--accent:#1f51c9;--accent-tint:rgba(31,81,201,0.08);
    --sans:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
    --serif:'Noto Serif TC','Songti TC',serif; }
      #math-flow-muldiv-root { font-family: var(--sans); color: var(--ink); }
      #math-flow-muldiv-root .diagram-container { width:100%;overflow-x:auto }
      #math-flow-muldiv-root text { font-family:var(--sans) }
      #math-flow-muldiv-root .h { font:400 22px var(--serif);fill:var(--ink) }
      #math-flow-muldiv-root .e { font:500 12px var(--sans);fill:var(--muted) }
      #math-flow-muldiv-root .t { font:600 16px var(--sans);fill:var(--ink) }
      #math-flow-muldiv-root .ts { font:600 15px var(--sans);fill:var(--ink) }
      #math-flow-muldiv-root .s { font:500 13px var(--sans);fill:var(--soft) }
      #math-flow-muldiv-root .sb { font:500 13px var(--sans);fill:var(--ink) }
      #math-flow-muldiv-root .a { font:600 15px var(--sans);fill:var(--accent) }
      #math-flow-muldiv-root .big { font:400 44px var(--serif);fill:var(--ink) }
      #math-flow-muldiv-root .mid { font:400 34px var(--serif);fill:var(--ink) }
      #math-flow-muldiv-root .n { fill:#ffffff;stroke:var(--ink);stroke-width:1 }
      #math-flow-muldiv-root .na { fill:var(--accent-tint);stroke:var(--accent);stroke-width:1.2 }
      #math-flow-muldiv-root .ns { fill:rgba(31,41,51,0.05);stroke:var(--muted);stroke-width:1 }
      #math-flow-muldiv-root .ln { stroke:var(--ink);stroke-width:1.2;fill:none }
      #math-flow-muldiv-root .lm { stroke:var(--muted);stroke-width:1;fill:none }
      #math-flow-muldiv-root .la { stroke:var(--accent);stroke-width:1.4;fill:none }
      #math-flow-muldiv-root .dash { stroke-dasharray:5 4 }</style><marker id="math-flow-muldiv-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52606d"/></marker><marker id="math-flow-muldiv-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1f51c9"/></marker></defs>
  <rect width="100%" height="100%" fill="#f6f8fc"/>
  <text x="32" y="30" class="e">數學・8-1 乘除兩步驟的計算</text>
<text x="32" y="58" class="h">兩步驟乘除的順序</text>
  <rect x="90" y="130" width="200" height="56" rx="6" class="n"/>
<text x="190" y="164" class="ts" text-anchor="middle">先算乘法：200 × 68</text>
<line x1="190" y1="186" x2="190" y2="210" class="la" marker-end="url(#math-flow-muldiv-arrow-accent)"/>
<rect x="90" y="216" width="200" height="56" rx="6" class="n"/>
<text x="190" y="250" class="ts" text-anchor="middle">再算除法：÷ 32</text>
<text x="60" y="330" class="sb" text-anchor="start">同一條式子裡，要先做乘法再做除法。</text>
</svg>
