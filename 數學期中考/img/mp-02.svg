<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mp-02-title mp-02-desc" id="mp-02-root">
  <title id="mp-02-title">素養題組・一億以內的數</title>
  <desc id="mp-02-desc">某森林遊樂區統計遊客人數：\n前年約 980000 人，去年約 1050000 </desc>
  <defs>
      <style>#mp-02-root { --paper:#f6f8fc;--paper2:#eef2f8;--ink:#1f2933;--muted:#52606d;--soft:#7b8794;
    --rule:#c3ccd8;--accent:#1f51c9;--accent-tint:rgba(31,81,201,0.08);
    --sans:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
    --serif:'Noto Serif TC','Songti TC',serif; }
      #mp-02-root { font-family: var(--sans); color: var(--ink); }
      #mp-02-root .diagram-container { width:100%;overflow-x:auto }
      #mp-02-root text { font-family:var(--sans) }
      #mp-02-root .h { font:400 22px var(--serif);fill:var(--ink) }
      #mp-02-root .e { font:500 12px var(--sans);fill:var(--muted) }
      #mp-02-root .t { font:600 16px var(--sans);fill:var(--ink) }
      #mp-02-root .ts { font:600 15px var(--sans);fill:var(--ink) }
      #mp-02-root .s { font:500 13px var(--sans);fill:var(--soft) }
      #mp-02-root .sb { font:500 13px var(--sans);fill:var(--ink) }
      #mp-02-root .a { font:600 15px var(--sans);fill:var(--accent) }
      #mp-02-root .big { font:400 44px var(--serif);fill:var(--ink) }
      #mp-02-root .mid { font:400 34px var(--serif);fill:var(--ink) }
      #mp-02-root .n { fill:#ffffff;stroke:var(--ink);stroke-width:1 }
      #mp-02-root .na { fill:var(--accent-tint);stroke:var(--accent);stroke-width:1.2 }
      #mp-02-root .ns { fill:rgba(31,41,51,0.05);stroke:var(--muted);stroke-width:1 }
      #mp-02-root .ln { stroke:var(--ink);stroke-width:1.2;fill:none }
      #mp-02-root .lm { stroke:var(--muted);stroke-width:1;fill:none }
      #mp-02-root .la { stroke:var(--accent);stroke-width:1.4;fill:none }
      #mp-02-root .dash { stroke-dasharray:5 4 }</style><marker id="mp-02-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52606d"/></marker><marker id="mp-02-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1f51c9"/></marker></defs>
  <rect width="100%" height="100%" fill="#f6f8fc"/>
  <text x="32" y="30" class="e">素養題組・一億以內的數</text>
<text x="32" y="58" class="h">素養題組・一億以內的數</text>
  <line x1="140" y1="300" x2="140" y2="50" class="ln"/>
<line x1="140" y1="300" x2="560" y2="300" class="ln"/>
<line x1="140" y1="300" x2="560" y2="300" class="lm dash"/>
<text x="128" y="305" class="s" text-anchor="end">0</text>
<line x1="140" y1="204" x2="560" y2="204" class="lm dash"/>
<text x="128" y="209" class="s" text-anchor="end">50</text>
<line x1="140" y1="109" x2="560" y2="109" class="lm dash"/>
<text x="128" y="114" class="s" text-anchor="end">100</text>
<rect x="180" y="113" width="22" height="186" rx="6" class="n"/>
<rect x="180" y="113" width="22" height="186" rx="6" class="na"/>
<text x="191" y="326" class="ts" text-anchor="middle">前年約</text>
<rect x="270" y="100" width="22" height="200" rx="6" class="n"/>
<rect x="270" y="100" width="22" height="200" rx="6" class="na"/>
<text x="281" y="326" class="ts" text-anchor="middle">去年約</text>
<rect x="360" y="277" width="22" height="22" rx="6" class="n"/>
<rect x="360" y="277" width="22" height="22" rx="6" class="na"/>
<text x="371" y="326" class="ts" text-anchor="middle">比去年多</text>
<text x="100" y="42" class="s" text-anchor="end">萬人</text>
<text x="60" y="350" class="sb" text-anchor="start">數字都來自短文，數一數每根長條有幾格。</text>
</svg>
