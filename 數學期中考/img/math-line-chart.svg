<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="math-line-chart-title math-line-chart-desc" id="math-line-chart-root">
  <title id="math-line-chart-title">折線圖的線段在看什麼</title>
  <desc id="math-line-chart-desc">折線圖上有四個點與相鄰兩點連起來的線段。</desc>
  <defs>
      <style>#math-line-chart-root { --paper:#f6f8fc;--paper2:#eef2f8;--ink:#1f2933;--muted:#52606d;--soft:#7b8794;
    --rule:#c3ccd8;--accent:#1f51c9;--accent-tint:rgba(31,81,201,0.08);
    --sans:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
    --serif:'Noto Serif TC','Songti TC',serif; }
      #math-line-chart-root { font-family: var(--sans); color: var(--ink); }
      #math-line-chart-root .diagram-container { width:100%;overflow-x:auto }
      #math-line-chart-root text { font-family:var(--sans) }
      #math-line-chart-root .h { font:400 22px var(--serif);fill:var(--ink) }
      #math-line-chart-root .e { font:500 12px var(--sans);fill:var(--muted) }
      #math-line-chart-root .t { font:600 16px var(--sans);fill:var(--ink) }
      #math-line-chart-root .ts { font:600 15px var(--sans);fill:var(--ink) }
      #math-line-chart-root .s { font:500 13px var(--sans);fill:var(--soft) }
      #math-line-chart-root .sb { font:500 13px var(--sans);fill:var(--ink) }
      #math-line-chart-root .a { font:600 15px var(--sans);fill:var(--accent) }
      #math-line-chart-root .big { font:400 44px var(--serif);fill:var(--ink) }
      #math-line-chart-root .mid { font:400 34px var(--serif);fill:var(--ink) }
      #math-line-chart-root .n { fill:#ffffff;stroke:var(--ink);stroke-width:1 }
      #math-line-chart-root .na { fill:var(--accent-tint);stroke:var(--accent);stroke-width:1.2 }
      #math-line-chart-root .ns { fill:rgba(31,41,51,0.05);stroke:var(--muted);stroke-width:1 }
      #math-line-chart-root .ln { stroke:var(--ink);stroke-width:1.2;fill:none }
      #math-line-chart-root .lm { stroke:var(--muted);stroke-width:1;fill:none }
      #math-line-chart-root .la { stroke:var(--accent);stroke-width:1.4;fill:none }
      #math-line-chart-root .dash { stroke-dasharray:5 4 }</style><marker id="math-line-chart-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52606d"/></marker><marker id="math-line-chart-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1f51c9"/></marker></defs>
  <rect width="100%" height="100%" fill="#f6f8fc"/>
  <text x="32" y="30" class="e">數學・10-3 報讀折線圖</text>
<text x="32" y="58" class="h">折線圖的線段在看什麼</text>
  <line x1="140" y1="300" x2="140" y2="130" class="ln"/>
<line x1="140" y1="300" x2="560" y2="300" class="ln"/>
<text x="100" y="122" class="s" text-anchor="end">數量</text>
<line x1="180" y1="250" x2="300" y2="150" class="la" stroke-width="2.4"/>
<line x1="300" y1="150" x2="420" y2="210" class="la" stroke-width="2.4"/>
<line x1="420" y1="210" x2="540" y2="110" class="la" stroke-width="2.4"/>
<circle cx="180" cy="250" r="7" fill="#ffffff" class="la"/>
<text x="180" y="326" class="s" text-anchor="middle">1 月</text>
<circle cx="300" cy="150" r="7" fill="#ffffff" class="la"/>
<text x="300" y="326" class="s" text-anchor="middle">2 月</text>
<circle cx="420" cy="210" r="7" fill="#ffffff" class="la"/>
<text x="420" y="326" class="s" text-anchor="middle">3 月</text>
<circle cx="540" cy="110" r="7" fill="#ffffff" class="la"/>
<text x="540" y="326" class="s" text-anchor="middle">4 月</text>
<text x="60" y="356" class="s" text-anchor="start">把相鄰兩點連起來的線段，就是這一張折線圖要看的部分。</text>
</svg>
