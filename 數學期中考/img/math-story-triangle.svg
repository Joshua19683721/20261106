<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="math-story-triangle-title math-story-triangle-desc" id="math-story-triangle-root">
  <title id="math-story-triangle-title">情境：三角形的內角和</title>
  <desc id="math-story-triangle-desc">三角形與兩條已知角的說明卡。</desc>
  <defs>
      <style>#math-story-triangle-root { --paper:#f6f8fc;--paper2:#eef2f8;--ink:#1f2933;--muted:#52606d;--soft:#7b8794;
    --rule:#c3ccd8;--accent:#1f51c9;--accent-tint:rgba(31,81,201,0.08);
    --sans:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
    --serif:'Noto Serif TC','Songti TC',serif; }
      #math-story-triangle-root { font-family: var(--sans); color: var(--ink); }
      #math-story-triangle-root .diagram-container { width:100%;overflow-x:auto }
      #math-story-triangle-root text { font-family:var(--sans) }
      #math-story-triangle-root .h { font:400 22px var(--serif);fill:var(--ink) }
      #math-story-triangle-root .e { font:500 12px var(--sans);fill:var(--muted) }
      #math-story-triangle-root .t { font:600 16px var(--sans);fill:var(--ink) }
      #math-story-triangle-root .ts { font:600 15px var(--sans);fill:var(--ink) }
      #math-story-triangle-root .s { font:500 13px var(--sans);fill:var(--soft) }
      #math-story-triangle-root .sb { font:500 13px var(--sans);fill:var(--ink) }
      #math-story-triangle-root .a { font:600 15px var(--sans);fill:var(--accent) }
      #math-story-triangle-root .big { font:400 44px var(--serif);fill:var(--ink) }
      #math-story-triangle-root .mid { font:400 34px var(--serif);fill:var(--ink) }
      #math-story-triangle-root .n { fill:#ffffff;stroke:var(--ink);stroke-width:1 }
      #math-story-triangle-root .na { fill:var(--accent-tint);stroke:var(--accent);stroke-width:1.2 }
      #math-story-triangle-root .ns { fill:rgba(31,41,51,0.05);stroke:var(--muted);stroke-width:1 }
      #math-story-triangle-root .ln { stroke:var(--ink);stroke-width:1.2;fill:none }
      #math-story-triangle-root .lm { stroke:var(--muted);stroke-width:1;fill:none }
      #math-story-triangle-root .la { stroke:var(--accent);stroke-width:1.4;fill:none }
      #math-story-triangle-root .dash { stroke-dasharray:5 4 }</style><marker id="math-story-triangle-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52606d"/></marker><marker id="math-story-triangle-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1f51c9"/></marker></defs>
  <rect width="100%" height="100%" fill="#f6f8fc"/>
  <text x="32" y="30" class="e">數學・統整應用</text>
<text x="32" y="58" class="h">情境：三角形的內角和</text>
  <path d="M 90 200 L 130 110 L 170 200 Z" class="ln"/>
<text x="240" y="136" class="ts" text-anchor="start">三角形的內角</text>
<text x="240" y="170" class="s" text-anchor="start">兩個角 65 度、45 度</text>
<text x="240" y="196" class="s" text-anchor="start">三角形內角和 180 度</text>
<text x="60" y="330" class="sb" text-anchor="start">用 180 度減去已知的兩個角，就是第三個角。</text>
</svg>
