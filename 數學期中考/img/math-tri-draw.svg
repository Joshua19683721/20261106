<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="math-tri-draw-title math-tri-draw-desc" id="math-tri-draw-root">
  <title id="math-tri-draw-title">畫三角形的步驟</title>
  <desc id="math-tri-draw-desc">畫三角形的四個步驟卡片。</desc>
  <defs>
      <style>#math-tri-draw-root { --paper:#f6f8fc;--paper2:#eef2f8;--ink:#1f2933;--muted:#52606d;--soft:#7b8794;
    --rule:#c3ccd8;--accent:#1f51c9;--accent-tint:rgba(31,81,201,0.08);
    --sans:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
    --serif:'Noto Serif TC','Songti TC',serif; }
      #math-tri-draw-root { font-family: var(--sans); color: var(--ink); }
      #math-tri-draw-root .diagram-container { width:100%;overflow-x:auto }
      #math-tri-draw-root text { font-family:var(--sans) }
      #math-tri-draw-root .h { font:400 22px var(--serif);fill:var(--ink) }
      #math-tri-draw-root .e { font:500 12px var(--sans);fill:var(--muted) }
      #math-tri-draw-root .t { font:600 16px var(--sans);fill:var(--ink) }
      #math-tri-draw-root .ts { font:600 15px var(--sans);fill:var(--ink) }
      #math-tri-draw-root .s { font:500 13px var(--sans);fill:var(--soft) }
      #math-tri-draw-root .sb { font:500 13px var(--sans);fill:var(--ink) }
      #math-tri-draw-root .a { font:600 15px var(--sans);fill:var(--accent) }
      #math-tri-draw-root .big { font:400 44px var(--serif);fill:var(--ink) }
      #math-tri-draw-root .mid { font:400 34px var(--serif);fill:var(--ink) }
      #math-tri-draw-root .n { fill:#ffffff;stroke:var(--ink);stroke-width:1 }
      #math-tri-draw-root .na { fill:var(--accent-tint);stroke:var(--accent);stroke-width:1.2 }
      #math-tri-draw-root .ns { fill:rgba(31,41,51,0.05);stroke:var(--muted);stroke-width:1 }
      #math-tri-draw-root .ln { stroke:var(--ink);stroke-width:1.2;fill:none }
      #math-tri-draw-root .lm { stroke:var(--muted);stroke-width:1;fill:none }
      #math-tri-draw-root .la { stroke:var(--accent);stroke-width:1.4;fill:none }
      #math-tri-draw-root .dash { stroke-dasharray:5 4 }</style><marker id="math-tri-draw-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52606d"/></marker><marker id="math-tri-draw-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1f51c9"/></marker></defs>
  <rect width="100%" height="100%" fill="#f6f8fc"/>
  <text x="32" y="30" class="e">數學・6-4 繪製三角形</text>
<text x="32" y="58" class="h">畫三角形的步驟</text>
  <rect x="90" y="140" width="200" height="76" rx="6" class="n"/>
<text x="106" y="170" class="sb" text-anchor="start">① 用尺規畫出底邊</text>
<text x="106" y="198" class="s" text-anchor="start">② 量出兩邊一樣長</text>
<rect x="330" y="140" width="200" height="76" rx="6" class="n"/>
<text x="346" y="170" class="sb" text-anchor="start">③ 連成三角形</text>
<text x="346" y="198" class="s" text-anchor="start">④ 量出三個角</text>
<text x="60" y="350" class="sb" text-anchor="start">先畫底邊，再用量角器或圓規畫出需要的角。</text>
</svg>
