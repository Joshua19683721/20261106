<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="math-frac-three-title math-frac-three-desc" id="math-frac-three-root">
  <title id="math-frac-three-title">真分數、假分數與帶分數</title>
  <desc id="math-frac-three-desc">三種分數的分數條對照。</desc>
  <defs>
      <style>#math-frac-three-root { --paper:#f6f8fc;--paper2:#eef2f8;--ink:#1f2933;--muted:#52606d;--soft:#7b8794;
    --rule:#c3ccd8;--accent:#1f51c9;--accent-tint:rgba(31,81,201,0.08);
    --sans:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
    --serif:'Noto Serif TC','Songti TC',serif; }
      #math-frac-three-root { font-family: var(--sans); color: var(--ink); }
      #math-frac-three-root .diagram-container { width:100%;overflow-x:auto }
      #math-frac-three-root text { font-family:var(--sans) }
      #math-frac-three-root .h { font:400 22px var(--serif);fill:var(--ink) }
      #math-frac-three-root .e { font:500 12px var(--sans);fill:var(--muted) }
      #math-frac-three-root .t { font:600 16px var(--sans);fill:var(--ink) }
      #math-frac-three-root .ts { font:600 15px var(--sans);fill:var(--ink) }
      #math-frac-three-root .s { font:500 13px var(--sans);fill:var(--soft) }
      #math-frac-three-root .sb { font:500 13px var(--sans);fill:var(--ink) }
      #math-frac-three-root .a { font:600 15px var(--sans);fill:var(--accent) }
      #math-frac-three-root .big { font:400 44px var(--serif);fill:var(--ink) }
      #math-frac-three-root .mid { font:400 34px var(--serif);fill:var(--ink) }
      #math-frac-three-root .n { fill:#ffffff;stroke:var(--ink);stroke-width:1 }
      #math-frac-three-root .na { fill:var(--accent-tint);stroke:var(--accent);stroke-width:1.2 }
      #math-frac-three-root .ns { fill:rgba(31,41,51,0.05);stroke:var(--muted);stroke-width:1 }
      #math-frac-three-root .ln { stroke:var(--ink);stroke-width:1.2;fill:none }
      #math-frac-three-root .lm { stroke:var(--muted);stroke-width:1;fill:none }
      #math-frac-three-root .la { stroke:var(--accent);stroke-width:1.4;fill:none }
      #math-frac-three-root .dash { stroke-dasharray:5 4 }</style><marker id="math-frac-three-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52606d"/></marker><marker id="math-frac-three-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1f51c9"/></marker></defs>
  <rect width="100%" height="100%" fill="#f6f8fc"/>
  <text x="32" y="30" class="e">數學・9-1 認識真分數、假分數和帶分數</text>
<text x="32" y="58" class="h">真分數、假分數與帶分數</text>
  <rect x="70" y="120" width="180" height="54" rx="4" class="n"/>
<line x1="115" y1="120" x2="115" y2="174" class="lm"/>
<line x1="160" y1="120" x2="160" y2="174" class="lm"/>
<line x1="205" y1="120" x2="205" y2="174" class="lm"/>
<rect x="71" y="121" width="42" height="51" rx="3" class="na"/>
<rect x="116" y="121" width="42" height="51" rx="3" class="na"/>
<text x="160" y="204" class="sb" text-anchor="middle">真分數：分子比分母小</text>
<rect x="300" y="120" width="180" height="54" rx="4" class="n"/>
<line x1="345" y1="120" x2="345" y2="174" class="lm"/>
<line x1="390" y1="120" x2="390" y2="174" class="lm"/>
<line x1="435" y1="120" x2="435" y2="174" class="lm"/>
<rect x="301" y="121" width="42" height="51" rx="3" class="na"/>
<rect x="346" y="121" width="42" height="51" rx="3" class="na"/>
<rect x="391" y="121" width="42" height="51" rx="3" class="na"/>
<rect x="436" y="121" width="42" height="51" rx="3" class="na"/>
<rect x="481" y="121" width="42" height="51" rx="3" class="na"/>
<rect x="526" y="121" width="42" height="51" rx="3" class="na"/>
<text x="390" y="204" class="sb" text-anchor="middle">假分數：分子比分母大</text>
<rect x="70" y="230" width="180" height="54" rx="4" class="n"/>
<line x1="115" y1="230" x2="115" y2="284" class="lm"/>
<line x1="160" y1="230" x2="160" y2="284" class="lm"/>
<line x1="205" y1="230" x2="205" y2="284" class="lm"/>
<rect x="71" y="231" width="42" height="51" rx="3" class="na"/>
<rect x="116" y="231" width="42" height="51" rx="3" class="na"/>
<rect x="161" y="231" width="42" height="51" rx="3" class="na"/>
<text x="160" y="314" class="sb" text-anchor="middle">帶分數：整數＋分數</text>
<rect x="300" y="230" width="180" height="54" rx="4" class="n"/>
<line x1="345" y1="230" x2="345" y2="284" class="lm"/>
<line x1="390" y1="230" x2="390" y2="284" class="lm"/>
<line x1="435" y1="230" x2="435" y2="284" class="lm"/>
<rect x="301" y="231" width="42" height="51" rx="3" class="na"/>
<rect x="346" y="231" width="42" height="51" rx="3" class="na"/>
<text x="390" y="250" class="a" text-anchor="start">＝ 1 又 1/4</text>
<text x="60" y="330" class="sb" text-anchor="start">看分母和分子的大小關係，就能分出三種分數。</text>
</svg>
