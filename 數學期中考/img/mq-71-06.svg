<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mq-71-06-title mq-71-06-desc" id="mq-71-06-root">
  <title id="mq-71-06-title">認識二位小數</title>
  <desc id="mq-71-06-desc">2.09 中的「9」表示多少？</desc>
  <defs>
      <style>#mq-71-06-root { --paper:#f6f8fc;--paper2:#eef2f8;--ink:#1f2933;--muted:#52606d;--soft:#7b8794;
    --rule:#c3ccd8;--accent:#1f51c9;--accent-tint:rgba(31,81,201,0.08);
    --sans:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
    --serif:'Noto Serif TC','Songti TC',serif; }
      #mq-71-06-root { font-family: var(--sans); color: var(--ink); }
      #mq-71-06-root .diagram-container { width:100%;overflow-x:auto }
      #mq-71-06-root text { font-family:var(--sans) }
      #mq-71-06-root .h { font:400 22px var(--serif);fill:var(--ink) }
      #mq-71-06-root .e { font:500 12px var(--sans);fill:var(--muted) }
      #mq-71-06-root .t { font:600 16px var(--sans);fill:var(--ink) }
      #mq-71-06-root .ts { font:600 15px var(--sans);fill:var(--ink) }
      #mq-71-06-root .s { font:500 13px var(--sans);fill:var(--soft) }
      #mq-71-06-root .sb { font:500 13px var(--sans);fill:var(--ink) }
      #mq-71-06-root .a { font:600 15px var(--sans);fill:var(--accent) }
      #mq-71-06-root .big { font:400 44px var(--serif);fill:var(--ink) }
      #mq-71-06-root .mid { font:400 34px var(--serif);fill:var(--ink) }
      #mq-71-06-root .n { fill:#ffffff;stroke:var(--ink);stroke-width:1 }
      #mq-71-06-root .na { fill:var(--accent-tint);stroke:var(--accent);stroke-width:1.2 }
      #mq-71-06-root .ns { fill:rgba(31,41,51,0.05);stroke:var(--muted);stroke-width:1 }
      #mq-71-06-root .ln { stroke:var(--ink);stroke-width:1.2;fill:none }
      #mq-71-06-root .lm { stroke:var(--muted);stroke-width:1;fill:none }
      #mq-71-06-root .la { stroke:var(--accent);stroke-width:1.4;fill:none }
      #mq-71-06-root .dash { stroke-dasharray:5 4 }</style><marker id="mq-71-06-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52606d"/></marker><marker id="mq-71-06-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1f51c9"/></marker></defs>
  <rect width="100%" height="100%" fill="#f6f8fc"/>
  <text x="32" y="30" class="e">7-1 認識二位小數</text>
<text x="32" y="58" class="h">認識二位小數</text>
  <text x="90" y="140" class="ts" text-anchor="start">小數點</text>
<line x1="90" y1="150" x2="560" y2="150" class="lm dash"/>
<line x1="150" y1="160" x2="150" y2="220" class="lm"/>
<text x="200" y="182" class="s" text-anchor="middle">個位</text>
<text x="200" y="214" class="sb" text-anchor="middle">2</text>
<line x1="250" y1="160" x2="250" y2="220" class="lm"/>
<text x="300" y="182" class="s" text-anchor="middle">十分位</text>
<text x="300" y="214" class="sb" text-anchor="middle">0</text>
<line x1="350" y1="160" x2="350" y2="220" class="lm"/>
<text x="400" y="182" class="s" text-anchor="middle">百分位</text>
<text x="400" y="214" class="sb" text-anchor="middle">9</text>
<text x="60" y="300" class="sb" text-anchor="start">小數點右邊的位，每往右一位就再小十倍。</text>
</svg>
