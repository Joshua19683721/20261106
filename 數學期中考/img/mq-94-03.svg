    --sans:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
    --serif:'Noto Serif TC','Songti TC',serif; }
      #mq-94-03-root { font-family: var(--sans); color: var(--ink); }
      #mq-94-03-root .diagram-container { width:100%;overflow-x:auto }
      #mq-94-03-root text { font-family:var(--sans) }
      #mq-94-03-root .h { font:400 22px var(--serif);fill:var(--ink) }
      #mq-94-03-root .e { font:500 12px var(--sans);fill:var(--muted) }
