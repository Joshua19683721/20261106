  <title id="mq-94-03-title">分數的整數倍</title>
  <desc id="mq-94-03-desc">5/12 × 4 ＝？</desc>
  <defs>
      <style>#mq-94-03-root { --paper:#f6f8fc;--paper2:#eef2f8;--ink:#1f2933;--muted:#52606d;--soft:#7b8794;
