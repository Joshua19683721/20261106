<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mq-61-03-title mq-61-03-desc" id="mq-61-03-root">
  <title id="mq-61-03-title">三角形</title>
  <desc id="mq-61-03-desc">一個三角形有兩個角是 60 度和 70 度，第三個角是幾度？</desc>
  <defs>
      <style>#mq-61-03-root { --paper:#f6f8fc;--paper2:#eef2f8;--ink:#1f2933;--muted:#52606d;--soft:#7b8794;
    --rule:#c3ccd8;--accent:#1f51c9;--accent-tint:rgba(31,81,201,0.08);
    --sans:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
    --serif:'Noto Serif TC','Songti TC',serif; }
      #mq-61-03-root { font-family: var(--sans); color: var(--ink); }
      #mq-61-03-root .diagram-container { width:100%;overflow-x:auto }
      #mq-61-03-root text { font-family:var(--sans) }
      #mq-61-03-root .h { font:400 22px var(--serif);fill:var(--ink) }
      #mq-61-03-root .e { font:500 12px var(--sans);fill:var(--muted) }
      #mq-61-03-root .t { font:600 16px var(--sans);fill:var(--ink) }
      #mq-61-03-root .ts { font:600 15px var(--sans);fill:var(--ink) }
      #mq-61-03-root .s { font:500 13px var(--sans);fill:var(--soft) }
      #mq-61-03-root .sb { font:500 13px var(--sans);fill:var(--ink) }
      #mq-61-03-root .a { font:600 15px var(--sans);fill:var(--accent) }
      #mq-61-03-root .big { font:400 44px var(--serif);fill:var(--ink) }
      #mq-61-03-root .mid { font:400 34px var(--serif);fill:var(--ink) }
      #mq-61-03-root .n { fill:#ffffff;stroke:var(--ink);stroke-width:1 }
      #mq-61-03-root .na { fill:var(--accent-tint);stroke:var(--accent);stroke-width:1.2 }
      #mq-61-03-root .ns { fill:rgba(31,41,51,0.05);stroke:var(--muted);stroke-width:1 }
      #mq-61-03-root .ln { stroke:var(--ink);stroke-width:1.2;fill:none }
      #mq-61-03-root .lm { stroke:var(--muted);stroke-width:1;fill:none }
      #mq-61-03-root .la { stroke:var(--accent);stroke-width:1.4;fill:none }
      #mq-61-03-root .dash { stroke-dasharray:5 4 }</style><marker id="mq-61-03-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52606d"/></marker><marker id="mq-61-03-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1f51c9"/></marker></defs>
  <rect width="100%" height="100%" fill="#f6f8fc"/>
  <text x="32" y="30" class="e">6-1 三角形</text>
<text x="32" y="58" class="h">三角形</text>
  <path d="M 200 270 L 250 140 L 400 270 Z" class="ln"/>
<text x="228" y="230" class="a" text-anchor="start">60°</text>
<text x="330" y="196" class="a" text-anchor="start">70°</text>
<text x="300" y="300" class="a" text-anchor="start">？度</text>
<text x="60" y="330" class="sb" text-anchor="start">三角形三個角合起來是 180 度。</text>
</svg>
