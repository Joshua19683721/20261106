<text x="138" y="209" class="s" text-anchor="end">8</text>
<line x1="150" y1="180" x2="500" y2="180" class="lm dash"/>
<text x="138" y="185" class="s" text-anchor="end">10</text>
<line x1="150" y1="156" x2="500" y2="156" class="lm dash"/>
<text x="138" y="161" class="s" text-anchor="end">12</text>
<line x1="150" y1="132" x2="500" y2="132" class="lm dash"/>
<text x="138" y="137" class="s" text-anchor="end">14</text>
