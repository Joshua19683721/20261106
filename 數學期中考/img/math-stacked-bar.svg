<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="math-stacked-bar-title math-stacked-bar-desc" id="math-stacked-bar-root">
  <title id="math-stacked-bar-title">堆疊長條圖怎麼看</title>
  <desc id="math-stacked-bar-desc">堆疊長條圖的一根長條：下層男生 6 人、上層女生 4 人。</desc>
  <defs>
      <style>#math-stacked-bar-root { --paper:#f6f8fc;--paper2:#eef2f8;--ink:#1f2933;--muted:#52606d;--soft:#7b8794;
    --rule:#c3ccd8;--accent:#1f51c9;--accent-tint:rgba(31,81,201,0.08);
    --sans:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
    --serif:'Noto Serif TC','Songti TC',serif; }
      #math-stacked-bar-root { font-family: var(--sans); color: var(--ink); }
      #math-stacked-bar-root .diagram-container { width:100%;overflow-x:auto }
      #math-stacked-bar-root text { font-family:var(--sans) }
      #math-stacked-bar-root .h { font:400 22px var(--serif);fill:var(--ink) }
      #math-stacked-bar-root .e { font:500 12px var(--sans);fill:var(--muted) }
      #math-stacked-bar-root .t { font:600 16px var(--sans);fill:var(--ink) }
      #math-stacked-bar-root .ts { font:600 15px var(--sans);fill:var(--ink) }
      #math-stacked-bar-root .s { font:500 13px var(--sans);fill:var(--soft) }
      #math-stacked-bar-root .sb { font:500 13px var(--sans);fill:var(--ink) }
      #math-stacked-bar-root .a { font:600 15px var(--sans);fill:var(--accent) }
      #math-stacked-bar-root .big { font:400 44px var(--serif);fill:var(--ink) }
      #math-stacked-bar-root .mid { font:400 34px var(--serif);fill:var(--ink) }
      #math-stacked-bar-root .n { fill:#ffffff;stroke:var(--ink);stroke-width:1 }
      #math-stacked-bar-root .na { fill:var(--accent-tint);stroke:var(--accent);stroke-width:1.2 }
      #math-stacked-bar-root .ns { fill:rgba(31,41,51,0.05);stroke:var(--muted);stroke-width:1 }
      #math-stacked-bar-root .ln { stroke:var(--ink);stroke-width:1.2;fill:none }
      #math-stacked-bar-root .lm { stroke:var(--muted);stroke-width:1;fill:none }
      #math-stacked-bar-root .la { stroke:var(--accent);stroke-width:1.4;fill:none }
      #math-stacked-bar-root .dash { stroke-dasharray:5 4 }</style><marker id="math-stacked-bar-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52606d"/></marker><marker id="math-stacked-bar-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1f51c9"/></marker></defs>
  <rect width="100%" height="100%" fill="#f6f8fc"/>
  <text x="32" y="30" class="e">數學・10-4 報讀複雜的統計圖</text>
<text x="32" y="58" class="h">堆疊長條圖怎麼看</text>
  <line x1="150" y1="300" x2="150" y2="108" class="ln"/>
