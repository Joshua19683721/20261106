<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="math-tri-side-title math-tri-side-desc" id="math-tri-side-root">
  <title id="math-tri-side-title">以邊分類的三角形</title>
  <desc id="math-tri-side-desc">正三角形、等腰三角形與不等邊三角形。</desc>
  <defs>
      <style>#math-tri-side-root { --paper:#f6f8fc;--paper2:#eef2f8;--ink:#1f2933;--muted:#52606d;--soft:#7b8794;
    --rule:#c3ccd8;--accent:#1f51c9;--accent-tint:rgba(31,81,201,0.08);
    --sans:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
    --serif:'Noto Serif TC','Songti TC',serif; }
      #math-tri-side-root { font-family: var(--sans); color: var(--ink); }
      #math-tri-side-root .diagram-container { width:100%;overflow-x:auto }
      #math-tri-side-root text { font-family:var(--sans) }
      #math-tri-side-root .h { font:400 22px var(--serif);fill:var(--ink) }
      #math-tri-side-root .e { font:500 12px var(--sans);fill:var(--muted) }
      #math-tri-side-root .t { font:600 16px var(--sans);fill:var(--ink) }
      #math-tri-side-root .ts { font:600 15px var(--sans);fill:var(--ink) }
      #math-tri-side-root .s { font:500 13px var(--sans);fill:var(--soft) }
      #math-tri-side-root .sb { font:500 13px var(--sans);fill:var(--ink) }
      #math-tri-side-root .a { font:600 15px var(--sans);fill:var(--accent) }
      #math-tri-side-root .big { font:400 44px var(--serif);fill:var(--ink) }
      #math-tri-side-root .mid { font:400 34px var(--serif);fill:var(--ink) }
      #math-tri-side-root .n { fill:#ffffff;stroke:var(--ink);stroke-width:1 }
      #math-tri-side-root .na { fill:var(--accent-tint);stroke:var(--accent);stroke-width:1.2 }
      #math-tri-side-root .ns { fill:rgba(31,41,51,0.05);stroke:var(--muted);stroke-width:1 }
      #math-tri-side-root .ln { stroke:var(--ink);stroke-width:1.2;fill:none }
      #math-tri-side-root .lm { stroke:var(--muted);stroke-width:1;fill:none }
      #math-tri-side-root .la { stroke:var(--accent);stroke-width:1.4;fill:none }
      #math-tri-side-root .dash { stroke-dasharray:5 4 }</style><marker id="math-tri-side-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52606d"/></marker><marker id="math-tri-side-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1f51c9"/></marker></defs>
  <rect width="100%" height="100%" fill="#f6f8fc"/>
  <text x="32" y="30" class="e">數學・6-2 以邊分類三角形</text>
<text x="32" y="58" class="h">以邊分類的三角形</text>
  <path d="M 110 150 L 66 260 L 154 260 Z" class="ln"/>
<text x="110" y="288" class="s" text-anchor="middle">三邊都一樣長</text>
<path d="M 110 150 L 78 260 L 142 260 Z" class="ln"/>
<text x="110" y="288" class="s" text-anchor="middle">兩邊一樣長</text>
<path d="M 66 260 L 154 260 L 110 180 Z" class="ln"/>
<text x="110" y="288" class="s" text-anchor="middle">三邊都不一樣長</text>
<text x="60" y="330" class="sb" text-anchor="start">看三條邊是不是一樣長，就能分出三種三角形。</text>
</svg>
