  <defs>
      <style>#mq-33-06-root { --paper:#f6f8fc;--paper2:#eef2f8;--ink:#1f2933;--muted:#52606d;--soft:#7b8794;
    --rule:#c3ccd8;--accent:#1f51c9;--accent-tint:rgba(31,81,201,0.08);
    --sans:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
    --serif:'Noto Serif TC','Songti TC',serif; }
      #mq-33-06-root { font-family: var(--sans); color: var(--ink); }
      #mq-33-06-root .diagram-container { width:100%;overflow-x:auto }
      #mq-33-06-root text { font-family:var(--sans) }
      #mq-33-06-root .h { font:400 22px var(--serif);fill:var(--ink) }
      #mq-33-06-root .e { font:500 12px var(--sans);fill:var(--muted) }
      #mq-33-06-root .t { font:600 16px var(--sans);fill:var(--ink) }
      #mq-33-06-root .ts { font:600 15px var(--sans);fill:var(--ink) }
      #mq-33-06-root .s { font:500 13px var(--sans);fill:var(--soft) }
      #mq-33-06-root .sb { font:500 13px var(--sans);fill:var(--ink) }
      #mq-33-06-root .a { font:600 15px var(--sans);fill:var(--accent) }
      #mq-33-06-root .big { font:400 44px var(--serif);fill:var(--ink) }
      #mq-33-06-root .mid { font:400 34px var(--serif);fill:var(--ink) }
      #mq-33-06-root .n { fill:#ffffff;stroke:var(--ink);stroke-width:1 }
      #mq-33-06-root .na { fill:var(--accent-tint);stroke:var(--accent);stroke-width:1.2 }
      #mq-33-06-root .ns { fill:rgba(31,41,51,0.05);stroke:var(--muted);stroke-width:1 }
      #mq-33-06-root .ln { stroke:var(--ink);stroke-width:1.2;fill:none }
      #mq-33-06-root .lm { stroke:var(--muted);stroke-width:1;fill:none }
