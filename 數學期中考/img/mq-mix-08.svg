<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mq-mix-08-title mq-mix-08-desc" id="mq-mix-08-root">
  <title id="mq-mix-08-title">統整應用</title>
  <desc id="mq-mix-08-desc">一個三角形有兩個角是 65 度和 45 度，第三個角是幾度？</desc>
  <defs>
      <style>#mq-mix-08-root { --paper:#f6f8fc;--paper2:#eef2f8;--ink:#1f2933;--muted:#52606d;--soft:#7b8794;
    --rule:#c3ccd8;--accent:#1f51c9;--accent-tint:rgba(31,81,201,0.08);
    --sans:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
    --serif:'Noto Serif TC','Songti TC',serif; }
      #mq-mix-08-root { font-family: var(--sans); color: var(--ink); }
      #mq-mix-08-root .diagram-container { width:100%;overflow-x:auto }
      #mq-mix-08-root text { font-family:var(--sans) }
      #mq-mix-08-root .h { font:400 22px var(--serif);fill:var(--ink) }
      #mq-mix-08-root .e { font:500 12px var(--sans);fill:var(--muted) }
      #mq-mix-08-root .t { font:600 16px var(--sans);fill:var(--ink) }
      #mq-mix-08-root .ts { font:600 15px var(--sans);fill:var(--ink) }
      #mq-mix-08-root .s { font:500 13px var(--sans);fill:var(--soft) }
      #mq-mix-08-root .sb { font:500 13px var(--sans);fill:var(--ink) }
      #mq-mix-08-root .a { font:600 15px var(--sans);fill:var(--accent) }
      #mq-mix-08-root .big { font:400 44px var(--serif);fill:var(--ink) }
      #mq-mix-08-root .mid { font:400 34px var(--serif);fill:var(--ink) }
      #mq-mix-08-root .n { fill:#ffffff;stroke:var(--ink);stroke-width:1 }
      #mq-mix-08-root .na { fill:var(--accent-tint);stroke:var(--accent);stroke-width:1.2 }
      #mq-mix-08-root .ns { fill:rgba(31,41,51,0.05);stroke:var(--muted);stroke-width:1 }
      #mq-mix-08-root .ln { stroke:var(--ink);stroke-width:1.2;fill:none }
      #mq-mix-08-root .lm { stroke:var(--muted);stroke-width:1;fill:none }
      #mq-mix-08-root .la { stroke:var(--accent);stroke-width:1.4;fill:none }
      #mq-mix-08-root .dash { stroke-dasharray:5 4 }</style><marker id="mq-mix-08-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52606d"/></marker><marker id="mq-mix-08-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1f51c9"/></marker></defs>
  <rect width="100%" height="100%" fill="#f6f8fc"/>
  <text x="32" y="30" class="e">統整應用 統整應用</text>
<text x="32" y="58" class="h">統整應用</text>
  <text x="60" y="120" class="ts" text-anchor="start">三角形內角和</text>
<path d="M 120 260 L 190 140 L 380 260 Z" class="ln"/>
<text x="200" y="240" class="a" text-anchor="middle">65°</text>
<text x="320" y="240" class="a" text-anchor="middle">45°</text>
<text x="250" y="300" class="a" text-anchor="middle">？度</text>
<text x="60" y="340" class="sb" text-anchor="start">題目裡的數字，都可以在圖上找到。</text>
</svg>
