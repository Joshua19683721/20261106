<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="math-mixed-fraction-title math-mixed-fraction-desc" id="math-mixed-fraction-root">
  <title id="math-mixed-fraction-title">帶分數換成假分數</title>
  <desc id="math-mixed-fraction-desc">3 個整數加上 2/7 個整數，7 份中的其中 2 份以深色標出。</desc>
  <defs>
      <style>#math-mixed-fraction-root { --paper:#f6f8fc;--paper2:#eef2f8;--ink:#1f2933;--muted:#52606d;--soft:#7b8794;
    --rule:#c3ccd8;--accent:#1f51c9;--accent-tint:rgba(31,81,201,0.08);
    --sans:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
    --serif:'Noto Serif TC','Songti TC',serif; }
      #math-mixed-fraction-root { font-family: var(--sans); color: var(--ink); }
      #math-mixed-fraction-root .diagram-container { width:100%;overflow-x:auto }
      #math-mixed-fraction-root text { font-family:var(--sans) }
      #math-mixed-fraction-root .h { font:400 22px var(--serif);fill:var(--ink) }
      #math-mixed-fraction-root .e { font:500 12px var(--sans);fill:var(--muted) }
      #math-mixed-fraction-root .t { font:600 16px var(--sans);fill:var(--ink) }
      #math-mixed-fraction-root .ts { font:600 15px var(--sans);fill:var(--ink) }
      #math-mixed-fraction-root .s { font:500 13px var(--sans);fill:var(--soft) }
      #math-mixed-fraction-root .sb { font:500 13px var(--sans);fill:var(--ink) }
      #math-mixed-fraction-root .a { font:600 15px var(--sans);fill:var(--accent) }
      #math-mixed-fraction-root .big { font:400 44px var(--serif);fill:var(--ink) }
      #math-mixed-fraction-root .mid { font:400 34px var(--serif);fill:var(--ink) }
      #math-mixed-fraction-root .n { fill:#ffffff;stroke:var(--ink);stroke-width:1 }
      #math-mixed-fraction-root .na { fill:var(--accent-tint);stroke:var(--accent);stroke-width:1.2 }
      #math-mixed-fraction-root .ns { fill:rgba(31,41,51,0.05);stroke:var(--muted);stroke-width:1 }
      #math-mixed-fraction-root .ln { stroke:var(--ink);stroke-width:1.2;fill:none }
      #math-mixed-fraction-root .lm { stroke:var(--muted);stroke-width:1;fill:none }
      #math-mixed-fraction-root .la { stroke:var(--accent);stroke-width:1.4;fill:none }
      #math-mixed-fraction-root .dash { stroke-dasharray:5 4 }</style><marker id="math-mixed-fraction-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52606d"/></marker><marker id="math-mixed-fraction-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1f51c9"/></marker></defs>
  <rect width="100%" height="100%" fill="#f6f8fc"/>
  <text x="32" y="30" class="e">數學・9-2 假分數與帶分數</text>
<text x="32" y="58" class="h">帶分數換成假分數</text>
  <rect x="90" y="140" width="200" height="60" fill="#ffffff" class="n"/>
<text x="190" y="178" class="mid" text-anchor="middle">1</text>
<rect x="90" y="208" width="200" height="60" fill="#ffffff" class="n"/>
<text x="190" y="246" class="mid" text-anchor="middle">1</text>
<rect x="90" y="276" width="200" height="60" fill="#ffffff" class="n"/>
<text x="190" y="314" class="mid" text-anchor="middle">1</text>
<text x="66" y="336" class="s" text-anchor="end">3 個整數</text>
<rect x="318" y="140" width="28" height="60" rx="2" class="na"/>
<rect x="346" y="140" width="28" height="60" rx="2" class="na"/>
<rect x="374" y="140" width="28" height="60" rx="2" class="ns"/>
<rect x="402" y="140" width="28" height="60" rx="2" class="ns"/>
<rect x="430" y="140" width="28" height="60" rx="2" class="ns"/>
<rect x="458" y="140" width="28" height="60" rx="2" class="ns"/>
<rect x="486" y="140" width="28" height="60" rx="2" class="ns"/>
<line x1="318" y1="140" x2="514" y2="140" class="ln"/>
<text x="416" y="128" class="s" text-anchor="middle">把 1 個整數平均分成 7 份</text>
<text x="346" y="178" class="a" text-anchor="middle">2/7</text>
<text x="90" y="360" class="sb" text-anchor="start">3 又 2/7 ＝ 幾個 1/7？把 3 個整數換成 21 份，再加上 2 份。</text>
</svg>
