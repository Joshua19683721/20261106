<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="math-angle-sum-title math-angle-sum-desc" id="math-angle-sum-root">
  <title id="math-angle-sum-title">角的合成</title>
  <desc id="math-angle-sum-desc">兩個角合成一個平角的示意圖。</desc>
  <defs>
      <style>#math-angle-sum-root { --paper:#f6f8fc;--paper2:#eef2f8;--ink:#1f2933;--muted:#52606d;--soft:#7b8794;
    --rule:#c3ccd8;--accent:#1f51c9;--accent-tint:rgba(31,81,201,0.08);
    --sans:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
    --serif:'Noto Serif TC','Songti TC',serif; }
      #math-angle-sum-root { font-family: var(--sans); color: var(--ink); }
      #math-angle-sum-root .diagram-container { width:100%;overflow-x:auto }
      #math-angle-sum-root text { font-family:var(--sans) }
      #math-angle-sum-root .h { font:400 22px var(--serif);fill:var(--ink) }
      #math-angle-sum-root .e { font:500 12px var(--sans);fill:var(--muted) }
      #math-angle-sum-root .t { font:600 16px var(--sans);fill:var(--ink) }
      #math-angle-sum-root .ts { font:600 15px var(--sans);fill:var(--ink) }
      #math-angle-sum-root .s { font:500 13px var(--sans);fill:var(--soft) }
      #math-angle-sum-root .sb { font:500 13px var(--sans);fill:var(--ink) }
      #math-angle-sum-root .a { font:600 15px var(--sans);fill:var(--accent) }
      #math-angle-sum-root .big { font:400 44px var(--serif);fill:var(--ink) }
      #math-angle-sum-root .mid { font:400 34px var(--serif);fill:var(--ink) }
      #math-angle-sum-root .n { fill:#ffffff;stroke:var(--ink);stroke-width:1 }
      #math-angle-sum-root .na { fill:var(--accent-tint);stroke:var(--accent);stroke-width:1.2 }
      #math-angle-sum-root .ns { fill:rgba(31,41,51,0.05);stroke:var(--muted);stroke-width:1 }
      #math-angle-sum-root .ln { stroke:var(--ink);stroke-width:1.2;fill:none }
      #math-angle-sum-root .lm { stroke:var(--muted);stroke-width:1;fill:none }
      #math-angle-sum-root .la { stroke:var(--accent);stroke-width:1.4;fill:none }
      #math-angle-sum-root .dash { stroke-dasharray:5 4 }</style><marker id="math-angle-sum-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52606d"/></marker><marker id="math-angle-sum-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1f51c9"/></marker></defs>
  <rect width="100%" height="100%" fill="#f6f8fc"/>
  <text x="32" y="30" class="e">數學・3-4 角的合成與分解</text>
<text x="32" y="58" class="h">角的合成</text>
  <line x1="120" y1="260" x2="520" y2="260" class="ln"/>
<line x1="120" y1="260" x2="120" y2="120" class="la" stroke-width="2"/>
<line x1="520" y1="260" x2="520" y2="120" class="la" stroke-width="2"/>
<path d="M 120 260 L 300 260" class="la" stroke-width="2"/>
<text x="200" y="246" class="a" text-anchor="middle">這個角</text>
<text x="430" y="246" class="a" text-anchor="middle">另一個角</text>
<text x="320" y="300" class="sb" text-anchor="middle">合起來剛好是一個平角（180 度）</text>
<text x="60" y="340" class="sb" text-anchor="start">兩個角合起來是平角，就可以用 180 度去算另一個角。</text>
</svg>
