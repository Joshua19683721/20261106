    --sans:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
    --serif:'Noto Serif TC','Songti TC',serif; }
      #math-frac-times-root { font-family: var(--sans); color: var(--ink); }
      #math-frac-times-root .diagram-container { width:100%;overflow-x:auto }
      #math-frac-times-root text { font-family:var(--sans) }
      #math-frac-times-root .h { font:400 22px var(--serif);fill:var(--ink) }
      #math-frac-times-root .e { font:500 12px var(--sans);fill:var(--muted) }
