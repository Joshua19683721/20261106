<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="math-frac-times-title math-frac-times-desc" id="math-frac-times-root">
  <title id="math-frac-times-title">分數乘整數</title>
  <desc id="math-frac-times-desc">5/12 的分數條與 4 個 5/12 併排。</desc>
  <defs>
      <style>#math-frac-times-root { --paper:#f6f8fc;--paper2:#eef2f8;--ink:#1f2933;--muted:#52606d;--soft:#7b8794;
