      #math-frac-times-root .ts { font:600 15px var(--sans);fill:var(--ink) }
      #math-frac-times-root .s { font:500 13px var(--sans);fill:var(--soft) }
      #math-frac-times-root .sb { font:500 13px var(--sans);fill:var(--ink) }
      #math-frac-times-root .a { font:600 15px var(--sans);fill:var(--accent) }
      #math-frac-times-root .big { font:400 44px var(--serif);fill:var(--ink) }
      #math-frac-times-root .mid { font:400 34px var(--serif);fill:var(--ink) }
      #math-frac-times-root .n { fill:#ffffff;stroke:var(--ink);stroke-width:1 }
      #math-frac-times-root .na { fill:var(--accent-tint);stroke:var(--accent);stroke-width:1.2 }
      #math-frac-times-root .ns { fill:rgba(31,41,51,0.05);stroke:var(--muted);stroke-width:1 }
      #math-frac-times-root .ln { stroke:var(--ink);stroke-width:1.2;fill:none }
      #math-frac-times-root .lm { stroke:var(--muted);stroke-width:1;fill:none }
      #math-frac-times-root .la { stroke:var(--accent);stroke-width:1.4;fill:none }
      #math-frac-times-root .dash { stroke-dasharray:5 4 }</style><marker id="math-frac-times-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52606d"/></marker><marker id="math-frac-times-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1f51c9"/></marker></defs>
