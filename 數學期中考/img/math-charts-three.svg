<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="math-charts-three-title math-charts-three-desc" id="math-charts-three-root">
  <title id="math-charts-three-title">長條圖與折線圖</title>
  <desc id="math-charts-three-desc">左邊長條圖、右邊折線圖的小型對照。</desc>
  <defs>
      <style>#math-charts-three-root { --paper:#f6f8fc;--paper2:#eef2f8;--ink:#1f2933;--muted:#52606d;--soft:#7b8794;
    --rule:#c3ccd8;--accent:#1f51c9;--accent-tint:rgba(31,81,201,0.08);
    --sans:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
    --serif:'Noto Serif TC','Songti TC',serif; }
      #math-charts-three-root { font-family: var(--sans); color: var(--ink); }
      #math-charts-three-root .diagram-container { width:100%;overflow-x:auto }
      #math-charts-three-root text { font-family:var(--sans) }
      #math-charts-three-root .h { font:400 22px var(--serif);fill:var(--ink) }
      #math-charts-three-root .e { font:500 12px var(--sans);fill:var(--muted) }
      #math-charts-three-root .t { font:600 16px var(--sans);fill:var(--ink) }
      #math-charts-three-root .ts { font:600 15px var(--sans);fill:var(--ink) }
      #math-charts-three-root .s { font:500 13px var(--sans);fill:var(--soft) }
      #math-charts-three-root .sb { font:500 13px var(--sans);fill:var(--ink) }
      #math-charts-three-root .a { font:600 15px var(--sans);fill:var(--accent) }
      #math-charts-three-root .big { font:400 44px var(--serif);fill:var(--ink) }
      #math-charts-three-root .mid { font:400 34px var(--serif);fill:var(--ink) }
      #math-charts-three-root .n { fill:#ffffff;stroke:var(--ink);stroke-width:1 }
      #math-charts-three-root .na { fill:var(--accent-tint);stroke:var(--accent);stroke-width:1.2 }
      #math-charts-three-root .ns { fill:rgba(31,41,51,0.05);stroke:var(--muted);stroke-width:1 }
      #math-charts-three-root .ln { stroke:var(--ink);stroke-width:1.2;fill:none }
      #math-charts-three-root .lm { stroke:var(--muted);stroke-width:1;fill:none }
      #math-charts-three-root .la { stroke:var(--accent);stroke-width:1.4;fill:none }
      #math-charts-three-root .dash { stroke-dasharray:5 4 }</style><marker id="math-charts-three-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52606d"/></marker><marker id="math-charts-three-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1f51c9"/></marker></defs>
  <rect width="100%" height="100%" fill="#f6f8fc"/>
