<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="math-km-ruler-title math-km-ruler-desc" id="math-km-ruler-root">
  <title id="math-km-ruler-title">公尺和公里怎麼換算</title>
  <desc id="math-km-ruler-desc">公尺尺規：每一大段是 1 公里，等於 1000 公尺。</desc>
  <defs>
      <style>#math-km-ruler-root { --paper:#f6f8fc;--paper2:#eef2f8;--ink:#1f2933;--muted:#52606d;--soft:#7b8794;
    --rule:#c3ccd8;--accent:#1f51c9;--accent-tint:rgba(31,81,201,0.08);
    --sans:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
    --serif:'Noto Serif TC','Songti TC',serif; }
      #math-km-ruler-root { font-family: var(--sans); color: var(--ink); }
      #math-km-ruler-root .diagram-container { width:100%;overflow-x:auto }
      #math-km-ruler-root text { font-family:var(--sans) }
      #math-km-ruler-root .h { font:400 22px var(--serif);fill:var(--ink) }
      #math-km-ruler-root .e { font:500 12px var(--sans);fill:var(--muted) }
      #math-km-ruler-root .t { font:600 16px var(--sans);fill:var(--ink) }
      #math-km-ruler-root .ts { font:600 15px var(--sans);fill:var(--ink) }
      #math-km-ruler-root .s { font:500 13px var(--sans);fill:var(--soft) }
      #math-km-ruler-root .sb { font:500 13px var(--sans);fill:var(--ink) }
      #math-km-ruler-root .a { font:600 15px var(--sans);fill:var(--accent) }
      #math-km-ruler-root .big { font:400 44px var(--serif);fill:var(--ink) }
      #math-km-ruler-root .mid { font:400 34px var(--serif);fill:var(--ink) }
      #math-km-ruler-root .n { fill:#ffffff;stroke:var(--ink);stroke-width:1 }
      #math-km-ruler-root .na { fill:var(--accent-tint);stroke:var(--accent);stroke-width:1.2 }
      #math-km-ruler-root .ns { fill:rgba(31,41,51,0.05);stroke:var(--muted);stroke-width:1 }
      #math-km-ruler-root .ln { stroke:var(--ink);stroke-width:1.2;fill:none }
      #math-km-ruler-root .lm { stroke:var(--muted);stroke-width:1;fill:none }
      #math-km-ruler-root .la { stroke:var(--accent);stroke-width:1.4;fill:none }
      #math-km-ruler-root .dash { stroke-dasharray:5 4 }</style><marker id="math-km-ruler-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52606d"/></marker><marker id="math-km-ruler-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1f51c9"/></marker></defs>
  <rect width="100%" height="100%" fill="#f6f8fc"/>
  <text x="32" y="30" class="e">數學・5-2 公里換算</text>
<text x="32" y="58" class="h">公尺和公里怎麼換算</text>
  <rect x="60" y="176" width="520" height="30" fill="#ffffff" class="n"/>
<line x1="60" y1="176" x2="60" y2="206" class="ln"/>
<line x1="125" y1="194" x2="125" y2="194" class="lm"/>
<text x="60" y="160" class="ts" text-anchor="middle">0</text>
<text x="125" y="230" class="s" text-anchor="middle">500 公尺</text>
<line x1="190" y1="176" x2="190" y2="206" class="ln"/>
<line x1="255" y1="194" x2="255" y2="194" class="lm"/>
<text x="190" y="160" class="ts" text-anchor="middle">1 公里</text>
<text x="255" y="230" class="s" text-anchor="middle">500 公尺</text>
<line x1="320" y1="176" x2="320" y2="206" class="ln"/>
<line x1="385" y1="194" x2="385" y2="194" class="lm"/>
<text x="320" y="160" class="ts" text-anchor="middle">2 公里</text>
<text x="385" y="230" class="s" text-anchor="middle">500 公尺</text>
<text x="580" y="160" class="ts" text-anchor="middle">2 公里</text>
<text x="190" y="262" class="a" text-anchor="middle">1 公里 ＝ 1000 公尺</text>
<text x="60" y="300" class="sb" text-anchor="start">照著尺規算：10 公里 ＝ 幾個 1000 公尺？</text>
<text x="60" y="328" class="s" text-anchor="start">1 段是 1 公里（1000 公尺），10 段就是 10 個 1000 公尺。</text>
</svg>
