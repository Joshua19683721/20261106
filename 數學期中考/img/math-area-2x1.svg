<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="math-area-2x1-title math-area-2x1-desc" id="math-area-2x1-root">
  <title id="math-area-2x1-title">兩位數乘一位數的面積模型</title>
  <desc id="math-area-2x1-desc">3 列 2 欄的方格模型，共 6 個 10 格。</desc>
  <defs>
      <style>#math-area-2x1-root { --paper:#f6f8fc;--paper2:#eef2f8;--ink:#1f2933;--muted:#52606d;--soft:#7b8794;
    --rule:#c3ccd8;--accent:#1f51c9;--accent-tint:rgba(31,81,201,0.08);
    --sans:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
    --serif:'Noto Serif TC','Songti TC',serif; }
      #math-area-2x1-root { font-family: var(--sans); color: var(--ink); }
      #math-area-2x1-root .diagram-container { width:100%;overflow-x:auto }
      #math-area-2x1-root text { font-family:var(--sans) }
      #math-area-2x1-root .h { font:400 22px var(--serif);fill:var(--ink) }
      #math-area-2x1-root .e { font:500 12px var(--sans);fill:var(--muted) }
      #math-area-2x1-root .t { font:600 16px var(--sans);fill:var(--ink) }
      #math-area-2x1-root .ts { font:600 15px var(--sans);fill:var(--ink) }
      #math-area-2x1-root .s { font:500 13px var(--sans);fill:var(--soft) }
      #math-area-2x1-root .sb { font:500 13px var(--sans);fill:var(--ink) }
      #math-area-2x1-root .a { font:600 15px var(--sans);fill:var(--accent) }
      #math-area-2x1-root .big { font:400 44px var(--serif);fill:var(--ink) }
      #math-area-2x1-root .mid { font:400 34px var(--serif);fill:var(--ink) }
      #math-area-2x1-root .n { fill:#ffffff;stroke:var(--ink);stroke-width:1 }
      #math-area-2x1-root .na { fill:var(--accent-tint);stroke:var(--accent);stroke-width:1.2 }
      #math-area-2x1-root .ns { fill:rgba(31,41,51,0.05);stroke:var(--muted);stroke-width:1 }
      #math-area-2x1-root .ln { stroke:var(--ink);stroke-width:1.2;fill:none }
      #math-area-2x1-root .lm { stroke:var(--muted);stroke-width:1;fill:none }
      #math-area-2x1-root .la { stroke:var(--accent);stroke-width:1.4;fill:none }
      #math-area-2x1-root .dash { stroke-dasharray:5 4 }</style><marker id="math-area-2x1-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52606d"/></marker><marker id="math-area-2x1-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1f51c9"/></marker></defs>
  <rect width="100%" height="100%" fill="#f6f8fc"/>
  <text x="32" y="30" class="e">數學・2-1 兩位數乘一位數</text>
<text x="32" y="58" class="h">兩位數乘一位數的面積模型</text>
  <rect x="150" y="140" width="23" height="23" rx="2" class="ns"/>
<rect x="176" y="140" width="23" height="23" rx="2" class="ns"/>
<rect x="150" y="166" width="23" height="23" rx="2" class="ns"/>
<rect x="176" y="166" width="23" height="23" rx="2" class="ns"/>
<rect x="150" y="192" width="23" height="23" rx="2" class="ns"/>
<rect x="176" y="192" width="23" height="23" rx="2" class="ns"/>
<rect x="144" y="134" width="52" height="78" rx="4" class="n" fill="none" opacity="0"/>
<text x="176" y="246" class="s" text-anchor="middle">12</text>
<text x="136" y="179" class="s" text-anchor="end">3 個一</text>
<text x="90" y="300" class="s" text-anchor="start">每組 12 個，</text>
<text x="90" y="324" class="s" text-anchor="start">一共有 3 組</text>
</svg>
