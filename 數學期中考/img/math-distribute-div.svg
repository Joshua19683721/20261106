<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="math-distribute-div-title math-distribute-div-desc" id="math-distribute-div-root">
  <title id="math-distribute-div-title">除法的分配性質</title>
  <desc id="math-distribute-div-desc">72 ÷ 8 ÷ 3 改寫成 72 ÷ (8 × 3) 的示意。</desc>
  <defs>
      <style>#math-distribute-div-root { --paper:#f6f8fc;--paper2:#eef2f8;--ink:#1f2933;--muted:#52606d;--soft:#7b8794;
    --rule:#c3ccd8;--accent:#1f51c9;--accent-tint:rgba(31,81,201,0.08);
    --sans:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
    --serif:'Noto Serif TC','Songti TC',serif; }
      #math-distribute-div-root { font-family: var(--sans); color: var(--ink); }
      #math-distribute-div-root .diagram-container { width:100%;overflow-x:auto }
      #math-distribute-div-root text { font-family:var(--sans) }
      #math-distribute-div-root .h { font:400 22px var(--serif);fill:var(--ink) }
      #math-distribute-div-root .e { font:500 12px var(--sans);fill:var(--muted) }
      #math-distribute-div-root .t { font:600 16px var(--sans);fill:var(--ink) }
      #math-distribute-div-root .ts { font:600 15px var(--sans);fill:var(--ink) }
      #math-distribute-div-root .s { font:500 13px var(--sans);fill:var(--soft) }
      #math-distribute-div-root .sb { font:500 13px var(--sans);fill:var(--ink) }
      #math-distribute-div-root .a { font:600 15px var(--sans);fill:var(--accent) }
      #math-distribute-div-root .big { font:400 44px var(--serif);fill:var(--ink) }
      #math-distribute-div-root .mid { font:400 34px var(--serif);fill:var(--ink) }
      #math-distribute-div-root .n { fill:#ffffff;stroke:var(--ink);stroke-width:1 }
      #math-distribute-div-root .na { fill:var(--accent-tint);stroke:var(--accent);stroke-width:1.2 }
      #math-distribute-div-root .ns { fill:rgba(31,41,51,0.05);stroke:var(--muted);stroke-width:1 }
      #math-distribute-div-root .ln { stroke:var(--ink);stroke-width:1.2;fill:none }
      #math-distribute-div-root .lm { stroke:var(--muted);stroke-width:1;fill:none }
      #math-distribute-div-root .la { stroke:var(--accent);stroke-width:1.4;fill:none }
      #math-distribute-div-root .dash { stroke-dasharray:5 4 }</style><marker id="math-distribute-div-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52606d"/></marker><marker id="math-distribute-div-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1f51c9"/></marker></defs>
  <rect width="100%" height="100%" fill="#f6f8fc"/>
  <text x="32" y="30" class="e">數學・8-4 除法的分配性質</text>
<text x="32" y="58" class="h">除法的分配性質</text>
  <rect x="100" y="150" width="180" height="80" rx="6" class="n"/>
<text x="190" y="190" class="ts" text-anchor="middle">72 ÷ 8 ÷ 3</text>
<rect x="380" y="150" width="180" height="80" rx="6" class="na"/>
<text x="470" y="190" class="ts" text-anchor="middle">72 ÷ (8 × 3)</text>
<line x1="280" y1="190" x2="380" y2="190" class="la" marker-end="url(#math-distribute-div-arrow-accent)"/>
<text x="330" y="170" class="s" text-anchor="middle">括號起來</text>
<text x="60" y="300" class="sb" text-anchor="start">連除可以改成除以括號裡的乘積。</text>
</svg>
